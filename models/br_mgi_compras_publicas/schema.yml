---
version: 2
models:
  - name: br_mgi_compras_publicas__contratacao
    description: >-
      Contratações públicas realizadas sob a Lei 14.133/2021 e divulgadas no PNCP
      por meio do Compras.gov.br, de 2021 em diante. Uma linha por contratação, cobrindo
      os três níveis de governo
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [numero_controle_pncp]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - cnpj_orgao_subrogado
            - codigo_unidade_subrogada
            - esfera_subrogado
            - id_municipio_subrogada
            - nome_municipio_subrogada
            - nome_orgao_subrogado
            - nome_unidade_subrogada
            - poder_subrogado
            - sigla_uf_subrogada
    columns:
      - name: ano
        description: >-
          Ano de publicação da contratação no PNCP
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: sigla_uf
        description: >-
          Sigla da unidade da federação da unidade compradora
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__uf')
              field: sigla
              config:
                where: sigla_uf != 'EX'
      - name: id_municipio
        description: >-
          Código IBGE de 7 dígitos do município da unidade compradora
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__municipio')
              field: id_municipio
      - name: id_compra
        description: >-
          Identificador da contratação no SIASG
      - name: numero_controle_pncp
        description: >-
          Número de controle da contratação no PNCP
        tests: [not_null]
      - name: ano_compra_pncp
        description: >-
          Ano da contratação no numerador do PNCP
      - name: sequencial_compra_pncp
        description: >-
          Número sequencial da contratação no PNCP dentro do ano e do órgão
      - name: numero_compra
        description: >-
          Número da compra atribuído pela unidade compradora
      - name: processo
        description: >-
          Número do processo administrativo da contratação
      - name: codigo_orgao
        description: >-
          Código do órgão comprador no SIASG
      - name: cnpj_orgao
        description: >-
          CNPJ do órgão comprador
      - name: nome_orgao
        description: >-
          Razão social do órgão comprador
      - name: esfera
        description: >-
          Esfera federativa do órgão comprador
      - name: poder
        description: >-
          Poder ao qual o órgão comprador pertence
      - name: codigo_unidade
        description: >-
          Código da UASG compradora
      - name: nome_unidade
        description: >-
          Nome da UASG compradora
      - name: nome_municipio
        description: >-
          Nome do município da unidade compradora
      - name: cnpj_orgao_subrogado
        description: >-
          CNPJ do órgão sub-rogado, quando a contratação foi transferida
      - name: nome_orgao_subrogado
        description: >-
          Razão social do órgão sub-rogado
      - name: esfera_subrogado
        description: >-
          Esfera federativa do órgão sub-rogado
      - name: poder_subrogado
        description: >-
          Poder do órgão sub-rogado
      - name: codigo_unidade_subrogada
        description: >-
          Código da UASG sub-rogada
      - name: nome_unidade_subrogada
        description: >-
          Nome da UASG sub-rogada
      - name: sigla_uf_subrogada
        description: >-
          Sigla da unidade da federação da UASG sub-rogada
      - name: id_municipio_subrogada
        description: >-
          Código IBGE do município da UASG sub-rogada
      - name: nome_municipio_subrogada
        description: >-
          Nome do município da UASG sub-rogada
      - name: codigo_modalidade
        description: >-
          Código da modalidade de contratação no SIASG
      - name: id_modalidade_pncp
        description: >-
          Código da modalidade de contratação no PNCP
      - name: modalidade
        description: >-
          Nome da modalidade de contratação
      - name: id_modo_disputa_pncp
        description: >-
          Código do modo de disputa no PNCP
      - name: codigo_modo_disputa
        description: >-
          Código do modo de disputa no SIASG
      - name: modo_disputa
        description: >-
          Modo de disputa, como aberto, fechado ou aberto-fechado
      - name: codigo_amparo_legal
        description: >-
          Código do amparo legal da contratação no PNCP
      - name: amparo_legal
        description: >-
          Dispositivo legal que ampara a contratação
      - name: descricao_amparo_legal
        description: >-
          Descrição do dispositivo legal que ampara a contratação
      - name: codigo_tipo_instrumento_convocatorio
        description: >-
          Código do tipo de instrumento convocatório no PNCP
      - name: tipo_instrumento_convocatorio
        description: >-
          Tipo de instrumento convocatório, como edital ou aviso de contratação direta
      - name: id_situacao_compra
        description: >-
          Código da situação da contratação no PNCP
      - name: situacao_compra
        description: >-
          Situação da contratação, como divulgada no PNCP, suspensa, revogada ou anulada
      - name: codigo_orcamento_sigiloso
        description: >-
          Código do regime de sigilo do orçamento estimado
      - name: orcamento_sigiloso
        description: >-
          Regime de sigilo do orçamento estimado da contratação
      - name: objeto_compra
        description: >-
          Descrição do objeto da contratação
      - name: informacao_complementar
        description: >-
          Informações complementares publicadas com a contratação
      - name: valor_total_estimado
        description: >-
          Valor total estimado da contratação
      - name: valor_total_homologado
        description: >-
          Valor total homologado da contratação
      - name: indicador_srp
        description: >-
          Indica se a contratação usa Sistema de Registro de Preços
      - name: indicador_existe_resultado
        description: >-
          Indica se a contratação possui resultado registrado
      - name: indicador_contratacao_excluida
        description: >-
          Indica se a contratação foi excluída do PNCP
      - name: data_publicacao_pncp
        description: >-
          Data e hora de publicação da contratação no PNCP
      - name: data_inclusao_pncp
        description: >-
          Data e hora de inclusão da contratação no PNCP
      - name: data_atualizacao_pncp
        description: >-
          Data e hora da última atualização da contratação no PNCP
      - name: data_abertura_proposta
        description: >-
          Data e hora de abertura do prazo de propostas
      - name: data_encerramento_proposta
        description: >-
          Data e hora de encerramento do prazo de propostas
  - name: br_mgi_compras_publicas__contratacao_item
    description: >-
      Itens das contratações realizadas sob a Lei 14.133/2021. Uma linha por item,
      com quantidade, valor estimado e, quando já apurado, o resultado
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [numero_controle_pncp, numero_item_pncp]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - codigo_grupo
            - codigo_pdm
            - descricao_ncm
            - nome_pdm
            - percentual_margem_preferencia_adicional
            - percentual_margem_preferencia_normal
          config:
            where: __most_recent_year__
    columns:
      - name: ano
        description: >-
          Ano de inclusão do item no PNCP
        tests: [not_null]
      - name: id_compra
        description: >-
          Identificador da contratação no SIASG
      - name: id_compra_item
        description: >-
          Identificador do item da contratação no SIASG
      - name: numero_controle_pncp
        description: >-
          Número de controle da contratação no PNCP
        tests: [not_null]
      - name: id_contratacao_pncp
        description: >-
          Número de controle da contratação no PNCP repetido pela fonte
      - name: cnpj_orgao
        description: >-
          CNPJ do órgão comprador
      - name: codigo_unidade
        description: >-
          Código da UASG compradora
      - name: numero_item_pncp
        description: >-
          Número do item na contratação segundo o PNCP
        tests: [not_null]
      - name: numero_item_compra
        description: >-
          Número do item na contratação segundo o SIASG
      - name: numero_grupo
        description: >-
          Número do grupo de itens ao qual o item pertence
      - name: tipo_item
        description: >-
          Indica se o item é material ou serviço
      - name: nome_tipo_item
        description: >-
          Nome do tipo do item
      - name: codigo_item_catalogo
        description: >-
          Código do item nos catálogos CATMAT ou CATSER
      - name: codigo_grupo
        description: >-
          Código do grupo do item no catálogo
      - name: codigo_classe
        description: >-
          Código da classe do item no catálogo
      - name: codigo_pdm
        description: >-
          Código do Padrão Descritivo de Material do item
      - name: nome_pdm
        description: >-
          Nome do Padrão Descritivo de Material do item
      - name: codigo_ncm
        description: >-
          Código NCM da Nomenclatura Comum do Mercosul do item
      - name: descricao_ncm
        description: >-
          Descrição da classificação NCM do item
      - name: descricao_resumida
        description: >-
          Descrição resumida do item
      - name: descricao_detalhada
        description: >-
          Descrição detalhada do item
      - name: unidade_medida
        description: >-
          Unidade de medida do item
      - name: id_item_categoria
        description: >-
          Código da categoria do item no PNCP
      - name: item_categoria
        description: >-
          Categoria do item, como informática, obras ou serviços de engenharia
      - name: id_criterio_julgamento
        description: >-
          Código do critério de julgamento do item no PNCP
      - name: criterio_julgamento
        description: >-
          Critério de julgamento do item, como menor preço ou maior desconto
      - name: id_situacao_item
        description: >-
          Código da situação do item
      - name: situacao_item
        description: >-
          Situação do item, como homologado, deserto, fracassado ou cancelado
      - name: id_tipo_beneficio
        description: >-
          Código do tipo de benefício aplicado ao item
      - name: tipo_beneficio
        description: >-
          Tipo de benefício, como participação exclusiva para microempresas e empresas
          de pequeno porte
      - name: quantidade
        description: >-
          Quantidade licitada do item
      - name: valor_unitario_estimado
        description: >-
          Valor unitário estimado do item
      - name: valor_total
        description: >-
          Valor total estimado do item
      - name: quantidade_resultado
        description: >-
          Quantidade homologada do item
      - name: valor_unitario_resultado
        description: >-
          Valor unitário homologado do item
      - name: valor_total_resultado
        description: >-
          Valor total homologado do item
      - name: id_fornecedor
        description: >-
          CNPJ ou CPF do fornecedor vencedor do item
      - name: nome_fornecedor
        description: >-
          Nome ou razão social do fornecedor vencedor do item
      - name: percentual_margem_preferencia_normal
        description: >-
          Percentual da margem de preferência normal aplicada ao item
      - name: percentual_margem_preferencia_adicional
        description: >-
          Percentual da margem de preferência adicional aplicada ao item
      - name: indicador_orcamento_sigiloso
        description: >-
          Indica se o orçamento estimado do item é sigiloso
      - name: indicador_incentivo_produtivo_basico
        description: >-
          Indica se o item recebe incentivo do Processo Produtivo Básico
      - name: indicador_margem_preferencia_normal
        description: >-
          Indica se foi aplicada margem de preferência normal ao item
      - name: indicador_margem_preferencia_adicional
        description: >-
          Indica se foi aplicada margem de preferência adicional ao item
      - name: indicador_tem_resultado
        description: >-
          Indica se o item possui resultado registrado
      - name: data_inclusao_pncp
        description: >-
          Data e hora de inclusão do item no PNCP
      - name: data_atualizacao_pncp
        description: >-
          Data e hora da última atualização do item no PNCP
      - name: data_resultado
        description: >-
          Data e hora do resultado do item
  - name: br_mgi_compras_publicas__contratacao_item_resultado
    description: >-
      Resultados dos itens das contratações da Lei 14.133/2021. Uma linha por fornecedor
      classificado em cada item, com quantidade e valor homologados
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_compra_item, sequencial_resultado]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - amparo_legal_criterio_desempate
            - amparo_legal_margem_preferencia
            - data_cancelamento_pncp
            - data_cotacao_moeda_estrangeira
            - id_amparo_legal_criterio_desempate
            - id_amparo_legal_margem_preferencia
            - id_moeda_estrangeira
            - id_pais_origem_produto_servico
            - motivo_cancelamento
            - timezone_cotacao_moeda_estrangeira
            - valor_nominal_moeda_estrangeira
          config:
            where: __most_recent_year__
    columns:
      - name: ano
        description: >-
          Ano de divulgação do resultado no PNCP
        tests: [not_null]
      - name: sigla_uf
        description: >-
          Sigla da unidade da federação da unidade compradora
      - name: id_compra
        description: >-
          Identificador da contratação no SIASG
      - name: id_compra_item
        description: >-
          Identificador do item da contratação no SIASG
        tests: [not_null]
      - name: sequencial_resultado
        description: >-
          Número sequencial do resultado dentro do item
        tests: [not_null]
      - name: numero_controle_pncp
        description: >-
          Número de controle da contratação no PNCP
      - name: id_contratacao_pncp
        description: >-
          Número de controle da contratação no PNCP repetido pela fonte
      - name: numero_item_pncp
        description: >-
          Número do item na contratação segundo o PNCP
      - name: cnpj_orgao
        description: >-
          CNPJ do órgão comprador
      - name: codigo_unidade
        description: >-
          Código da UASG compradora
      - name: id_fornecedor
        description: >-
          CNPJ ou CPF do fornecedor
      - name: nome_fornecedor
        description: >-
          Nome ou razão social do fornecedor
      - name: tipo_pessoa
        description: >-
          Indica se o fornecedor é pessoa física ou jurídica
      - name: codigo_pais
        description: >-
          Código ISO de três letras do país do fornecedor
      - name: id_porte_fornecedor
        description: >-
          Código do porte do fornecedor
      - name: porte_fornecedor
        description: >-
          Porte do fornecedor
      - name: id_natureza_juridica
        description: >-
          Código da natureza jurídica do fornecedor
      - name: natureza_juridica
        description: >-
          Natureza jurídica do fornecedor
      - name: ordem_classificacao_srp
        description: >-
          Posição do fornecedor na classificação do sistema de registro de preços
      - name: id_situacao_resultado
        description: >-
          Código da situação do resultado
      - name: situacao_resultado
        description: >-
          Situação do resultado, como informado ou cancelado
      - name: motivo_cancelamento
        description: >-
          Motivo do cancelamento do resultado
      - name: quantidade_homologada
        description: >-
          Quantidade homologada para o fornecedor
      - name: valor_unitario_homologado
        description: >-
          Valor unitário homologado
      - name: valor_total_homologado
        description: >-
          Valor total homologado
      - name: percentual_desconto
        description: >-
          Percentual de desconto ofertado pelo fornecedor
      - name: id_amparo_legal_margem_preferencia
        description: >-
          Código do amparo legal da margem de preferência aplicada
      - name: amparo_legal_margem_preferencia
        description: >-
          Dispositivo legal que ampara a margem de preferência aplicada
      - name: id_amparo_legal_criterio_desempate
        description: >-
          Código do amparo legal do critério de desempate aplicado
      - name: amparo_legal_criterio_desempate
        description: >-
          Dispositivo legal que ampara o critério de desempate aplicado
      - name: id_moeda_estrangeira
        description: >-
          Código da moeda estrangeira da proposta
      - name: valor_nominal_moeda_estrangeira
        description: >-
          Valor nominal da proposta em moeda estrangeira
      - name: data_cotacao_moeda_estrangeira
        description: >-
          Data e hora da cotação da moeda estrangeira
      - name: timezone_cotacao_moeda_estrangeira
        description: >-
          Fuso horário da cotação da moeda estrangeira
      - name: id_pais_origem_produto_servico
        description: >-
          Código do país de origem do produto ou serviço
      - name: indicador_subcontratacao
        description: >-
          Indica se há subcontratação no resultado
      - name: indicador_aplicacao_margem_preferencia
        description: >-
          Indica se foi aplicada margem de preferência
      - name: indicador_aplicacao_beneficio_meepp
        description: >-
          Indica se foi aplicado benefício para microempresas e empresas de pequeno
          porte
      - name: indicador_aplicacao_criterio_desempate
        description: >-
          Indica se foi aplicado critério de desempate
      - name: data_resultado_pncp
        description: >-
          Data e hora do resultado no PNCP
      - name: data_inclusao_pncp
        description: >-
          Data e hora de inclusão do resultado no PNCP
      - name: data_atualizacao_pncp
        description: >-
          Data e hora da última atualização do resultado no PNCP
      - name: data_cancelamento_pncp
        description: >-
          Data e hora do cancelamento do resultado no PNCP
  - name: br_mgi_compras_publicas__ata_registro_preco
    description: >-
      Atas de registro de preços firmadas a partir de contratações da Lei 14.133/2021.
      Uma linha por ata, no estado mais recente informado pela fonte. A fonte não
      atribui número de controle no PNCP a 0,68% das atas, portanto a chave é o par
      id_compra e numero_ata_registro_preco
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_compra, numero_ata_registro_preco]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [data_hora_exclusao]
    columns:
      - name: ano
        description: >-
          Ano de início da vigência da ata
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: numero_controle_pncp_ata
        description: >-
          Número de controle da ata no PNCP
      - name: numero_ata_registro_preco
        description: >-
          Número da ata de registro de preços
        tests: [not_null]
      - name: numero_controle_pncp_compra
        description: >-
          Número de controle da contratação de origem no PNCP
      - name: id_compra
        description: >-
          Identificador da contratação de origem no SIASG
        tests: [not_null]
      - name: numero_compra
        description: >-
          Número da contratação de origem
      - name: ano_compra
        description: >-
          Ano da contratação de origem
      - name: codigo_unidade_gerenciadora
        description: >-
          Código da UASG gerenciadora da ata
      - name: nome_unidade_gerenciadora
        description: >-
          Nome da UASG gerenciadora da ata
      - name: codigo_orgao
        description: >-
          Código do órgão gerenciador no SIASG
      - name: nome_orgao
        description: >-
          Nome do órgão gerenciador
      - name: codigo_modalidade_compra
        description: >-
          Código da modalidade da contratação de origem
      - name: modalidade_compra
        description: >-
          Modalidade da contratação de origem
      - name: status_ata
        description: >-
          Situação da ata, como vigente ou cancelada
      - name: objeto
        description: >-
          Descrição do objeto da ata de registro de preços
      - name: quantidade_itens
        description: >-
          Quantidade de itens registrados na ata
      - name: valor_total
        description: >-
          Valor total registrado na ata
      - name: link_ata_pncp
        description: >-
          Endereço da ata no portal do PNCP
      - name: link_compra_pncp
        description: >-
          Endereço da contratação de origem no portal do PNCP
      - name: indicador_ata_excluida
        description: >-
          Indica se a ata foi excluída do PNCP
      - name: data_assinatura
        description: >-
          Data de assinatura da ata
      - name: data_vigencia_inicial
        description: >-
          Data de início da vigência da ata
      - name: data_vigencia_final
        description: >-
          Data de término da vigência da ata
      - name: data_hora_inclusao
        description: >-
          Data e hora de inclusão da ata no PNCP
      - name: data_hora_atualizacao
        description: >-
          Data e hora da última atualização da ata no PNCP
      - name: data_hora_exclusao
        description: >-
          Data e hora da exclusão da ata do PNCP
  - name: br_mgi_compras_publicas__ata_registro_preco_item
    description: >-
      Itens das atas de registro de preços, com o fornecedor registrado, o preço unitário
      e o limite de adesão. Uma linha por fornecedor classificado em cada item, no
      estado mais recente informado pela fonte
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - numero_controle_pncp_ata
            - numero_item
            - classificacao_fornecedor
          config:
            where: numero_controle_pncp_ata is not null and numero_item is not null
              and classificacao_fornecedor is not null
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [data_hora_exclusao]
    columns:
      - name: ano
        description: >-
          Ano de início da vigência da ata
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: numero_controle_pncp_ata
        description: >-
          Número de controle da ata no PNCP
      - name: numero_item
        description: >-
          Número do item dentro da ata
      - name: classificacao_fornecedor
        description: >-
          Posição do fornecedor na classificação do item
      - name: numero_ata_registro_preco
