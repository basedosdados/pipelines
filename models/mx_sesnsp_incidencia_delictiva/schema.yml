---
version: 2
models:
  - name: mx_sesnsp_incidencia_delictiva__estatal_delitos
    description: >
      Tabla estatal_delitos del conjunto mx_sesnsp_incidencia_delictiva
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['ano', 'mes', 'id_entidad', 'bien_juridico_afectado', 'tipo_delito', 'subtipo_delito', 'modalidad']
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >
          Año de referencia del registro
        tests:
          - not_null
      - name: mes
        description: >
          Mes de referencia del registro, de 1 a 12
        tests:
          - not_null
      - name: id_entidad
        description: >
          Clave de la entidad federativa según INEGI, de dos dígitos
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_mx__estado')
              field: id_estado
      - name: bien_juridico_afectado
        description: >
          Bien jurídico afectado por el delito según la clasificación del SESNSP
      - name: tipo_delito
        description: >
          Tipo de delito según la clasificación del SESNSP
      - name: subtipo_delito
        description: >
          Subtipo de delito según la clasificación del SESNSP
      - name: modalidad
        description: >
          Modalidad del delito según la clasificación del SESNSP
      - name: cantidad
        description: >
          Cantidad de delitos registrados en el mes para la combinación de clasificación y geografía
