---
version: 2
models:
  - name: us_cms_hcris__report
    description: >
      Índice dos relatórios de custos do Medicare (HCRIS) apresentados por hospitais
      certificados pelo Medicare nos Estados Unidos, com uma linha por relatório:
      prestador, período do exercício fiscal, situação, versão do formulário e datas
      de processamento. Corresponde ao arquivo RPT dos extratos trimestrais da CMS
      para os formulários CMS-2552-96 e CMS-2552-10. A chave report_id une esta
      tabela a report_value e a hospital_financial.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [form_version, report_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [npi, special_indicator]
      - custom_dictionary_coverage:
          dictionary_model: ref('us_cms_hcris__dicionario')
          columns_covered_by_dictionary:
            - adr_vendor_code
            - form_version
            - initial_report_indicator
            - last_report_indicator
            - provider_control_type_code
            - report_status_code
            - utilization_code
    columns:
      - name: year
        description: >
          Ano-calendário em que termina o exercício fiscal do período do relatório
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: report_id
        description: >
          Identificador do relatório de custos atribuído pelo HCRIS
        tests: [not_null]
      - name: provider_ccn
        description: >
          CMS Certification Number (CCN) do prestador Medicare
        tests: [not_null]
      - name: state_id
        description: >
          Código FIPS de duas posições do estado onde o hospital está localizado
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: state_abbreviation
        description: >
          Sigla postal de duas letras do estado onde o hospital está localizado
      - name: npi
        description: >
          National Provider Identifier do hospital
      - name: form_version
        description: >
          Formulário de relatório de custos da CMS em que o relatório foi apresentado
      - name: source_extract_year
        description: >
          Ano fiscal federal dos EUA do extrato da CMS em que o relatório foi publicado
      - name: provider_control_type_code
        description: >
          Tipo de propriedade e controle sob o qual o hospital opera
      - name: report_status_code
        description: >
          Situação do relatório de custos
      - name: fiscal_year_begin_date
        description: >
          Primeiro dia do período do relatório de custos
      - name: fiscal_year_end_date
        description: >
          Último dia do período do relatório de custos
      - name: fiscal_year_days
        description: >
          Duração do período do relatório de custos em dias, incluindo ambos os extremos
      - name: process_date
        description: >
          Data em que o relatório de custos foi processado no HCRIS
      - name: initial_report_indicator
        description: >
          Indica se este é o primeiro relatório de custos apresentado pelo prestador
      - name: last_report_indicator
        description: >
          Indica se este é o último relatório de custos apresentado pelo prestador
      - name: transmittal_number
        description: >
          Versão de transmissão do formulário usada para criar o relatório de custos
      - name: fiscal_intermediary_number
        description: >
          Número do intermediário fiscal ou Medicare Administrative Contractor
      - name: adr_vendor_code
        description: >
          Fornecedor de revisão automatizada usado pelo intermediário fiscal
      - name: fiscal_intermediary_create_date
        description: >
          Data em que o intermediário fiscal criou o arquivo HCRIS
      - name: utilization_code
        description: >
          Nível de utilização do Medicare no relatório de custos apresentado
      - name: notice_of_program_reimbursement_date
        description: >
          Data em que o prestador recebeu o Notice of Program Reimbursement
      - name: special_indicator
        description: >
          Código do HCRIS usado para fins especiais
      - name: fiscal_intermediary_receipt_date
        description: >
          Data em que o relatório de custos foi recebido pelo intermediário fiscal
  - name: us_cms_hcris__report_value
    description: >
      Todos os valores declarados nos relatórios de custos do Medicare, em formato
      longo: uma linha por célula (relatório, planilha, linha, coluna), com o valor
      numérico e o valor de texto em colunas separadas. Corresponde aos arquivos
      NMRC e ALPHA dos extratos trimestrais da CMS, unidos pela chave da célula. É
      a
      forma bruta e completa do formulário; as medidas nomeadas de uso corrente
      estão em hospital_financial.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - form_version
            - report_id
            - worksheet_code
            - line_number
            - column_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [alpha_value]
      - custom_dictionary_coverage:
          dictionary_model: ref('us_cms_hcris__dicionario')
          columns_covered_by_dictionary: [form_version]
    columns:
      - name: year
        description: >
          Ano-calendário em que termina o exercício fiscal do período do relatório
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: report_id
        description: >
          Identificador do relatório de custos atribuído pelo HCRIS
        tests: [not_null]
      - name: provider_ccn
        description: >
          CMS Certification Number (CCN) do prestador Medicare
      - name: form_version
        description: >
          Formulário de relatório de custos da CMS em que o relatório foi apresentado
      - name: worksheet_code
        description: >
          Código HCRIS da planilha à qual a célula pertence
        tests: [not_null]
      - name: line_number
        description: >
          Número da linha da célula na planilha
        tests: [not_null]
      - name: column_number
        description: >
          Número da coluna da célula na planilha
        tests: [not_null]
      - name: numeric_value
        description: >
          Valor numérico declarado na célula
      - name: alpha_value
        description: >
          Valor de texto declarado na célula
  - name: us_cms_hcris__hospital_financial
    description: >
      Medidas financeiras e operacionais nomeadas de cada relatório de custos do
      Medicare, uma linha por relatório: receitas, despesas, cobranças, leitos,
      altas, atendimento não remunerado e balanço patrimonial. Cada coluna é
      derivada de um endereço de planilha, linha e coluna do formulário da CMS,
      registrado no campo observations da coluna. O grão é o relatório e não o
      hospital-ano: a CMS documenta que um hospital pode apresentar dois ou mais
      relatórios para o mesmo ano.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [form_version, report_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - beds_burn_intensive_care_unit
            - beds_coronary_care_unit
            - beds_other_special_care
            - beds_surgical_intensive_care_unit
            - uncompensated_care_charges
            - uncompensated_care_cost
      - custom_dictionary_coverage:
          dictionary_model: ref('us_cms_hcris__dicionario')
          columns_covered_by_dictionary: [form_version, report_status_code]
    columns:
      - name: year
        description: >
          Ano-calendário em que termina o exercício fiscal do período do relatório
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: report_id
        description: >
          Identificador do relatório de custos atribuído pelo HCRIS
        tests: [not_null]
      - name: provider_ccn
        description: >
          CMS Certification Number (CCN) do prestador Medicare
        tests: [not_null]
      - name: state_id
        description: >
          Código FIPS de duas posições do estado onde o hospital está localizado
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: state_abbreviation
        description: >
          Sigla postal de duas letras do estado onde o hospital está localizado
      - name: form_version
        description: >
          Formulário de relatório de custos da CMS em que o relatório foi apresentado
      - name: fiscal_year_begin_date
        description: >
          Primeiro dia do período do relatório de custos
      - name: fiscal_year_end_date
        description: >
          Último dia do período do relatório de custos
      - name: fiscal_year_days
        description: >
          Duração do período do relatório de custos em dias, incluindo ambos os extremos
      - name: report_status_code
        description: >
          Situação do relatório de custos
      - name: hospital_name
        description: >
          Nome do hospital conforme declarado na planilha S-2
      - name: street_address
        description: >
          Logradouro do hospital
      - name: city
        description: >
          Cidade do endereço do hospital
      - name: reported_state_abbreviation
        description: >
          Sigla do estado conforme digitada no relatório de custos
      - name: zip_code
        description: >
          Código postal do endereço do hospital
      - name: county_name
        description: >
          Condado do endereço do hospital conforme digitado no relatório de custos
      - name: chain_organization_name
        description: >
          Nome da organização da rede à qual o hospital pertence
      - name: total_patient_charges
        description: >
          Total bruto de cobranças de pacientes antes de deduções e descontos
      - name: contractual_allowances_discounts
        description: >
          Deduções contratuais e descontos sobre contas de pacientes
      - name: net_patient_revenue
        description: >
          Receita líquida de pacientes, cobranças totais menos deduções e descontos
      - name: total_operating_expense
        description: >
          Despesas operacionais totais
      - name: donations
        description: >
          Contribuições e doações sem restrição
      - name: investment_income
        description: >
          Receita de investimentos
      - name: other_income
        description: >
          Outras receitas totais
      - name: total_other_expense
        description: >
          Outras despesas totais
      - name: inpatient_hospital_revenue
        description: >
          Receita de internação do centro de custo hospitalar
      - name: inpatient_general_routine_revenue
        description: >
          Receita total de internação em cuidados gerais de rotina
      - name: inpatient_intensive_care_revenue
        description: >
          Receita total de internação em cuidados intensivos
      - name: inpatient_routine_care_revenue
        description: >
          Receita total de internação em cuidados de rotina, gerais mais intensivos
      - name: inpatient_ancillary_revenue
        description: >
          Receita de serviços auxiliares de internação
      - name: inpatient_outpatient_service_revenue
        description: >
          Receita de internação em centros de custo de serviços ambulatoriais
      - name: inpatient_total_revenue
        description: >
          Receita total de pacientes internados
      - name: outpatient_ancillary_revenue
        description: >
          Receita de serviços auxiliares ambulatoriais
      - name: outpatient_outpatient_service_revenue
        description: >
          Receita ambulatorial em centros de custo de serviços ambulatoriais
      - name: outpatient_total_revenue
        description: >
          Receita total de pacientes ambulatoriais
      - name: total_patient_revenue
        description: >
          Receita total de pacientes, internados mais ambulatoriais
      - name: cost_to_charge_ratio
        description: >
          Razão custo-cobrança do hospital
      - name: uncompensated_care_charges
        description: >
          Cobranças de atendimento não remunerado
      - name: uncompensated_care_cost
        description: >
          Custo do atendimento não remunerado
      - name: total_initial_charity_care_charges
        description: >
          Obrigação inicial total dos pacientes aprovados para atendimento filantrópico
      - name: charity_care_partial_payments
        description: >
          Pagamentos parciais de pacientes aprovados para atendimento filantrópico
      - name: cost_of_initial_charity_care
        description: >
          Custo dos pacientes aprovados para atendimento filantrópico e descontos
          a não
          segurados
      - name: cost_of_charity_care
        description: >
          Custo do atendimento filantrópico
      - name: total_bad_debt_expense
        description: >
          Despesa total com créditos incobráveis
      - name: medicare_reimbursable_bad_debt
        description: >
          Créditos incobráveis reembolsáveis pelo Medicare
      - name: non_medicare_bad_debt_expense
        description: >
          Despesa com créditos incobráveis não Medicare
      - name: non_reimbursable_bad_debt_cost
        description: >
          Custo de créditos incobráveis não Medicare e Medicare não reembolsáveis
      - name: cost_of_uncompensated_care
        description: >
          Custo do atendimento não remunerado
      - name: beds_adult_pediatric
        description: >
          Leitos na unidade de cuidados de rotina de adultos e pediatria
      - name: available_bed_days_adult_pediatric
        description: >
          Leitos-dia disponíveis no período do relatório, adultos e pediatria
      - name: inpatient_bed_days_adult_pediatric
        description: >
          Leitos-dia de internação utilizados, adultos e pediatria
      - name: discharges_adult_pediatric
        description: >
          Total de altas de internação, adultos e pediatria
      - name: discharges_medicare_adult_pediatric
        description: >
          Altas de internação do Medicare (Título XVIII), adultos e pediatria
      - name: discharges_medicaid_adult_pediatric
        description: >
          Altas de internação do Medicaid (Título XIX), adultos e pediatria
      - name: beds_total_adult_pediatric_swing
        description: >
          Total de leitos de adultos e pediatria, incluindo leitos flexíveis
      - name: beds_intensive_care_unit
        description: >
          Leitos de unidade de terapia intensiva, somados sobre as linhas subscritas
      - name: beds_coronary_care_unit
        description: >
          Leitos de unidade coronariana, somados sobre as linhas subscritas
      - name: beds_burn_intensive_care_unit
        description: >
          Leitos de UTI de queimados, somados sobre as linhas subscritas
      - name: beds_surgical_intensive_care_unit
        description: >
          Leitos de UTI cirúrgica, somados sobre as linhas subscritas
      - name: beds_other_special_care
        description: >
          Leitos de outras unidades de cuidados especiais, somados sobre as linhas
          subscritas
      - name: beds_total
        description: >
          Total de leitos hospitalares, incluindo leitos flexíveis e de cuidados
          especiais
      - name: beds_grand_total
        description: >
          Total geral de leitos, incluindo subprovedores, enfermagem especializada
          e
          hospice
      - name: cash
        description: >
          Caixa e bancos
      - name: total_current_assets
        description: >
          Ativo circulante total
      - name: total_fixed_assets
        description: >
          Ativo imobilizado total
      - name: total_current_liabilities
        description: >
          Passivo circulante total
      - name: accumulated_depreciation
        description: >
          Depreciação acumulada, somada sobre as linhas de classes de ativos
      - name: new_capital_assets
        description: >
          Aquisições de ativos de capital no período do relatório
      - name: total_medicare_payment
        description: >
          Pagamento total do Medicare por serviços hospitalares de internação
      - name: secondary_medicare_payment
        description: >
          Pagamento do Medicare como pagador secundário
      - name: value_based_purchasing_adjustment
        description: >
          Ajuste de pagamento do programa Hospital Value-Based Purchasing
      - name: readmissions_reduction_adjustment
        description: >
          Ajuste de pagamento do programa Hospital Readmissions Reduction
      - name: medicare_inpatient_total_cost
        description: >
          Custo total de internação do Medicare
      - name: medicare_inpatient_operating_cost
        description: >
          Custo operacional do programa de internação do Medicare
      - name: medicare_inpatient_routine_charges
        description: >
          Cobranças de serviços de rotina do programa de internação do Medicare
      - name: medicare_inpatient_ancillary_net_charges
        description: >
          Cobranças líquidas de serviços auxiliares do programa de internação do
          Medicare
  - name: us_cms_hcris__dicionario
    description: >
      Dicionário dos códigos usados nas colunas codificadas deste conjunto,
      transcrito da documentação da própria CMS.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >
          Tabela à qual pertence a coluna coberta
        tests: [not_null]
      - name: nome_coluna
        description: >
          Nome da coluna à qual a chave pertence
        tests: [not_null]
      - name: chave
        description: >
          Código tal como armazenado na coluna coberta
        tests: [not_null]
      - name: cobertura_temporal
        description: >
          Cobertura temporal da chave
      - name: valor
        description: >
          Significado do código
        tests: [not_null]
