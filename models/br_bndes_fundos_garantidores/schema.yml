---
version: 2
models:
  - name: br_bndes_fundos_garantidores__operacoes_fgi_tradicional
    description: >
      Operações de crédito com garantia do FGI Tradicional, uma linha por operação,
      conforme publicadas pelo BNDES na Central de Downloads
    columns:
      - name: ano
        description: >
          Ano da solicitação de outorga da garantia
      - name: data_solicitacao_outorga
        description: >
          Data em que o agente financeiro solicitou a outorga da garantia do FGI para
          a operação
      - name: sigla_uf
        description: >
          Sigla da unidade da federação onde o investimento é realizado
      - name: id_municipio
        description: >
          Código IBGE de 7 dígitos do município onde o investimento é realizado
      - name: sigla_uf_sede_cliente
        description: >
          Sigla da unidade da federação da sede do cliente
      - name: id_municipio_sede_cliente
        description: >
          Código IBGE de 7 dígitos do município da sede do cliente
      - name: cpf_cnpj_cliente
        description: >
          CPF ou CNPJ do cliente, mascarado pela fonte
      - name: nome_cliente
        description: >
          Nome do cliente da operação
      - name: porte_cliente
        description: >
          Porte do cliente (Micro, Pequena, Média ou Grande)
      - name: valor_operacao
        description: >
          Valor do crédito concedido na operação
      - name: valor_garantido
        description: >
          Valor da operação coberto pela garantia do FGI
      - name: valor_desembolsado
        description: >
          Valor já liberado ao cliente na operação
      - name: instituicao_financeira_credenciada
        description: >-
          Nome do agente financeiro que contratou a operação e solicitou a garantia
