---
version: 2
models:
  - name: br_pncp__contratacao
    description: >
      Contratações públicas (licitações, dispensas e inexigibilidades)
      divulgadas no Portal Nacional de Contratações Públicas, abrangendo os três
      níveis de governo. Uma linha por contratação, identificada pelo número de
      controle no PNCP.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, id_contratacao_pncp]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
          ignore_values:
            - cnpj_orgao_subrogado
            - codigo_unidade_subrogada
            - data_abertura_proposta
            - data_encerramento_proposta
            - indicador_emenda_parlamentar
            - informacao_complementar
            - justificativa_presencial
            - link_sistema_origem
            - nome_orgao_subrogado
            - nome_unidade_subrogada
            - valor_total_homologado
      - custom_dictionary_coverage:
          dictionary_model: ref('br_pncp__dicionario')
          columns_covered_by_dictionary: [id_esfera, id_poder, id_modalidade, id_modo_disputa, id_situacao_compra, id_tipo_instrumento_convocatorio, codigo_amparo_legal]
          config:
            where: __most_recent_year__
    columns:
      - name: ano
        description: >
          Ano de publicação do registro no PNCP
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year__
      - name: sigla_uf
        description: >
          Sigla da unidade da federação da unidade administrativa responsável
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__uf')
              field: sigla
              config:
                where: __most_recent_year__
      - name: id_municipio
        description: >
          Código IBGE de sete dígitos do município da unidade administrativa
          responsável
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__municipio')
              field: id_municipio
              config:
                where: __most_recent_year__
      - name: id_contratacao_pncp
        description: >
          Número de controle da contratação no PNCP, identificador único do registro
        tests: [not_null]
      - name: ano_compra
        description: >
          Ano da compra atribuído pelo órgão contratante
      - name: sequencial_compra
        description: >
          Número sequencial da compra dentro do órgão e ano
      - name: numero_compra
        description: >
          Número da compra atribuído pelo órgão contratante
      - name: numero_processo
        description: >
          Número do processo administrativo da contratação
      - name: cnpj_orgao
        description: >
          CNPJ do órgão ou entidade contratante
      - name: nome_orgao
        description: >
          Razão social do órgão ou entidade contratante
      - name: id_esfera
        description: >
          Código da esfera de governo do órgão contratante
      - name: id_poder
        description: >
          Código do poder ao qual o órgão contratante pertence
      - name: codigo_unidade
        description: >
          Código da unidade administrativa responsável dentro do órgão
      - name: nome_unidade
        description: >
          Nome da unidade administrativa responsável dentro do órgão
      - name: cnpj_orgao_subrogado
        description: >
          CNPJ do órgão sub-rogado, quando a competência foi transferida
      - name: nome_orgao_subrogado
        description: >
          Razão social do órgão sub-rogado
      - name: codigo_unidade_subrogada
        description: >
          Código da unidade administrativa sub-rogada
      - name: nome_unidade_subrogada
        description: >
          Nome da unidade administrativa sub-rogada
      - name: id_modalidade
        description: >
          Código da modalidade de contratação
      - name: modalidade
        description: >
          Nome da modalidade de contratação
      - name: id_modo_disputa
        description: >
          Código do modo de disputa da contratação
      - name: modo_disputa
        description: >
          Nome do modo de disputa da contratação
      - name: id_situacao_compra
        description: >
          Código da situação da contratação
      - name: situacao_compra
        description: >
          Nome da situação da contratação
      - name: id_tipo_instrumento_convocatorio
        description: >
          Código do tipo de instrumento convocatório
      - name: tipo_instrumento_convocatorio
        description: >
          Nome do tipo de instrumento convocatório
      - name: codigo_amparo_legal
        description: >
          Código do amparo legal invocado para a contratação
      - name: nome_amparo_legal
        description: >
          Nome do dispositivo legal que ampara a contratação
      - name: objeto_compra
        description: >
          Descrição do objeto da contratação
      - name: informacao_complementar
        description: >
          Informação complementar registrada pelo órgão contratante
      - name: justificativa_presencial
        description: >
          Justificativa apresentada para a realização da contratação em formato
          presencial
      - name: indicador_srp
        description: >
          Indica se a contratação usa sistema de registro de preços
      - name: indicador_emenda_parlamentar
        description: >
          Indica se a contratação envolve recursos de emenda parlamentar
      - name: data_abertura_proposta
        description: >
          Data de abertura do recebimento de propostas
      - name: data_encerramento_proposta
        description: >
          Data de encerramento do recebimento de propostas
      - name: data_publicacao
        description: >
          Data de publicação do registro no PNCP
      - name: data_atualizacao
        description: >
          Data da última atualização global do registro no PNCP
      - name: valor_total_estimado
        description: >
          Valor total estimado da contratação
      - name: valor_total_homologado
        description: >
          Valor total homologado da contratação
      - name: link_sistema_origem
        description: >
          Endereço do registro no sistema de origem do órgão contratante
  - name: br_pncp__contrato
    description: >
      Contratos e empenhos decorrentes de contratações públicas divulgados no
      Portal Nacional de Contratações Públicas, abrangendo os três níveis de
      governo. Uma linha por contrato ou empenho; a coluna id_tipo_contrato
      distingue os dois.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, id_contrato_pncp]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
          ignore_values:
            - cnpj_orgao_subrogado
            - codigo_pais_fornecedor
            - codigo_unidade_subrogada
            - id_ata_pncp
            - id_fornecedor_subcontratado
            - indicador_emenda_parlamentar
            - indicador_fruto_adesao
            - informacao_complementar
            - nome_fornecedor_subcontratado
            - nome_orgao_subrogado
            - nome_unidade_subrogada
            - valor_acumulado
      - custom_dictionary_coverage:
          dictionary_model: ref('br_pncp__dicionario')
          columns_covered_by_dictionary: [id_esfera, id_poder, id_tipo_contrato, id_categoria_processo, tipo_pessoa_fornecedor]
          config:
            where: __most_recent_year__
    columns:
      - name: ano
        description: >
          Ano de publicação do registro no PNCP
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year__
      - name: sigla_uf
        description: >
          Sigla da unidade da federação da unidade administrativa responsável
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__uf')
              field: sigla
              config:
                where: __most_recent_year__
      - name: id_municipio
        description: >
          Código IBGE de sete dígitos do município da unidade administrativa
          responsável
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__municipio')
              field: id_municipio
              config:
                where: __most_recent_year__
      - name: id_contrato_pncp
        description: >
          Número de controle do contrato no PNCP, identificador único do registro
        tests: [not_null]
      - name: id_contratacao_pncp
        description: >
          Número de controle no PNCP da contratação que originou o contrato
      - name: id_ata_pncp
        description: >
          Número de controle no PNCP da ata de registro de preços vinculada
      - name: ano_contrato
        description: >
          Ano do contrato atribuído pelo órgão contratante
      - name: sequencial_contrato
        description: >
          Número sequencial do contrato dentro do órgão e ano
      - name: numero_contrato_empenho
        description: >
          Número do contrato ou do empenho atribuído pelo órgão contratante
      - name: numero_processo
        description: >
          Número do processo administrativo do contrato
      - name: cnpj_orgao
        description: >
          CNPJ do órgão ou entidade contratante
      - name: nome_orgao
        description: >
          Razão social do órgão ou entidade contratante
      - name: id_esfera
        description: >
          Código da esfera de governo do órgão contratante
      - name: id_poder
        description: >
          Código do poder ao qual o órgão contratante pertence
      - name: codigo_unidade
        description: >
          Código da unidade administrativa responsável dentro do órgão
      - name: nome_unidade
        description: >
          Nome da unidade administrativa responsável dentro do órgão
      - name: cnpj_orgao_subrogado
        description: >
          CNPJ do órgão sub-rogado, quando a competência foi transferida
      - name: nome_orgao_subrogado
        description: >
          Razão social do órgão sub-rogado
      - name: codigo_unidade_subrogada
        description: >
          Código da unidade administrativa sub-rogada
      - name: nome_unidade_subrogada
        description: >
          Nome da unidade administrativa sub-rogada
      - name: id_tipo_contrato
        description: >
          Código do tipo de contrato
      - name: tipo_contrato
        description: >
          Nome do tipo de contrato
      - name: id_categoria_processo
        description: >
          Código da categoria do objeto contratado
      - name: categoria_processo
        description: >
          Nome da categoria do objeto contratado
      - name: id_fornecedor
        description: >
          Número de inscrição do fornecedor contratado, CNPJ para pessoa jurídica e
          CPF para pessoa física
      - name: nome_fornecedor
        description: >
          Nome ou razão social do fornecedor contratado
      - name: tipo_pessoa_fornecedor
        description: >
          Tipo de pessoa do fornecedor contratado
      - name: codigo_pais_fornecedor
        description: >
          Código do país do fornecedor contratado
      - name: id_fornecedor_subcontratado
        description: >
          Número de inscrição do fornecedor subcontratado
      - name: nome_fornecedor_subcontratado
        description: >
          Nome ou razão social do fornecedor subcontratado
      - name: objeto_contrato
        description: >
          Descrição do objeto do contrato
      - name: informacao_complementar
        description: >
          Informação complementar registrada pelo órgão contratante
      - name: indicador_receita
        description: >
          Indica se o contrato gera receita para a administração em vez de despesa
      - name: indicador_emenda_parlamentar
        description: >
          Indica se o contrato envolve recursos de emenda parlamentar
      - name: indicador_fruto_adesao
        description: >
          Indica se o contrato resulta de adesão a ata de registro de preços de
          outro órgão
      - name: numero_retificacao
        description: >
          Número de retificações aplicadas ao registro do contrato
      - name: numero_parcelas
        description: >
          Número de parcelas previstas para a execução do contrato
      - name: data_assinatura
        description: >
          Data de assinatura do contrato
      - name: data_vigencia_inicio
        description: >
          Data de início da vigência do contrato
      - name: data_vigencia_fim
        description: >
          Data de término da vigência do contrato
      - name: data_publicacao
        description: >
          Data de publicação do registro no PNCP
      - name: data_atualizacao
        description: >
          Data da última atualização global do registro no PNCP
      - name: valor_inicial
        description: >
          Valor inicial do contrato
      - name: valor_parcela
        description: >
          Valor de cada parcela do contrato
      - name: valor_global
        description: >
          Valor global do contrato
      - name: valor_acumulado
        description: >
          Valor acumulado do contrato após termos aditivos e reajustes
  - name: br_pncp__ata_registro_preco
    description: >
      Atas de registro de preços divulgadas no Portal Nacional de Contratações
      Públicas. Uma linha por ata, identificada pelo número de controle no PNCP.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, id_ata_pncp]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
          ignore_values:
            - cnpj_orgao_subrogado
            - codigo_unidade_subrogada
            - data_cancelamento
            - id_ata_pncp
            - nome_orgao_subrogado
            - nome_unidade_subrogada
    columns:
      - name: ano
        description: >
          Ano de publicação do registro no PNCP
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year__
      - name: id_ata_pncp
        description: >
          Número de controle da ata no PNCP, identificador único do registro
        tests: [not_null]
      - name: id_contratacao_pncp
        description: >
          Número de controle no PNCP da contratação que originou a ata
      - name: numero_ata
        description: >
          Número da ata de registro de preços atribuído pelo órgão
      - name: ano_ata
        description: >
          Ano da ata de registro de preços
      - name: cnpj_orgao
        description: >
          CNPJ do órgão ou entidade responsável pela ata
      - name: nome_orgao
        description: >
          Nome do órgão ou entidade responsável pela ata
      - name: codigo_unidade
        description: >
          Código da unidade administrativa responsável pela ata
      - name: nome_unidade
        description: >
          Nome da unidade administrativa responsável pela ata
      - name: cnpj_orgao_subrogado
        description: >
          CNPJ do órgão sub-rogado responsável pela ata
      - name: nome_orgao_subrogado
        description: >
          Nome do órgão sub-rogado responsável pela ata
      - name: codigo_unidade_subrogada
        description: >
          Código da unidade administrativa sub-rogada
      - name: nome_unidade_subrogada
        description: >
          Nome da unidade administrativa sub-rogada
      - name: objeto_contratacao
        description: >
          Descrição do objeto da contratação registrada na ata
      - name: indicador_cancelado
        description: >
          Indica se a ata foi cancelada
      - name: indicador_possibilidade_adesao
        description: >
          Indica se a ata admite adesão por outros órgãos
      - name: data_assinatura
        description: >
          Data de assinatura da ata
      - name: data_vigencia_inicio
        description: >
          Data de início da vigência da ata
      - name: data_vigencia_fim
        description: >
          Data de término da vigência da ata
      - name: data_cancelamento
        description: >
          Data de cancelamento da ata
      - name: data_publicacao
        description: >
          Data de publicação do registro no PNCP
      - name: data_atualizacao
        description: >
          Data da última atualização global do registro no PNCP
  - name: br_pncp__instrumento_cobranca
    description: >
      Instrumentos de cobrança (notas fiscais e faturas) vinculados a contratos
      divulgados no Portal Nacional de Contratações Públicas. Uma linha por
      instrumento de cobrança dentro de um contrato.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, cnpj_orgao, ano_contrato, sequencial_contrato, sequencial_instrumento_cobranca]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
          ignore_values:
            - observacao
      - custom_dictionary_coverage:
          dictionary_model: ref('br_pncp__dicionario')
          columns_covered_by_dictionary: [id_tipo_instrumento_cobranca]
          config:
            where: __most_recent_year__
    columns:
      - name: ano
        description: >
          Ano de publicação do registro no PNCP
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year__
      - name: cnpj_orgao
        description: >
          CNPJ do órgão ou entidade ao qual o instrumento de cobrança se refere
        tests: [not_null]
      - name: ano_contrato
        description: >
          Ano do contrato ao qual o instrumento de cobrança está vinculado
      - name: sequencial_contrato
        description: >
          Número sequencial do contrato ao qual o instrumento de cobrança está
          vinculado
      - name: sequencial_instrumento_cobranca
        description: >
          Número sequencial do instrumento de cobrança dentro do contrato
      - name: id_contrato_pncp
        description: >
          Número de controle no PNCP do contrato ao qual o instrumento de cobrança
          se vincula
      - name: id_tipo_instrumento_cobranca
        description: >
          Código do tipo de instrumento de cobrança
      - name: tipo_instrumento_cobranca
        description: >
          Nome do tipo de instrumento de cobrança
      - name: numero_instrumento_cobranca
        description: >
          Número do instrumento de cobrança
      - name: chave_nfe
        description: >
          Chave de acesso da nota fiscal eletrônica associada
      - name: numero_nfe
        description: >
          Número da nota fiscal eletrônica associada
      - name: serie_nfe
        description: >
          Série da nota fiscal eletrônica associada
      - name: id_emitente_nfe
        description: >
          Número de inscrição do emitente da nota fiscal eletrônica
      - name: nome_emitente_nfe
        description: >
          Nome do emitente da nota fiscal eletrônica
      - name: nome_municipio_emitente_nfe
        description: >
          Nome do município do emitente da nota fiscal eletrônica
      - name: codigo_orgao_destinatario_nfe
        description: >
          Código do órgão destinatário da nota fiscal eletrônica
      - name: nome_orgao_destinatario_nfe
        description: >
          Nome do órgão destinatário da nota fiscal eletrônica
      - name: tipo_evento_recente_nfe
        description: >
          Tipo do evento mais recente registrado na nota fiscal eletrônica
      - name: observacao
        description: >
          Observação registrada sobre o instrumento de cobrança
      - name: data_emissao
        description: >
          Data de emissão do documento de cobrança
      - name: data_inclusao
        description: >
          Data de inclusão do instrumento de cobrança no PNCP
      - name: data_atualizacao
        description: >
          Data da última atualização do instrumento de cobrança no PNCP
      - name: valor_nota_fiscal
        description: >
          Valor total da nota fiscal eletrônica associada
  - name: br_pncp__dicionario
    description: >
      Dicionário de valores codificados das demais tabelas do conjunto, com o
      significado de cada chave por tabela e coluna.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >
          Nome da tabela à qual a chave se refere
        tests: [not_null]
      - name: nome_coluna
        description: >
          Nome da coluna à qual a chave se refere
        tests: [not_null]
      - name: chave
        description: >
          Valor codificado presente na coluna
        tests: [not_null]
      - name: cobertura_temporal
        description: >
          Cobertura temporal da chave
      - name: valor
        description: >
          Significado da chave codificada
        tests: [not_null]
