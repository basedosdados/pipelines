        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: geography
        description: >-
          Geographic area: Australia (national) or one of the eight states and territories
        tests: [not_null]
      - name: sex
        description: >-
