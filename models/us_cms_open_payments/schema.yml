  - name: us_cms_open_payments__ownership
    description: >-
      Participações societárias e de investimento detidas por médicos ou seus familiares
      imediatos em fabricantes e organizações de compras, anos do programa 2013 a
      2025. O
      identificador nacional de prestador só é informado a partir de 2015.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, record_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [recipient_postal_code, recipient_province]
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - change_type
            - physician_primary_type
            - dispute_status
            - interest_held_by_physician_or_family
