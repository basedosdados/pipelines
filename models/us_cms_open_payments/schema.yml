      gerais e de pesquisa.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, teaching_hospital_ccn]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [address_line_2]
    columns:
      - name: year
        description: >-
