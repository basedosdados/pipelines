  - name: us_cms_open_payments__summary_physician
    description: >-
      Totais anuais de pagamento por perfil de médico ou profissional não médico,
      com os
      dados cadastrais do perfil.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, covered_recipient_profile_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - alternate_name_suffix
            - license_state_5
            - name_suffix
            - province
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [profile_type, has_multiple_ids]
          dictionary_model: ref('us_cms_open_payments__dicionario')
    columns:
      - name: year
        description: >-
          Ano do programa a que o registro se refere
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: covered_recipient_profile_id
        description: >-
          Identificador único do perfil do médico ou profissional não médico que recebeu
          o
          pagamento
        tests: [not_null]
      - name: covered_recipient_npi
        description: >-
          National Provider Identifier (NPI) do médico ou profissional não médico
      - name: profile_type
        description: >-
          Tipo do perfil: médico ou profissional não médico
      - name: first_name
        description: >-
          Primeiro nome do profissional conforme a lista mestra de prestadores (MPL)
          fornecida
          pelo CMS
      - name: middle_name
        description: >-
          Nome do meio do profissional conforme a lista mestra de prestadores (MPL)
          fornecida
          pelo CMS
      - name: last_name
        description: >-
          Sobrenome do profissional conforme a lista mestra de prestadores (MPL) fornecida
          pelo
          CMS
      - name: name_suffix
        description: >-
          Sufixo do nome do profissional conforme a lista mestra de prestadores (MPL)
          fornecida
          pelo CMS
      - name: alternate_first_name
        description: >-
          Primeiro nome alternativo do profissional registrado na lista mestra de
          prestadores
      - name: alternate_middle_name
        description: >-
          Nome do meio alternativo do profissional registrado na lista mestra de prestadores
      - name: alternate_last_name
        description: >-
          Sobrenome alternativo do profissional registrado na lista mestra de prestadores
      - name: alternate_name_suffix
        description: >-
          Sufixo alternativo do nome do profissional registrado na lista mestra de
          prestadores
      - name: address_line_1
        description: >-
          Primeira linha do endereço de prática do profissional conforme a lista mestra
          de
          prestadores
      - name: address_line_2
        description: >-
          Segunda linha do endereço de prática do profissional conforme a lista mestra
          de
          prestadores
      - name: city
        description: >-
          Cidade do endereço de prática do profissional conforme a lista mestra de
          prestadores
      - name: state
        description: >-
          Sigla de duas letras do estado do endereço de prática do profissional
      - name: zip_code
        description: >-
          CEP do endereço de prática do profissional
      - name: country
        description: >-
          País do endereço de prática do profissional
      - name: province
        description: >-
          Província do endereço de prática do profissional, quando fora dos Estados
          Unidos
      - name: primary_specialty
        description: >-
          Especialidade principal do profissional na taxonomia padronizada de prestadores
      - name: license_state_1
        description: >-
          Sigla de duas letras do estado da licença profissional, licença 1 de 5
      - name: license_state_2
        description: >-
          Sigla de duas letras do estado da licença profissional, licença 2 de 5
      - name: license_state_3
        description: >-
          Sigla de duas letras do estado da licença profissional, licença 3 de 5
      - name: license_state_4
        description: >-
          Sigla de duas letras do estado da licença profissional, licença 4 de 5
      - name: license_state_5
        description: >-
          Sigla de duas letras do estado da licença profissional, licença 5 de 5
      - name: general_payment_amount_total
        description: >-
          Valor total de pagamentos gerais, em dólares americanos
      - name: research_payment_amount_total
        description: >-
          Valor total de pagamentos de pesquisa, em dólares americanos
      - name: ownership_amount_invested_total
        description: >-
          Valor total investido em participação societária, em dólares americanos
      - name: ownership_interest_value_total
        description: >-
          Valor total da participação societária detida, em dólares americanos
      - name: general_transaction_count
        description: >-
          Quantidade de transações de pagamento geral
      - name: research_transaction_count
        description: >-
          Quantidade de transações de pagamento de pesquisa
      - name: ownership_invested_transaction_count
        description: >-
          Quantidade de registros de investimento em participação societária
      - name: ownership_interest_transaction_count
        description: >-
          Quantidade de registros de participação societária detida
      - name: associated_research_payment_amount_total
        description: >-
          Valor total de pagamentos de pesquisa em que o profissional consta como
          pesquisador
          principal, em dólares americanos
      - name: associated_research_transaction_count
        description: >-
          Quantidade de transações de pesquisa em que o profissional consta como pesquisador
          principal
      - name: disputed_transaction_count
        description: >-
          Quantidade de transações contestadas pelo beneficiário
      - name: undisputed_transaction_count
        description: >-
          Quantidade de transações não contestadas
      - name: has_multiple_ids
        description: >-
          Indica se o profissional possui mais de um identificador de perfil no Open
          Payments
  - name: us_cms_open_payments__summary_dashboard
    description: >-
      Métricas agregadas do painel resumo publicado pelo CMS. A publicação original
      traz uma
      coluna por ano do programa; aqui cada par métrica-ano é uma linha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, dashboard_row_number]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do programa a que o registro se refere
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: dashboard_row_number
        description: >-
          Número da linha da métrica no painel resumo publicado pelo CMS
        tests: [not_null]
      - name: metric
        description: >-
          Nome da métrica agregada do painel resumo
      - name: value
        description: >-
          Valor da métrica no ano do programa
  - name: us_cms_open_payments__dicionario
    description: >-
      Dicionário de códigos e rótulos das colunas categóricas das demais tabelas do
      conjunto.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id_tabela
            - nome_coluna
            - chave
            - cobertura_temporal
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >-
          Nome da tabela à qual a chave e o valor se referem
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Nome da coluna à qual a chave e o valor se referem
        tests: [not_null]
      - name: chave
        description: >-
          Código presente nos dados da coluna
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Cobertura temporal a que se aplica o par chave-valor
        tests: [not_null]
      - name: valor
        description: >-
          Rótulo correspondente ao código na coluna
