---
version: 2
models:
  - name: us_cms_open_payments__general
    description: >-
      Pagamentos gerais -- transferências de valor de fabricantes de medicamentos
      e
      dispositivos médicos e de organizações de compras a médicos, profissionais não
      médicos
      e hospitais universitários que não estão ligadas a um estudo de pesquisa. Um
      registro
      por pagamento declarado, anos do programa 2016 a 2025.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, record_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - covered_recipient_license_state_2
            - covered_recipient_license_state_3
            - covered_recipient_license_state_4
            - covered_recipient_license_state_5
            - covered_recipient_name_suffix
            - covered_recipient_primary_type_2
            - covered_recipient_primary_type_3
            - covered_recipient_primary_type_4
            - covered_recipient_primary_type_5
            - covered_recipient_primary_type_6
            - covered_recipient_specialty_2
            - covered_recipient_specialty_3
            - covered_recipient_specialty_4
            - covered_recipient_specialty_5
            - covered_recipient_specialty_6
            - product_category_4
            - product_category_5
            - product_covered_indicator_4
            - product_covered_indicator_5
            - product_name_4
            - product_name_5
            - product_ndc_3
            - product_ndc_4
            - product_ndc_5
            - product_type_4
            - product_type_5
            - recipient_postal_code
            - recipient_province
            - teaching_hospital_ccn
            - teaching_hospital_id
            - teaching_hospital_name
            - third_party_entity_name
            - third_party_equals_covered_recipient_indicator
            - travel_city
            - travel_country
            - travel_state
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - change_type
            - covered_recipient_type
            - covered_recipient_primary_type_1
            - covered_recipient_primary_type_2
            - covered_recipient_primary_type_3
            - covered_recipient_primary_type_4
            - covered_recipient_primary_type_5
            - covered_recipient_primary_type_6
            - payment_form
            - payment_nature
            - physician_ownership_indicator
            - third_party_payment_recipient_indicator
            - charity_indicator
            - third_party_equals_covered_recipient_indicator
            - delay_in_publication_indicator
            - dispute_status
            - related_product_indicator
            - product_covered_indicator_1
            - product_type_1
            - product_covered_indicator_2
            - product_type_2
            - product_covered_indicator_3
            - product_type_3
            - product_covered_indicator_4
            - product_type_4
            - product_covered_indicator_5
            - product_type_5
          dictionary_model: ref('us_cms_open_payments__dicionario')
    columns:
      - name: year
        description: >-
          Ano do programa a que o registro se refere
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: record_id
        description: >-
          Identificador único do registro de pagamento atribuído pelo sistema Open
          Payments
        tests: [not_null]
      - name: covered_recipient_profile_id
        description: >-
          Identificador único do perfil do médico ou profissional não médico que recebeu
          o
          pagamento
      - name: covered_recipient_npi
        description: >-
          National Provider Identifier (NPI) do médico ou profissional não médico
      - name: teaching_hospital_ccn
        description: >-
          CMS Certification Number (CCN) do hospital universitário
      - name: teaching_hospital_id
        description: >-
          Identificador único do hospital universitário atribuído pelo sistema Open
          Payments
      - name: reporting_entity_id
        description: >-
          Identificador único do fabricante ou GPO que declarou o pagamento
      - name: change_type
        description: >-
          Indica se o registro é novo, adicionado, alterado ou inalterado em relação
          à
          publicação anterior
      - name: covered_recipient_type
        description: >-
          Tipo de beneficiário: médico, profissional não médico, hospital universitário
          ou
          entidade não coberta
      - name: teaching_hospital_name
        description: >-
          Nome do hospital universitário, conforme a lista de hospitais universitários
          do CMS
      - name: covered_recipient_first_name
        description: >-
          Primeiro nome do beneficiário, conforme declarado pela entidade declarante
      - name: covered_recipient_middle_name
        description: >-
          Nome do meio do beneficiário, conforme declarado pela entidade declarante
      - name: covered_recipient_last_name
        description: >-
          Sobrenome do beneficiário, conforme declarado pela entidade declarante
      - name: covered_recipient_name_suffix
        description: >-
          Sufixo do nome do beneficiário, conforme declarado pela entidade declarante
      - name: recipient_address_line_1
        description: >-
          Primeira linha do endereço comercial principal do beneficiário
      - name: recipient_address_line_2
        description: >-
          Segunda linha do endereço comercial principal do beneficiário
      - name: recipient_city
        description: >-
          Cidade do endereço comercial principal do beneficiário
      - name: recipient_state
