      - name: user_region_id
        description: Identifier of the user's geoBoundaries ADM1 region
        tests: [not_null]
      - name: friend_region_id
        description: Identifier of the friend's geoBoundaries ADM1 region
        tests: [not_null]
      - name: scaled_sci
        description: >-
          Scaled Social Connectedness Index between the user region and the friend
