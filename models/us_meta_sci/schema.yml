---
version: 2
models:
  - name: us_meta_sci__country
    description: >-
      Social Connectedness Index between pairs of countries (178 countries, all ordered
      pairs
      including each country with itself). Snapshot of Facebook users active in the
      30 days
      before 2026-01-25 with more than 20 friends, published by Meta (Data for Good)
      on the
      Humanitarian Data Exchange in 2026. scaled_sci is rescaled to 1-1,000,000,000
      within
      the source file.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [user_country_id, friend_country_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: user_country_id
        description: ISO 3166-1 alpha-2 code of the user's country
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso2
      - name: friend_country_id
        description: ISO 3166-1 alpha-2 code of the friend's country
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso2
      - name: scaled_sci
        description: >-
          Scaled Social Connectedness Index between the user country and the friend
          country,
          proportional to the probability that a Facebook user in the first is friends
          with
          a Facebook user in the second
        tests: [not_null]
  - name: us_meta_sci__gadm1
    description: >-
      Social Connectedness Index between pairs of GADM level-1 regions (3,168 regions
      in 176
      countries, all ordered pairs). Snapshot of Facebook users active in the 30 days
      before
      2026-01-25 with more than 20 friends, published by Meta (Data for Good) on the
      Humanitarian
      Data Exchange in 2026. scaled_sci is rescaled to 1-1,000,000,000 within the
      source file.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [user_region_id, friend_region_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: user_country_id
        description: ISO 3166-1 alpha-2 code of the user's country
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso2
      - name: friend_country_id
        description: ISO 3166-1 alpha-2 code of the friend's country
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso2
      - name: user_region_id
        description: Identifier of the user's GADM level-1 region
        tests: [not_null]
      - name: friend_region_id
        description: Identifier of the friend's GADM level-1 region
        tests: [not_null]
      - name: scaled_sci
        description: >-
          Scaled Social Connectedness Index between the user region and the friend
          region,
          proportional to the probability that a Facebook user in the first is friends
          with
          a Facebook user in the second
        tests: [not_null]
  - name: us_meta_sci__gadm2
    description: >-
      Social Connectedness Index between pairs of GADM level-2 regions (37,161 regions,
      all
      ordered pairs, 1.38 billion rows). Snapshot of Facebook users active in the
      30 days
      before 2026-01-25 with more than 20 friends, published by Meta (Data for Good)
      on the
      Humanitarian Data Exchange in 2026. scaled_sci is rescaled to 1-1,000,000,000
      within
      the source file.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [user_region_id, friend_region_id]
          config:
            where: user_country_id = 'BR'
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: user_country_id = 'BR'
    columns:
      - name: user_country_id
        description: ISO 3166-1 alpha-2 code of the user's country
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso2
              config:
                where: user_country_id = 'BR'
      - name: friend_country_id
        description: ISO 3166-1 alpha-2 code of the friend's country
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso2
              config:
                where: user_country_id = 'BR'
      - name: user_region_id
        description: Identifier of the user's GADM level-2 region
        tests:
          - not_null:
              config:
                where: user_country_id = 'BR'
      - name: friend_region_id
        description: Identifier of the friend's GADM level-2 region
        tests:
          - not_null:
              config:
                where: user_country_id = 'BR'
      - name: scaled_sci
        description: >-
          Scaled Social Connectedness Index between the user region and the friend
          region,
          proportional to the probability that a Facebook user in the first is friends
          with
          a Facebook user in the second
        tests:
          - not_null:
              config:
                where: user_country_id = 'BR'
