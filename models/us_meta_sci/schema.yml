          a Facebook user in the second
        tests: [not_null]
  - name: us_meta_sci__geoboundaries_adm2
    description: >-
      Social Connectedness Index between pairs of geoBoundaries ADM2 regions (all
      ordered
      pairs). Snapshot of Facebook users active in the 30 days before 2026-01-25 with
      more
      than 20 friends, published by Meta (Data for Good) on the Humanitarian Data
      Exchange
      in 2026. scaled_sci is rescaled to 1-1,000,000,000 within the source file.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [user_region_id, friend_region_id]
          config:
