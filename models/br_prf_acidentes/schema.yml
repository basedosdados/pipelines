      - name: id_municipio
        description: >
          Identificador IBGE de 7 dígitos do município onde o acidente ocorreu
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__municipio')
              field: id_municipio
      - name: id_ocorrencia
        description: >
          Identificador do acidente atribuído pela PRF
        tests: [not_null]
      - name: id_veiculo
        description: >
          Identificador do veículo envolvido, atribuído pela PRF
      - name: id_pessoa
        description: >
          Identificador da pessoa envolvida, atribuído pela PRF
      - name: br
        description: >
          Número da rodovia federal onde o acidente ocorreu
      - name: km
        description: >
          Marco quilométrico da rodovia onde o acidente ocorreu
      - name: latitude
        description: >
          Latitude do local do acidente, em graus decimais
      - name: longitude
        description: >
          Longitude do local do acidente, em graus decimais
      - name: causa_acidente
        description: >
          Causa presumida do acidente registrada pelo policial
      - name: tipo_acidente
        description: >
          Tipo de acidente
      - name: classificacao_acidente
        description: >
          Classificação do acidente quanto à gravidade
      - name: fase_dia
        description: >
          Fase do dia no momento do acidente
      - name: sentido_via
        description: >
          Sentido da via considerando o ponto de colisão
      - name: condicao_metereologica
        description: >
          Condição meteorológica no momento do acidente
      - name: tipo_pista
        description: >
          Tipo da pista quanto ao número de faixas
      - name: tracado_via
        description: >
          Traçado da via no local do acidente
      - name: uso_solo
        description: >
          Característica do local do acidente quanto à ocupação do solo
      - name: tipo_veiculo
        description: >
          Tipo do veículo envolvido
      - name: marca
        description: >
          Marca e modelo do veículo, como registrados pela PRF
      - name: ano_fabricacao_veiculo
        description: >
          Ano de fabricação do veículo envolvido
      - name: tipo_envolvido
        description: >
          Tipo de envolvimento da pessoa no acidente
      - name: estado_fisico
        description: >
          Estado físico da pessoa envolvida, conforme a gravidade das lesões
      - name: idade
        description: >
          Idade da pessoa envolvida, em anos completos
      - name: sexo
        description: >
          Sexo da pessoa envolvida
      - name: indicador_ileso
        description: >
          Indicador de que a pessoa envolvida foi classificada como ileso
      - name: indicador_ferido_leve
        description: >
          Indicador de que a pessoa envolvida foi classificada como com lesões leves
      - name: indicador_ferido_grave
        description: >
          Indicador de que a pessoa envolvida foi classificada como com lesões graves
      - name: indicador_morto
        description: >
          Indicador de que a pessoa envolvida foi classificada como morta
      - name: nacionalidade
        description: >
          Nacionalidade da pessoa envolvida
      - name: naturalidade
        description: >
          Município de naturalidade da pessoa envolvida
      - name: regional
        description: >
          Superintendência regional da PRF responsável pelo trecho
      - name: delegacia
        description: >
          Delegacia da PRF responsável pelo trecho
      - name: uop
        description: >
          Unidade operacional da PRF em cuja circunscrição o acidente ocorreu
      # id_ocorrencia -> ocorrencia carries a tolerance: the source has
      # crash ids present in the person files and absent from the crash
      # file, 876 ids in total, all between 2007 and 2012 and none after.
  - name: br_prf_acidentes__pessoa_causa_tipo
    description: >
      Pessoas envolvidas em acidentes em rodovias federais registrados pela Policia
