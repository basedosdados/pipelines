      de 2017 a 2026. Existe porque, a partir de 2017, um acidente pode ter mais de
      uma causa e mais de um tipo registrados.
    tests:
      # Chave integralmente unica: nenhuma duplicata em 4.479.488 linhas.
      - custom_unique_combinations_of_columns:
          combination_of_columns:
            - ano
            - id_ocorrencia
            - id_pessoa
            - id_veiculo
            - causa_acidente
            - tipo_acidente
            - ordem_tipo_acidente
          proportion_allowed_failures: 0.0
      - not_null_proportion_multiple_columns:
          at_least: 0.05
