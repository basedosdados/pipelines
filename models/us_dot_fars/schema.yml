  - name: us_dot_fars__person
    description: >-
      Um registro por pessoa envolvida em acidente fatal, ocupante ou não do
      veículo, identificado pela chave do acidente somada ao número do veículo
      e ao número da pessoa. Traz idade, sexo, tipo de pessoa, posição no
      veículo, uso de retenção, gravidade da lesão, resultado do teste de
      alcoolemia e, para os falecidos, data e hora do óbito e o intervalo
      entre o acidente e a morte. Fonte: Fatality Analysis Reporting System
      (FARS) da NHTSA. Pedestres, ciclistas e demais não ocupantes recebem
      vehicle_number igual a 0 e não têm correspondência na tabela vehicle. A
      coluna blood_alcohol_content é derivada e harmoniza a mudança de escala
      da fonte em 2015, quando o código passou de concentração vezes 100 para
      concentração vezes 1000; o código original permanece em
      alcohol_test_result_code para preservar as sentinelas de teste recusado,
      não realizado e resultado desconhecido.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - state_id
            - case_number
            - vehicle_number
            - person_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          # Published only over part of the 1975-2024 span, or
          # populated for a small subset of rows by construction,
          # so the pooled non-null share sits below the floor.
          ignore_values:
            - non_motorist_device_type_code
            - non_motorist_device_motorization_code
            - vin_make
            - vin_vehicle_type
            - vin_model_year_code
            - vin_length
            - motorcycle_engine_displacement
            - motorcycle_engine_cycles_code
            - motorcycle_dry_weight
            - engine_displacement_cubic_inch
            - truck_shipping_weight
            - truck_shipping_weight_variance_code
            - wheels_and_drive_wheels_code
            - carburetion
            - cylinders
            - fuel_code
            - original_tire_size
            - truck_ton_rating
            - truck_vin_restraint_type
      - custom_dictionary_coverage:
          dictionary_model: ref('us_dot_fars__dicionario')
          columns_covered_by_dictionary:
            - sex_code
            - person_type_code
            - injury_severity_code
            - seating_position_code
            - restraint_use_code
            - restraint_misuse_code
            - helmet_use_code
            - air_bag_code
            - ejection_code
            - ejection_path_code
            - extrication_code
            - police_reported_alcohol_code
            - alcohol_test_status_code
            - alcohol_test_type_code
            - alcohol_test_result_code
            - drug_involvement_code
            - drug_test_status_code
            - transported_to_facility_code
            - died_at_scene_code
            - work_injury_code
            - race_code
            - hispanic_origin_code
            - non_motorist_location_code
            - body_type_code
            - make_code
            - rollover_code
            - first_harmful_event_code
            - manner_of_collision_code
            - school_bus_related_code
            - death_time_code
            - alcohol_determination_method_code
            - drug_determination_method_code
            - drug_test_type_1_code
            - drug_test_type_2_code
            - drug_test_type_3_code
            - drug_test_result_1_code
            - drug_test_result_2_code
            - drug_test_result_3_code
            - toxicology_test_code
            - person_related_factor_1_code
            - person_related_factor_2_code
            - person_related_factor_3_code
            - helmet_misuse_code
            - non_motorist_device_type_code
            - non_motorist_device_motorization_code
            - striking_vehicle_number_legacy_code
            - roadway_function_class_person_code
            - rural_urban_person_code
            - functional_system_person_code
            - initial_impact_point_code
            - most_damaged_area_code
            - vehicle_role_code
            - fire_occurrence_code
            - emergency_use_code
            - special_use_code
            - tow_vehicle_code
            - make_model_code
            - gross_vehicle_weight_rating_from_code
            - gross_vehicle_weight_rating_to_code
            - final_stage_body_class_code
            - vpic_make_code
            - vpic_model_code
            - vpic_body_class_code
            - vin_model_year_code
            - motorcycle_engine_cycles_code
            - truck_shipping_weight_variance_code
            - truck_weight_rating_code
            - wheels_and_drive_wheels_code
    columns:
      - name: year
        description: >-
          Ano-calendário do acidente
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: state_id
        description: >-
          Código FIPS de duas posições do estado onde ocorreu o acidente
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: case_number
        description: >-
          Número do caso atribuído pelo estado, único dentro do par estado-ano
