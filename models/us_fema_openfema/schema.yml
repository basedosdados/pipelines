---
version: 2
models:
  - name: us_fema_openfema__disaster_declaration
    description: >
      Declarações de desastre emitidas sob o Stafford Act desde 1953, com uma
      linha por área designada (condado ou equivalente) dentro de cada
      declaração. Traz o tipo de declaração, o tipo de incidente, as datas do
      incidente e quais programas de assistência foram declarados.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, disaster_number, place_code]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('us_fema_openfema__dicionario')
          columns_covered_by_dictionary: [declaration_type]
    columns:
      - name: year
        description: >
          Ano de referência, usado como coluna de partição
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: state_id
        description: >
          Código FIPS de duas posições do estado, distrito ou território
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: county_id
        description: >
          Código FIPS de cinco posições do condado
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__county')
              field: id_county
              ignore_values:
                - '02201'
                - '02232'
                - '02261'
                - '02270'
                - '02280'
                - '09001'
                - '09003'
                - '09005'
                - '09007'
                - '09009'
                - '09011'
                - '09013'
                - '09015'
                - '46113'
                - '51515'
                - '32073'
                - '34055'
                - '34085'
                - '35101'
                - '38109'
                - '38141'
                - '46155'
                - '55161'
                - '64002'
                - '64005'
                - '64040'
                - '64060'
                - '68010'
                - '68030'
                - '68040'
                - '68070'
                - '68080'
                - '68090'
                - '68110'
                - '68120'
                - '68140'
                - '68150'
                - '68160'
                - '68170'
                - '68180'
                - '68190'
                - '68300'
                - '68310'
                - '68320'
                - '68330'
                - '68340'
                - '68390'
                - '68400'
                - '68410'
                - '68420'
                - '68430'
                - '69010'
      - name: disaster_number
        description: >
          Número sequencial que designa o evento declarado como desastre
        tests: [not_null]
      - name: place_code
        description: >
          Código interno da FEMA para a localidade designada, formado por
          '99' seguido do código FIPS de três posições do condado
        tests: [not_null]
      - name: fema_declaration_string
        description: >
          Identificador padrão da declaração sob o Stafford Act, formado
          pela concatenação do tipo de declaração, do número do desastre e
          da sigla do estado
      - name: incident_id
        description: >
          Identificador único do incidente; incidentes podem ou não se
          tornar desastres declarados
      - name: state_abbreviation
        description: >
          Sigla de duas letras do estado, distrito ou território
      - name: declaration_type
        description: >
          Código de duas letras que distingue desastre de grande porte,
          emergência e gestão de incêndio
      - name: declaration_date
        description: >
          Data em que o desastre foi declarado
      - name: fy_declared
        description: >
          Ano fiscal federal em que o desastre foi declarado
      - name: incident_type
        description: >
          Tipo primário do incidente, como incêndio ou inundação
      - name: declaration_title
        description: >
          Título atribuído ao desastre
      - name: ih_program_declared
        description: >
          Indica se o programa Individuals and Households foi declarado para
          este desastre
      - name: ia_program_declared
        description: >
          Indica se o programa Individual Assistance foi declarado para este
          desastre
      - name: pa_program_declared
        description: >
          Indica se o programa Public Assistance foi declarado para este
          desastre
      - name: hm_program_declared
        description: >
          Indica se o programa Hazard Mitigation foi declarado para este
          desastre
      - name: incident_begin_date
        description: >
          Data de início do incidente
      - name: incident_end_date
        description: >
          Data de término do incidente
      - name: disaster_closeout_date
        description: >
          Data em que todas as transações financeiras de todos os programas
          foram concluídas
      - name: tribal_request
        description: >
          Indica que o pedido de declaração foi submetido diretamente ao
          Presidente por uma nação tribal, independentemente de um estado
      - name: fips_county_code
        description: >
          Código FIPS de três posições do condado dentro do estado
      - name: designated_area
        description: >
          Nome da área geográfica incluída na declaração
      - name: declaration_request_number
        description: >
          Número atribuído ao pedido de declaração
      - name: declaration_request_date
        description: >
          Data em que o pedido de declaração foi feito
      - name: last_ia_filing_date
        description: >
          Último dia para protocolar pedidos de Individual Assistance;
          disponível apenas a partir de 1998 e somente quando o programa foi
          aprovado
      - name: region
        description: >
          Número de 1 a 10 que identifica a região da FEMA em que o desastre
          ocorreu
      - name: designated_incident_types
        description: >
          Lista separada por vírgulas dos tipos de incidente designados para
          o desastre
      - name: record_id
        description: >
          Identificador único do registro atribuído pela OpenFEMA
  - name: us_fema_openfema__public_assistance_project
    description: >
      Projetos financiados pelo programa Public Assistance da FEMA desde 1998,
      com uma linha por projeto. Traz a categoria de dano, a situação e a
      etapa do projeto, o custo estimado e os valores federais obrigados.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, gm_project_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('us_fema_openfema__dicionario')
          columns_covered_by_dictionary: [damage_category_code]
    columns:
      - name: year
        description: >
          Ano de referência, usado como coluna de partição
        tests:
