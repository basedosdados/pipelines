---
version: 2
models:
  - name: br_bndes_estatisticas_operacoes__produto_direta_aprovacao
    description: >-
      Valor aprovado pelo Sistema BNDES em cada mês, nas operações de forma de
      apoio direta, por produto, em reais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, mes, produto]
      - not_null_proportion_multiple_columns:
          at_least: 0.99
    columns:
      - name: ano
        description: >-
          Ano da aprovação
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: mes
        description: >-
          Mês da aprovação
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: produto
        description: >-
          Produto do BNDES que define as regras gerais do financiamento
        tests: [not_null]
      - name: valor_aprovado
        description: >-
          Valor aprovado, em reais
  - name: br_bndes_estatisticas_operacoes__produto_indireta_aprovacao
