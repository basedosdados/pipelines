  - name: us_bls_cex__interview_expenditure
    description: >-
      Interview Survey public-use microdata, monthly expenditure file (MTBI): one
      row per consumer unit interview, reference month and expenditure record, coded
      by Universal Classification Code (UCC)
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary: [rtype, gift, ucc, cost_, pubflag]
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Year the interview was collected
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: quarter
        description: >-
          Quarter the data was collected, from 1 to 4
      - name: consumer_unit_id
        description: >-
          Identifier of the consumer unit (household), stable across its interviews
          or diary weeks
      - name: interview_number
        description: >-
          Interview number of the consumer unit: 2 to 5 through 2015 (interview 1
          was an unreleased bounding interview), 1 to 4 after BLS dropped the bounding
          interview in 2015
      - name: newid
        description: >-
          BLS public-use identifier of the consumer unit and interview or diary week;
          the last digit is the interview number (1-4) or diary week (1-2)
        tests: [not_null]
      - name: reference_month
        description: >-
          Calendar month the expenditure refers to, from 1 to 12
      - name: reference_year
        description: >-
          Calendar year the expenditure refers to
      - name: seqno
        description: >-
          Sequence Number
      - name: alcno
        description: >-
          Allocation Number
      - name: expname
        description: >-
          Name of expense variable from which UCC mapped
      - name: rtype
        description: >-
          RECORD TYPE of the corresponding EXPN record
      - name: gift
        description: >-
          Was this item bought for someone outside the CU?
      - name: uccseq
        description: >-
          Sequence number of UCC in a given mapping
      - name: ucc
        description: >-
          Universal Classification Code
      - name: cost
        description: >-
          Total cost of item, including sales tax
      - name: cost_
        description: >-
          Data-quality flag for COST: valid, blank, allocated, imputed or topcoded
      - name: pubflag
        description: >-
          Is amount included in published reports?
  - name: us_bls_cex__interview_income
    description: >-
      Interview Survey public-use microdata, monthly income file (ITBI): one row per
      consumer unit interview, reference month and income UCC
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [value_, gift]
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary: [ucc, pubflag, value_, gift]
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Year the interview was collected
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: quarter
        description: >-
          Quarter the data was collected, from 1 to 4
      - name: consumer_unit_id
        description: >-
          Identifier of the consumer unit (household), stable across its interviews
          or diary weeks
      - name: interview_number
        description: >-
          Interview number of the consumer unit: 2 to 5 through 2015 (interview 1
          was an unreleased bounding interview), 1 to 4 after BLS dropped the bounding
          interview in 2015
      - name: newid
        description: >-
          BLS public-use identifier of the consumer unit and interview or diary week;
          the last digit is the interview number (1-4) or diary week (1-2)
        tests: [not_null]
      - name: reference_month
        description: >-
          Calendar month the income refers to, from 1 to 12
      - name: reference_year
        description: >-
          Calendar year the income refers to
      - name: ucc
        description: >-
          Universal Classification Code
      - name: pubflag
        description: >-
          Is amount included in published reports?
      - name: value
        description: >-
          Value of UCC
      - name: value_
        description: >-
          Data-quality flag for VALUE: valid, blank, allocated, imputed or topcoded
      - name: gift
        description: >-
          Was this item bought for someone outside the CU?
