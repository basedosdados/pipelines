---
version: 2
models:
  - name: us_bls_cex__series
    description: >-
      Catalogue of the BLS Consumer Expenditure Surveys published-table time series
      (LABSTAT database cx), one row per series, with the item, demographic classification
      and group each series is cut by
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [series_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary: [statistic]
    columns:
      - name: series_id
        description: >-
          BLS LABSTAT series identifier
        tests: [not_null]
      - name: category_id
        description: >-
          Top-level category of the series: expenditures, income, consumer unit characteristics
          or addenda
      - name: category_name
        description: >-
          Name of the category
      - name: subcategory_id
        description: >-
          Subcategory code, e.g. food, housing or income before taxes
      - name: subcategory_name
        description: >-
          Name of the subcategory
      - name: item_id
        description: >-
          Item code, either a 6-digit numeric code or a mnemonic such as TOTALEXP
      - name: item_name
        description: >-
          Name of the item
      - name: item_display_level
        description: >-
          Indentation level of the item in the BLS table hierarchy, from 0 (top) to
          3
      - name: demographics_id
        description: >-
          Demographic classification the series is cut by, e.g. LB01 all consumer
          units or LB02 income quintiles
      - name: demographics_name
        description: >-
          Name of the demographic classification
      - name: characteristics_id
        description: >-
          Group within the demographic classification, e.g. a specific income quintile
      - name: characteristics_name
        description: >-
          Name of the group within the demographic classification
      - name: statistic
        description: >-
          Statistic published in the series; M is the mean
      - name: series_title
        description: >-
          Full title of the series as published by BLS
      - name: begin_year
        description: >-
          First year with data in the series
      - name: end_year
        description: >-
          Last year with data in the series
  - name: us_bls_cex__annual
    description: >-
      Published annual estimates of the BLS Consumer Expenditure Surveys, one row
      per series and year, 1984 onward: mean expenditure, income or characteristic
      per consumer unit, with standard errors, shares and aggregates from 2010 onward
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, series_id]
          config:
            where: __most_recent_year_en__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary: [footnote_codes]
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Reference year of the estimate
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: series_id
        description: >-
          BLS LABSTAT series identifier; see the series table
        tests:
          - not_null
          - relationships:
              to: ref('us_bls_cex__series')
              field: series_id
              config:
                where: __most_recent_year_en__
      - name: mean
        description: >-
          Published estimate: mean annual expenditure or income per consumer unit,
          or the mean characteristic
      - name: standard_error
        description: >-
          Standard error of the mean
      - name: relative_standard_error
        description: >-
          Relative standard error of the mean
      - name: expenditure_share
        description: >-
          Share of the item in average annual expenditures of the group
      - name: aggregate_expenditure
        description: >-
          Aggregate expenditure on the item for the group
      - name: aggregate_share
        description: >-
          Share of the aggregate expenditure on the item accounted for by the group
      - name: percent_reporting
        description: >-
          Percentage of consumer units in the group reporting an expenditure on the
          item
      - name: footnote_codes
        description: >-
          Footnote codes attached to the mean estimate
  - name: us_bls_cex__ucc
    description: >-
      BLS hierarchical grouping files (integrated, interview and diary), one row per
      line per year, mapping Universal Classification Codes (UCC) to the published
      expenditure and income category tree
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, hierarchy, line_number]
          config:
            where: __most_recent_year_en__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary:
            - hierarchy
            - row_type
            - factor
            - section
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Year of the BLS hierarchical grouping file the row belongs to
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: hierarchy
        description: >-
          Hierarchical grouping the row belongs to: integrated, interview or diary
        tests: [not_null]
      - name: line_number
        description: >-
          Position of the row in the BLS grouping file, preserving the published order
        tests: [not_null]
      - name: level
        description: >-
          Depth of the row in the category tree, 1 being the top
      - name: title
        description: >-
          Name of the category, statistic or UCC
      - name: ucc
        description: >-
          Universal Classification Code, or the BLS mnemonic for title, group and
          statistic rows
      - name: row_type
        description: >-
          Row type: H header, T title, G group (sum of its children), S statistic,
          I interview UCC, D diary UCC
      - name: factor
        description: >-
          Aggregation factor BLS applies when summing the row into its group
      - name: section
        description: >-
          Section of the grouping: CUCHARS, EXPEND, FOOD, INCOME, ASSETS or ADDENDA
      - name: parent_ucc
        description: >-
          UCC or mnemonic of the nearest group or title row one level up
  - name: us_bls_cex__dicionario
    description: >-
      Dictionary of coded values for the us_bls_cex tables
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id_tabela
            - nome_coluna
            - chave
            - cobertura_temporal
    columns:
      - name: id_tabela
        description: >-
          Slug of the us_bls_cex table the dictionary entry describes
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Name of the column the dictionary entry describes
        tests: [not_null]
      - name: chave
        description: >-
          Coded value (key) exactly as stored in the data
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Temporal coverage of the key
        tests: [not_null]
      - name: valor
        description: >-
          Human-readable label corresponding to the coded value
