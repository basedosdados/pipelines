  - name: us_bls_cex__diary_expenditure
    description: >-
      Diary Survey public-use microdata, expenditure file (EXPD): one row per item
      purchased during the diary week, coded by UCC
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [gift, qredate, qredate_]
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary:
            - alloc
            - pub_flag
            - ucc
            - expnsqdy
            - expnwkdy
            - expnmo
            - expnmo_
            - expnyr_
            - gift
            - qredate_
            - expn_qdy
            - expn_kdy
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Year the diary was collected
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: quarter
        description: >-
          Quarter the data was collected, from 1 to 4
      - name: consumer_unit_id
        description: >-
          Identifier of the consumer unit (household), stable across its interviews
          or diary weeks
      - name: diary_week
        description: >-
          Diary week of the consumer unit, 1 or 2
      - name: newid
        description: >-
          BLS public-use identifier of the consumer unit and interview or diary week;
          the last digit is the interview number (1-4) or diary week (1-2)
        tests: [not_null]
      - name: alloc
        description: >-
          Adjustment status for cost variable
      - name: cost
        description: >-
          Total cost of item, including sales tax
      - name: pub_flag
        description: >-
          Is cost included in published reports?
      - name: ucc
        description: >-
          Universal Classification Code
      - name: expnsqdy
        description: >-
          Sequential day of the diary week (1-7)
      - name: expnwkdy
        description: >-
          Day of the week, Sunday through Saturday (1-7)
      - name: expnmo
        description: >-
          Reference Month of this expenditure (01-12)
      - name: expnmo_
        description: >-
          Data-quality flag for EXPNMO: valid, blank, allocated, imputed or topcoded
      - name: expnyr
        description: >-
          Reference Year of this expenditure (0000-9999)
      - name: expnyr_
        description: >-
          Data-quality flag for EXPNYR: valid, blank, allocated, imputed or topcoded
      - name: gift
        description: >-
          Was this item bought for someone outside the CU?
      - name: qredate
        description: >-
          Purchase date recode field Consists of: Sequential day of the Diary week
          (1-7) Day of the week, Sunday through Saturday (1-7) Reference month of
          this expenditure, (01-12) Reference day of this expenditure, (01-31) Reference
          year of this expenditure, (0000-9999)
      - name: qredate_
        description: >-
          Data-quality flag for QREDATE: valid, blank, allocated, imputed or topcoded
      - name: expn_qdy
        description: >-
          Data-quality flag for EXPNSQDY: valid, blank, allocated, imputed or topcoded
      - name: expn_kdy
        description: >-
          Data-quality flag for EXPNWKDY: valid, blank, allocated, imputed or topcoded
  - name: us_bls_cex__diary_income
    description: >-
      Diary Survey public-use microdata, income file (DTBD): one row per consumer
      unit diary week and income UCC
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [amount_]
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          dictionary_model: ref('us_bls_cex__dicionario')
          columns_covered_by_dictionary: [ucc, amount_, pub_flag]
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Year the diary was collected
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: quarter
        description: >-
          Quarter the data was collected, from 1 to 4
      - name: consumer_unit_id
        description: >-
          Identifier of the consumer unit (household), stable across its interviews
          or diary weeks
      - name: diary_week
        description: >-
          Diary week of the consumer unit, 1 or 2
      - name: newid
        description: >-
          BLS public-use identifier of the consumer unit and interview or diary week;
          the last digit is the interview number (1-4) or diary week (1-2)
        tests: [not_null]
      - name: ucc
        description: >-
          Universal Classification Code
      - name: amount
        description: >-
          Amount of UCC
      - name: amount_
        description: >-
          Data-quality flag for AMOUNT: valid, blank, allocated, imputed or topcoded
      - name: pub_flag
        description: >-
          Is amount included in published reports?
