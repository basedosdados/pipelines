    columns:
      - name: year
        description: >-
          Year the interview was collected
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: quarter
        description: >-
          Quarter the data was collected, from 1 to 4
      - name: consumer_unit_id
        description: >-
          Identifier of the consumer unit (household), stable across its interviews
          or diary weeks
      - name: interview_number
        description: >-
          Interview number of the consumer unit: 2 to 5 through 2015 (interview 1
          was an unreleased bounding interview), 1 to 4 after BLS dropped the bounding
          interview in 2015
      - name: newid
        description: >-
          BLS public-use identifier of the consumer unit and interview or diary week;
          the last digit is the interview number (1-4) or diary week (1-2)
        tests: [not_null]
      - name: member_number
        description: >-
          Sequence number of the member within the consumer unit
        tests: [not_null]
      - name: age
        description: >-
          What is the member's age?
      - name: age_
        description: >-
          Data-quality flag for AGE: valid, blank, allocated, imputed or topcoded
      - name: angovrtx
        description: >-
          Annual amount of government retirement deducted from pay
      - name: anprvpnx
        description: >-
          Annual amount of private pensions deducted from pay
      - name: anrrdedx
        description: >-
          Annual amount of Railroad retirement deducted from pay
      - name: arm_forc
        description: >-
          Is member now in the Armed Forces?
      - name: cu_code
        description: >-
          What is this person's relation to reference person?
      - name: cu_code_
        description: >-
          Data-quality flag for CU_CODE: valid, blank, allocated, imputed or topcoded
      - name: earner
        description: >-
          Indicates whether the member earned income or not
      - name: earner_
        description: >-
          Data-quality flag for EARNER: valid, blank, allocated, imputed or topcoded
      - name: earntype
        description: >-
          Type of earner
      - name: educa
        description: >-
          What is the highest level of school the member has completed or the highest
          degree the member has received?
      - name: educa_
        description: >-
          Data-quality flag for EDUCA: valid, blank, allocated, imputed or topcoded
      - name: emplcont
        description: >-
          Other than Social Security, did any employer or union that the member worked
          for during the last 12 months contribute to a pension or retirement plan
          that the member was enrolled in?
      - name: govretx
        description: >-
          Amount of government retirement deducted from last pay
      - name: govretx_
        description: >-
          Data-quality flag for GOVRETX: valid, blank, allocated, imputed or topcoded
      - name: grospayx
