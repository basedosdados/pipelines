---
version: 2
models:
  - name: us_eia_seds__seds_consumption
    description: >-
      Uma linha por estado, ano e série do State Energy Data System (SEDS) da
      U.S. Energy Information Administration: o sistema completo de consumo,
      preço, despesa, emissões de CO2 e indicadores relacionados de energia
      por estado, cobrindo todas as fontes de energia de 1960 ao ano completo
      mais recente. A série é identificada pelo Mnemonic Series Name (MSN) de
      cinco caracteres, cujo significado completo está na tabela dicionario. A
      coluna value não carrega uma unidade única porque a unidade varia por
      série — consumo em Btu ou em unidades físicas, preço, despesa, emissões,
      capacidade —; a unidade de cada linha está em measurement_unit e a
      família da medida em measure_type. state_code cobre os 50 estados, o
      Distrito de Columbia, o total nacional (US) e as áreas federais offshore
      (X3, X5); state_id resolve o código FIPS apenas para os estados. Este
      conjunto é o lado da demanda por todas as fontes de energia,
      complementar ao us_eia_ electricity (geração de eletricidade) e ao
      us_eia_consumption (vendas de eletricidade a consumidores finais).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, state_code, msn]
      - not_null_proportion_multiple_columns:
          config:
            # The macro reads every column of the model and runs at
            # dbt compile, not only dbt test, so it is scoped to the
            # most recent year on this table, which is large.
            where: __most_recent_year_en__
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('us_eia_seds__dicionario')
          columns_covered_by_dictionary:
            - state_code
            - msn
            - measure_type
            - data_status
    columns:
      - name: year
        description: >-
          Ano-calendário a que o valor se refere
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: state_id
        description: >-
          Código FIPS do estado dos Estados Unidos; nulo para os agregados que
          não são estados (total nacional e áreas federais offshore)
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: state_code
        description: >-
          Código de dois caracteres da fonte para o estado ou agregado: as
          siglas postais dos 50 estados e do Distrito de Columbia, US para o
          total nacional, e X3 e X5 para as áreas federais offshore do Golfo e
          da Costa Oeste
        tests: [not_null]
      - name: msn
        description: >-
          Nome mnemônico da série (MSN), o código de cinco caracteres da EIA
          em que os dois primeiros identificam a fonte de energia, o terceiro
          e o quarto o setor, e o quinto a medida; o significado completo de
          cada código está na tabela dicionario
        tests: [not_null]
      - name: measure_type
        description: >-
          Tipo de medida da série, derivado do quinto caractere do MSN:
          consumo em Btu, consumo em unidades físicas, preço, despesa,
          emissões de CO2, eletricidade, capacidade, fator de conversão,
          contagem ou outro
      - name: value
        description: >-
          Valor da série para o estado e o ano
      - name: measurement_unit
        description: >-
          Unidade de medida do valor desta linha, conforme a EIA publica para
          o MSN (por exemplo, bilhões de Btu, milhares de barris, dólares por
          milhão de Btu, milhões de dólares)
      - name: data_status
        description: >-
          Situação e safra da estimativa, conforme publicado pela fonte (por
          exemplo, 2024F para as estimativas finais de 2024)
  - name: us_eia_seds__dicionario
    description: >-
      Registro dos valores assumidos pelas colunas codificadas da tabela
      seds_consumption, com o significado de cada código e a cobertura
      temporal em que ele aparece. Inclui as descrições completas dos nomes
      mnemônicos de série (MSN) publicadas pela EIA, os códigos de estado e
      agregado, os tipos de medida e as safras dos dados. A coluna
      cobertura_temporal expõe quando cada série entra e sai do sistema ao
      longo do período de 1960 em diante.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
    columns:
      - name: id_tabela
        description: Nome da tabela a que a coluna codificada pertence
        tests: [not_null]
      - name: nome_coluna
        description: Nome da coluna codificada
        tests: [not_null]
      - name: chave
        description: Valor armazenado na coluna
        tests: [not_null]
      - name: cobertura_temporal
        description: Anos em que o valor aparece, na notação início(intervalo)fim
      - name: valor
        description: Significado do valor armazenado
