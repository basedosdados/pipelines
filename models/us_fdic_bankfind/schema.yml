        description: Total assets
      - name: total_deposits
        description: Total deposits
      - name: domestic_deposits
        description: Deposits held in domestic offices
      - name: equity_capital
        description: Total equity capital
      - name: net_income
        description: Net income for the year to date
      - name: return_on_assets
        description: Net income as a percent of average total assets
      - name: return_on_equity
        description: Net income as a percent of average equity
      - name: domestic_offices
        description: Number of domestic offices
      - name: foreign_offices
        description: Number of foreign offices
  - name: us_fdic_bankfind__indicator
    description: >-
      Dictionary of the quarterly line items the FDIC reports, giving each one a readable
      name, the FDIC's definition, the unit its values are expressed in, and the matching
      column in the financials table when it has one. Decodes financials_indicator.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [indicator_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: indicator_id
        description: FDIC mnemonic of the line item
        tests: [not_null]
      - name: name
        description: Readable name of the line item
      - name: description
        description: Definition of the line item as published by the FDIC
      - name: measurement_unit
        description: 'Unit the value is expressed in: USD, percent or unit'
      - name: is_ratio
        description: Whether the line item is a ratio computed by the FDIC
      - name: is_quarterly
        description: Whether the line item covers the quarter rather than the year
          to date
      - name: is_flag
        description: Whether the line item is a binary flag rather than a measure
      - name: financials_column
        description: Name of the matching column in the financials table
  - name: us_fdic_bankfind__financials
    description: >-
      Quarterly Call Report financials for every FDIC-insured institution, covering
      the balance
      sheet, income statement, asset quality, capital and the FDIC's performance ratios.
      One
      row per institution and quarter, holding the headline line items; the complete
      set of
      line items is in financials_indicator. Dollar amounts are in whole dollars,
      converted
      from the thousands the FDIC publishes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, cert]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
    columns:
      - name: year
        description: Calendar year of the quarterly report
        tests:
          - not_null:
              config:
                where: __most_recent_year__
      - name: quarter
        description: Calendar quarter of the report, 1 to 4
        tests:
          - not_null:
              config:
                where: __most_recent_year__
      - name: report_date
        description: Last day of the quarter the report covers
        tests:
          - not_null:
              config:
                where: __most_recent_year__
      - name: cert
        description: FDIC certificate number identifying the institution
        tests:
          - not_null:
              config:
                where: __most_recent_year__
          - relationships:
              to: ref('us_fdic_bankfind__institution')
              field: cert
              config:
                where: __most_recent_year__
      - name: rssd_id
        description: Federal Reserve RSSD identifier of the institution
      - name: net_income_quarterly_netincq
