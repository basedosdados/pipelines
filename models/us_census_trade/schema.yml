  - name: us_census_trade__dicionario
    description: >-
      Dicionário com as traduções dos códigos usados nas seis tabelas de
      fatos de us_census_trade. Construído a partir das listas de códigos
      publicadas pelo Census Bureau — a Schedule C para países e a Schedule D
      para distritos aduaneiros e portos — e não a partir dos valores
      observados numa janela de meses, de modo que a cobertura é completa e
      não se limita ao que foi negociado nos meses baixados por último
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
    columns:
      - name: id_tabela
        description: >-
          Nome da tabela à qual a coluna pertence
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Nome da coluna codificada
        tests: [not_null]
      - name: chave
        description: >-
          Valor codificado
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Cobertura temporal do valor codificado
      - name: valor
        description: >-
          Valor traduzido do código
