  - name: world_oecd_piaac__variable
    description: One row per variable in the PIAAC international codebooks, mapping
      each published variable name to the Data Basis table and column it was loaded
      into, with its label, domain and assigned type. Use it to find a variable by
      name when following published PIAAC documentation or analysis code.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cycle, variable_name]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: cycle
        description: Survey cycle the variable belongs to (1 or 2)
        tests: [not_null]
      - name: variable_name
        description: PIAAC variable name, lowercased
        tests: [not_null]
      - name: table_id
        description: Data Basis table the variable was loaded into
      - name: column_name
        description: Column name the variable maps to in that table
      - name: label
        description: Variable label as published in the international codebook
      - name: domain
        description: Thematic domain assigned by the codebook
      - name: level
        description: Measurement level assigned by the codebook
      - name: bigquery_type
        description: BigQuery type the variable was loaded as
      - name: measurement_unit
        description: Measurement unit, empty where the variable is not a quantity
      - name: item_code
        description: Item the variable measures, for item-level variables only
      - name: measure
        description: Which per-item measure it records, for item-level variables only
  - name: world_oecd_piaac__dictionary
    description: Mapping from coded values to their meanings for every dictionary-covered
      column in the dataset. PIAAC publishes value labels in English only.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [table_id, column_name, key]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: table_id
        description: Table the covered column belongs to
        tests: [not_null]
      - name: column_name
        description: Name of the column covered by the dictionary
        tests: [not_null]
      - name: key
        description: Coded value stored in the data table
        tests: [not_null]
      - name: temporal_coverage
        description: Years the mapping applies to
      - name: value
        description: Meaning of the coded value
