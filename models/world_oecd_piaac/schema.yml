    columns:
      - name: year
        description: Reference year of data collection, derived from the survey cycle
          and round
        tests: [not_null]
      - name: cycle
        description: Survey cycle of the Survey of Adult Skills (1 or 2)
      - name: round
        description: Round of data collection within the cycle
      - name: country_id_iso_3
        description: ISO 3166-1 alpha-3 code of the participating country
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
      - name: country_id_m49
        description: UN M49 numeric code of the participating country
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: id_m49
      - name: country_entity_id
        description: Code of the participating country or sub-national entity as reported
          by PIAAC
      - name: respondent_id
        description: Randomly derived sequential identifier of the respondent
        tests: [not_null]
      - name: age_r
        description: Person resolved age from BQ and QC check (derived)
      - name: gender_r
        description: Person resolved gender from BQ and QC check (derived)
      - name: disp_cibq
        description: Final disposition code for person - combining CI and BQ/JRA (derived)
      - name: disp_main
        description: Final disposition code for person for Main task instrument (derived)
      - name: disp_mainwrc
        description: Final disposition code for person for Main task instrument, including
          reading components (derived)
