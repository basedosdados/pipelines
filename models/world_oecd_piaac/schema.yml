  - name: world_oecd_piaac__respondent_cycle_1_usa_national
    description: One row per respondent to the United States Round 3 (2017) national
      Public Use File of the Survey of Adult Skills (PIAAC). The OECD publishes no
      internationally comparable file for this round in the United States. The national
      file adds 131 United States-specific variables and suppresses 110 international
      ones, including exact age, so it is held separately rather than stacked into
      respondent_cycle_1.
