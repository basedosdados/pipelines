  - name: world_oecd_piaac__respondent_cycle_2
    description: One row per respondent to Cycle 2 of the Survey of Adult Skills (PIAAC),
      covering the background questionnaire, derived variables, the ten plausible
      values for each proficiency domain, and the final and replicate sampling weights.
      Thirty Public Use Files collected between September 2022 and August 2023. Item-level
      assessment responses are in item_response_cycle_2.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, country_id_iso_3, respondent_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - a2_q03c1
            - a2_q03c2
            - a2_q03c2_t
            - b2_d01d
            - b2_d03d
            - c2_q04
            - d2_q05b1
