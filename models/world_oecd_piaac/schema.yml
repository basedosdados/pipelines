  - name: world_oecd_piaac__item_response_cycle_1
    description: One row per respondent and assessment item in Cycle 1 of the Survey
      of Adult Skills (PIAAC), recording the scored response and the response-process
      measures captured by the assessment platform. Respondents see only a subset
      of items, so a row exists only where at least one measure was recorded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - country_id_iso_3
