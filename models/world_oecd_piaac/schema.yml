---
version: 2
models:
  - name: world_oecd_piaac__respondent_cycle_1
    description: One row per respondent to Cycle 1 of the Survey of Adult Skills (PIAAC),
      covering the background questionnaire, derived variables, the ten plausible
      values for each proficiency domain, and the final and replicate sampling weights.
      Thirty-five internationally comparable Public Use Files from three rounds of
      data collection (2011-2012, 2014-2015 and 2017). Item-level assessment responses
      are in item_response_cycle_1.
