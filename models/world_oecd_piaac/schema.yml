      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, country_id_iso_3, respondent_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - b_d03d
            - b_q04b
            - b_q04b_c
            - d_q16b_t
            - d_q18a
            - d_s16a
            - e_q05b1
            - e_q05b2
