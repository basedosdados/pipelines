---
version: 2
models:
  - name: au_vic_vec_elections__election
    description: >-
      Catálogo dos eventos eleitorais estaduais de Victoria cobertos pelo conjunto:
      as
      eleições gerais de 2006, 2010, 2014, 2018 e 2022, as eleições suplementares
      de
      distrito e a eleição suplementar de Narracan de 2022, que substituiu uma disputa
      anulada da eleição geral. A eleição de 2002 está representada apenas por duas
      províncias do Conselho Legislativo, Western Port e Higinbotham, porque a VEC
      não
      publica mais nada daquele pleito. As disputas de governo local, também
      administradas pela VEC, não estão incluídas.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [election_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: election_name
        description: >-
          Nome do evento eleitoral
      - name: election_type
        description: >-
          Tipo do evento eleitoral
      - name: government_level
        description: >-
          Esfera de governo do evento eleitoral
      - name: election_date
        description: >-
          Data da votação
      - name: source_url
        description: >-
          Endereço da página de resultados publicada pela VEC para o evento
  - name: au_vic_vec_elections__candidate
    description: >-
      Pessoas candidatas em cada disputa, com posição na cédula, partido e indicação
      de
      eleição. group_letter e elected_order são preenchidas apenas nas disputas do
      Conselho Legislativo, ballot_position apenas onde a fonte publica a ordem na
      cédula, e state_electoral_division_id é nula em toda disputa do Conselho
      Legislativo e nos distritos sem correspondente na vintage 2021 do ASGS.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, election_id, contest_id, ballot_name]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - group_letter
            - elected_order
            - ballot_position
            - state_electoral_division_id
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento estadual à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da disputa: distrito da Assembleia Legislativa, região ou província
          do
          Conselho Legislativo
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: ballot_position
        description: >-
          Posição da pessoa candidata na cédula
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: candidate_surname
        description: >-
          Sobrenome da pessoa candidata
      - name: candidate_given_names
        description: >-
          Prenomes da pessoa candidata
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: group_letter
        description: >-
          Letra do grupo na cédula do Conselho Legislativo
      - name: is_elected
        description: >-
          Indica se a pessoa candidata foi eleita na disputa
      - name: elected_order
        description: >-
          Ordem em que a pessoa candidata foi eleita na disputa de múltiplas cadeiras
          do
          Conselho Legislativo
  - name: au_vic_vec_elections__enrolment_turnout
    description: >-
      Uma linha por disputa, com pessoas inscritas, votos totais, válidos e inválidos,
      percentuais de voto inválido e de comparecimento, quota e número de cadeiras
      a
      preencher. A quota existe apenas nas disputas por voto único transferível do
      Conselho Legislativo e é nula na Assembleia Legislativa, e
      state_electoral_division_id é nula em toda disputa do Conselho Legislativo e
      nos
      distritos sem correspondente na vintage 2021 do ASGS.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, election_id, contest_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [quota, state_electoral_division_id]
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento estadual à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da disputa: distrito da Assembleia Legislativa, região ou província
          do
          Conselho Legislativo
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: enrolment
        description: >-
          Número de pessoas inscritas na disputa
      - name: votes_formal
        description: >-
          Total de votos válidos
      - name: votes_informal
        description: >-
          Total de votos inválidos
      - name: votes_total
        description: >-
          Total de votos apurados
      - name: percentage_informal
        description: >-
          Votos inválidos como percentual do total apurado
      - name: percentage_turnout
        description: >-
          Votos apurados como percentual das pessoas inscritas
      - name: quota
        description: >-
          Quota de votos necessária para eleger uma pessoa candidata
      - name: seats_to_elect
        description: >-
          Número de cadeiras a preencher na disputa
  - name: au_vic_vec_elections__result_district
    description: >-
      Votos de cada pessoa candidata no total da disputa, por tipo de apuração: primeira
      preferência, preferência entre dois candidatos e preferência entre dois partidos;
      filtre sempre por count_type, pois as três são apurações distintas da mesma
      disputa. A coluna percentage é publicada apenas em parte das apurações,
      ballot_position apenas onde a fonte traz a ordem na cédula, e
      state_electoral_division_id é nula em toda disputa do Conselho Legislativo e
      nos
      distritos sem correspondente na vintage 2021 do ASGS. A eleição de 2002 está
      representada apenas pelas províncias de Western Port e Higinbotham, únicas
      disputas daquele pleito publicadas pela VEC.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - count_type
            - ballot_name
            - party_name
            - group_letter
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - ballot_position
            - state_electoral_division_id
            - percentage
            - group_letter
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento estadual à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da disputa: distrito da Assembleia Legislativa, região ou província
          do
          Conselho Legislativo
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: count_type
        description: >-
          Tipo de apuração ao qual a linha se refere
      - name: ballot_position
        description: >-
          Posição da pessoa candidata na cédula
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: group_letter
        description: >-
          Letra do grupo na cédula do Conselho Legislativo
      - name: votes
        description: >-
          Votos apurados para a pessoa candidata
      - name: percentage
        description: >-
          Votos da pessoa candidata como percentual do total apurado na disputa
  - name: au_vic_vec_elections__result_voting_centre
    description: >-
      Votos de cada pessoa candidata em cada local de votação, por tipo de voto e
      tipo
      de apuração. Os votos ordinários são reportados por local de votação; os demais
      tipos de voto declarado são reportados uma única vez para toda a disputa e trazem
      o tipo de voto como nome do local. A eleição de 2002 está representada apenas
      pelas províncias de Western Port e Higinbotham, únicas disputas daquele pleito
      publicadas pela VEC, e state_electoral_division_id é nula em toda disputa do
      Conselho Legislativo e nos distritos sem correspondente na vintage 2021 do ASGS.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - count_type
            - vote_type
            - voting_centre_name
            - ballot_name
            - party_name
            - group_letter
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - ballot_position
            - state_electoral_division_id
            - group_letter
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento estadual à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da disputa: distrito da Assembleia Legislativa, região ou província
          do
          Conselho Legislativo
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: voting_centre_name
        description: >-
          Nome do local de votação
      - name: vote_type
        description: >-
          Tipo de voto ao qual a linha se refere
      - name: count_type
        description: >-
          Tipo de apuração ao qual a linha se refere
      - name: ballot_position
        description: >-
          Posição da pessoa candidata na cédula
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: group_letter
        description: >-
          Letra do grupo na cédula do Conselho Legislativo
      - name: votes
        description: >-
          Votos apurados para a pessoa candidata
  - name: au_vic_vec_elections__distribution_of_preferences
    description: >-
      Transferências de voto contagem a contagem na distribuição de preferências,
      com
      valor de transferência, cédulas e votos transferidos e total acumulado de cada
      pessoa candidata ao fim da contagem. A coluna party_name é nula nas contagens
      em
      que a fonte não nomeia o partido, e state_electoral_division_id é nula em toda
      disputa do Conselho Legislativo e nos distritos sem correspondente na vintage
      2021
      do ASGS.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - count_number
            - ballot_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [state_electoral_division_id, party_name]
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento estadual à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da disputa: distrito da Assembleia Legislativa, região ou província
          do
          Conselho Legislativo
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: count_number
        description: >-
          Número da contagem dentro da distribuição de preferências
      - name: count_description
        description: >-
          Transferência ou exclusão realizada pela contagem
      - name: transfer_value
        description: >-
          Valor pelo qual cada cédula é transferida na contagem
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: ballot_papers_transferred
        description: >-
          Número de cédulas transferidas para a pessoa candidata na contagem
      - name: votes_transferred
        description: >-
          Votos transferidos para a pessoa candidata na contagem
      - name: votes_progressive_total
        description: >-
          Total acumulado de votos da pessoa candidata ao fim da contagem
  - name: au_vic_vec_elections__disclosure_gift
    description: >-
      Doações políticas individuais declaradas ao registro de doações da VEC, de 26
      de
      novembro de 2018 a 8 de setembro de 2026, somando 4.374 lançamentos em um registro
      vivo que continua crescendo. Cada doação é declarada tanto pelo doador quanto
      pelo
      beneficiário, de modo que um lançamento não reconciliado traz nulas as colunas
      do
      lado ausente, incluindo data, identificador e nome. A coluna electorate_name
      é
      preenchida em 703 dos 4.374 lançamentos.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [donation_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - electorate_name
            - recipient_party_id
            - recipient_party_name
            - date_made
            - donor_suburb
            - donor_state
            - donor_id
            - donor_name
    columns:
      - name: year
        description: >-
          Ano da doação
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: donation_id
        description: >-
          Identificador da doação atribuído pelo registro de doações da VEC
      - name: date_made
        description: >-
          Data em que a doação foi feita
      - name: date_received
        description: >-
          Data em que a doação foi recebida
      - name: donor_id
        description: >-
          Identificador do doador atribuído pelo registro de doações da VEC
      - name: donor_name
        description: >-
          Nome do doador
      - name: donor_suburb
        description: >-
          Subúrbio do doador
      - name: donor_state
        description: >-
          Estado ou território do doador
      - name: recipient_id
        description: >-
          Identificador do beneficiário atribuído pelo registro de doações da VEC
      - name: recipient_name
        description: >-
          Nome do beneficiário da doação
      - name: recipient_party_id
        description: >-
          Identificador do partido político registrado ao qual a doação é atribuída
      - name: recipient_party_name
        description: >-
          Nome do partido político registrado ao qual a doação é atribuída
      - name: gift_value
        description: >-
          Valor da doação em dólares australianos
      - name: donation_type
        description: >-
          Tipo da doação
      - name: disclosure_status
        description: >-
          Situação de reconciliação da declaração da doação
      - name: electorate_name
        description: >-
          Nome do distrito eleitoral ao qual a doação é atribuída
  - name: au_vic_vec_elections__dicionario
    description: >-
      Correspondência entre as chaves codificadas das colunas do conjunto e o seu
      significado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >-
          Slug da tabela descrita pela entrada do dicionário
      - name: nome_coluna
        description: >-
          Nome da coluna descrita pela entrada do dicionário
      - name: chave
        description: >-
          Valor da chave codificada na coluna
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da entrada do dicionário
      - name: valor
        description: >-
          Significado da chave codificada
