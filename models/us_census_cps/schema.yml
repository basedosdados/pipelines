  - name: us_census_cps__basic_monthly
    description: >-
      Extrato mensal básico da Current Population Survey, reproduzido com os programas
      de
      harmonização do CEPR. Uma linha por pessoa de 16 anos ou mais entrevistada no
      mês, em
      todos os oito grupos de rotação, com situação na força de trabalho, características
      demográficas e o peso amostral básico. Contém as mesmas colunas do extrato org,
      exceto
      as 21 específicas de rendimentos da rotação de saída. Os identificadores de
      domicílio
      não são únicos em 1994 e 1995 (11,3% e 9,6% das linhas), quando os campos amostrais
      do
      CPS mudaram; a duplicidade vem da fonte.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns:
            - year
            - month
            - hhid
            - hhid2
            - hrsample
            - hrsersuf
            - hhnum
            - lineno
          proportion_allowed_failures: 0.05
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - famrel84
            - cow2
            - unemdur
            - jobloser
            - jobleaver
            - entrant
            - certgov
            - pdemp1
            - pdemp2
            - nmemp1
            - nmemp2
            - ind70
            - ind12
            - docc70
            - occ70
            - occ11
            - hourslwa
            - reason79
            - reason94
            - absent79
            - absent94
            - abpaid
            - uhours
            - why3579
            - unempt
    columns:
      - name: year
        description: >-
          Ano
        tests:
          - not_null
          - relationships:
