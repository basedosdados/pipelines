  - name: us_census_cps__march
    description: >-
      Extrato do suplemento anual socioeconômico (ASEC/March) da Current Population
      Survey,
      reproduzido com os programas de harmonização do CEPR. Uma linha por pessoa,
      com renda
      por fonte, cobertura de saúde, pobreza, experiência de trabalho no ano anterior
      e
      migração. O ano de 2014 traz as duas amostras do redesenho: a tradicional de
      5/8
      (research = 0) e a de 3/8 (research = 1), que não se sobrepõem.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, hhseq, pppos, perno]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - id
            - wgtalt
            - fmwgtalt
            - hhwgtalt
            - ethhisp03
            - hhrel8088
            - relhdh8088
            - famrel8088
            - chspval
            - chspyn
            - firmsz89
            - lkwrk_wk
            - indly2d_80
            - indly2d_83
            - ind2d_80
            - ind2d_83
            - ind2d_89
            - indly3d_80
            - indly3d_83
            - indly3d_92
            - indly3d_03
            - indly3d_13
            - ind3d_80
            - ind3d_83
            - ind3d_92
            - ind3d_03
            - ind3d_13
            - occ2d_80
            - occ2d_83
            - occ2d_89
            - occly2d_80
            - occly2d_83
            - occ3d_80
            - occ3d_83
            - occ3d_92
            - occ3d_95
            - occ3d_03
            - occ3d_11
            - occly3d_80
            - occly3d_83
            - occly3d_92
            - occly3d_95
            - occly3d_03
            - occly3d_11
            - manag83
            - manag89
            - managly83
            - payabslw
            - incp_ssres2
