  - name: us_census_cps__dictionary
    description: >-
      Dicionário das colunas categóricas das tabelas org, basic_monthly e march. Uma
      linha por
      (tabela, coluna, chave, cobertura temporal), com o rótulo correspondente. Os
      rótulos vêm
      dos conjuntos de valores do CEPR quando existem; indicadores 0/1 e o mês na
      amostra são
      rotulados de forma explícita. Chaves cuja correspondência muda ao longo do tempo
      (esquemas de indústria e ocupação, por exemplo) aparecem em linhas distintas,
      cada uma
      com sua cobertura temporal.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id_tabela
            - nome_coluna
            - chave
            - cobertura_temporal
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >-
          Nome da tabela à qual a coluna pertence
      - name: nome_coluna
        description: >-
          Nome da coluna categórica descrita pelo dicionário
      - name: chave
        description: >-
          Código ou valor assumido pela coluna categórica
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da chave
      - name: valor
        description: >-
          Rótulo correspondente ao código da coluna categórica
