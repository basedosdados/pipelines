---
version: 2
models:
  - name: us_census_cps__org
    description: >-
      Extrato de grupos de rotação de saída (ORG) da Current Population Survey, reproduzido
      com os programas de harmonização do CEPR. Uma linha por pessoa de 16 anos ou
      mais
      entrevistada em um mês de rotação de saída (grupos 4 e 8), com rendimentos,
      horas e o
      peso de rendimentos (orgwgt). Os identificadores de domicílio não são únicos
      em toda a
      série: a chave (year, month, hhid, hhid2, hrsample, hrsersuf, hhnum, lineno)
      repete-se
      em 0,21%-0,26% das linhas de 1979-1988 e em 8,6%/8,4% das de 1994/1995, quando
      os campos
      amostrais do CPS mudaram; a duplicidade vem da fonte e está presente também
      nos extratos
      publicados pelo CEPR.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns:
            - year
            - month
            - hhid
            - hhid2
            - hrsample
            - hrsersuf
            - hhnum
            - lineno
          proportion_allowed_failures: 0.05
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - cow2
            - unemdur
            - jobloser
            - jobleaver
            - entrant
            - certgov
            - pdemp1
            - pdemp2
            - nmemp1
            - nmemp2
            - ind12
            - occ11
            - reason94
            - absent79
            - absent94
            - abpaid
            - unempt
            - imphrs
    columns:
      - name: year
        description: >-
          Ano
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: month
        description: >-
          Mês
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: id_state
        description: >-
          Código FIPS do estado (2 dígitos, com zero à esquerda)
        tests:
