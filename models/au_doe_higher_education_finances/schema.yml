---
version: 2
models:
  - name: au_doe_higher_education_finances__income_statement
    description: >-
      Adjusted statement of financial performance of Australian higher education
      providers, one row per provider, year, sector and revenue or expense line.
      Sourced from the Department of Education Finance Publication.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - hep_code
            - institution_type
            - line_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Reference year of the financial statement, ending 31 December
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: hep_code
        description: >-
          Code of the higher education provider assigned by the Department of
          Education
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__higher_education_provider')
              field: hep_code
      - name: institution_type
        description: >-
          Sector of the provider the amount covers: whole institution, its higher
          education operations, or its vocational education operations
        tests: [not_null]
      - name: line_number
        description: >-
          Position of the line within the statement, in the order the source
          presents it
        tests: [not_null]
      - name: line_item
        description: >-
          Line of the adjusted statement of financial performance the amount reports
        tests: [not_null]
      - name: line_item_internal
        description: >-
          Internal name of the line in the department's reporting cube, where the
          source publishes one
      - name: value
        description: >-
          Amount reported for the line
  - name: au_doe_higher_education_finances__balance_sheet
