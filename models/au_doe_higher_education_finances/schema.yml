  - name: au_doe_higher_education_finances__research_income
    description: >-
      Research and development income of Australian higher education providers, one
      row per provider, year, category and sub-category. Collected through the
      Higher Education Research Data Collection (HERDC) and used to allocate
      research block grants. A null amount means the sub-category was not in use
      that year.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, hep_code, category, sub_category]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Reference year of the reported research income
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: hep_code
        description: >-
          Code of the higher education provider assigned by the Department of
          Education
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__higher_education_provider')
              field: hep_code
      - name: category
        description: >-
          HERDC research income category, from 1 to 4
        tests: [not_null]
      - name: sub_category
        description: >-
          HERDC research income sub-category within the category
        tests: [not_null]
      - name: amount
        description: >-
          Research income reported for the sub-category
  - name: au_doe_higher_education_finances__line_item
    description: >-
      Which line item labels appear in each financial statement and over which
      years. The department relabels items across the series, so this is the map
      needed to read a long panel on any single line.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [statement, line_item]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: statement
        description: >-
          Financial statement table the line item belongs to
        tests: [not_null]
      - name: line_item
        description: >-
          Line item label as printed by the source
        tests: [not_null]
      - name: first_year
        description: >-
          First year the label appears in the series
      - name: last_year
        description: >-
          Last year the label appears in the series
      - name: n_years
        description: >-
          Number of years the label appears in the series
  - name: au_doe_higher_education_finances__dicionario
    description: >-
      Dictionary of the coded values used across the
      au_doe_higher_education_finances tables.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >-
          Slug of the au_doe_higher_education_finances table the entry describes
      - name: nome_coluna
        description: >-
          Name of the column the entry describes
      - name: chave
        description: >-
          Coded value (key) exactly as stored in the data
      - name: cobertura_temporal
        description: >-
          Temporal coverage of the entry
      - name: valor
        description: >-
          Meaning of the coded value
