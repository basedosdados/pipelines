      - name: valor_descentralizacao_concedida
        description: Valor concedido por descentralização em reais correntes
  - name: br_bd_execucao_estadual__despesa_anual
    description: >
      Execução orçamentária anual por credor e linha orçamentária, para estados cuja
      fonte publica apenas agregados anuais. Uma linha por exercício, órgão, unidade
      gestora, fonte de recursos, credor e natureza da despesa, com empenhado,
      liquidado, pago e pago de restos a pagar. Existe porque São Paulo não publica
      número de documento nem data infra-anual. Não confundir com despesa, que é em
      nível de documento, nem com despesa_mensal, que é mensal e não traz credor.
    # 0,04% das linhas repetem a combinação abaixo com valores diferentes: o SIGEO
    # devolve mais de uma linha para a mesma dotação quando o detalhe que as separa não
    # está entre as colunas exportadas. Nenhuma linha é idêntica em todas as colunas.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns:
            - sigla_uf
            - ano
            - orgao
            - id_unidade_gestora
            - fonte_recurso
            - documento_credor
            - natureza_despesa
          proportion_allowed_failures: 0.01
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: Ano do exercício orçamentário
        tests: [not_null]
      - name: sigla_uf
        description: Sigla da unidade da federação do governo estadual
        tests: [not_null]
      - name: orgao
        description: Código do órgão orçamentário
      - name: nome_orgao
        description: Nome do órgão orçamentário
      - name: id_unidade_gestora
        description: Código da unidade gestora executora da despesa
      - name: nome_unidade_gestora
        description: Nome da unidade gestora executora da despesa
      - name: fonte_recurso
        description: Código da fonte de recursos
      - name: nome_fonte_recurso
        description: Nome da fonte de recursos
      - name: natureza_despesa
        description: >
          Código da natureza da despesa, com oito dígitos reunindo categoria econômica,
          grupo, modalidade de aplicação, elemento e subelemento. Mais detalhado que
          a
          coluna elemento_despesa das demais tabelas
      - name: nome_natureza_despesa
        description: Nome da natureza da despesa
      - name: documento_credor
        description: >
          CPF ou CNPJ do credor. São Paulo publica os CPF sem máscara, diferentemente
          de
          Minas Gerais, que os oculta, e de Pernambuco, que os mascara
      - name: nome_credor
        description: Nome ou razão social do credor
      - name: tipo_documento_credor
        description: >
          Tipo do identificador do credor, derivado do seu formato: CNPJ, CPF,
          UNIDADE_GESTORA ou OUTRO
      - name: valor_empenhado
        description: Valor empenhado em reais correntes
      - name: valor_liquidado
        description: Valor liquidado em reais correntes
      - name: valor_pago
        description: Valor pago em reais correntes
      - name: valor_pago_restos
        description: >
          Valor pago no exercício referente a restos a pagar de exercícios anteriores,
          mantido separado de valor_pago para não duplicar a contagem no ano do empenho
  - name: br_bd_execucao_estadual__despesa_dotacao
    description: >
      Execução orçamentária da despesa por dotação (linha orçamentária), em posição
      anual, só para o Rio de Janeiro -- o único estado que publica a execução nesse grão.
      Diferente de despesa (documento de empenho, com credor e data) e de despesa_mensal
      (movimento mensal), cada linha é a POSIÇÃO acumulada da execução ao fim do exercício,
      por linha orçamentária completa: dotação inicial e atual, empenhado, liquidado, pago,
      restos a pagar e o desembolso total. Uma linha por (exercício, dotação); mes guarda o
      mês da posição (12 nos exercícios encerrados, o mês mais recente no aberto). Cerca de
      55 das 176 mil linhas repetem a chave orçamentária na origem, toleradas no teste de
      unicidade.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns:
            [ano, id_unidade_gestora, unidade_orcamentaria, orgao, funcao, subfuncao, programa, acao, gestao, modalidade_aplicacao, categoria_economica, grupo_despesa, fonte_recurso, elemento_despesa, subelemento_despesa]
          proportion_allowed_failures: 0.01
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: Ano do exercício da posição orçamentária
        tests: [not_null]
      - name: mes
        description: >
          Mês da posição no exercício (12 nos exercícios encerrados; o mês mais recente no
          exercício aberto)
      - name: sigla_uf
        description: Sigla da unidade da federação do governo estadual
        tests: [not_null]
      - name: id_unidade_gestora
        description: Código da unidade gestora
      - name: nome_unidade_gestora
        description: Nome da unidade gestora
      - name: unidade_orcamentaria
        description: Código da unidade orçamentária
      - name: nome_unidade_orcamentaria
        description: Nome da unidade orçamentária
      - name: orgao
        description: Código do órgão
      - name: nome_orgao
        description: Nome do órgão
      - name: poder
        description: Código do poder
      - name: nome_poder
        description: Nome do poder
      - name: tipo_administracao
        description: Tipo de administração (direta ou indireta)
      - name: funcao
        description: Código da função de governo
      - name: nome_funcao
        description: Nome da função de governo
      - name: subfuncao
        description: Código da subfunção de governo
      - name: nome_subfuncao
        description: Nome da subfunção de governo
      - name: programa
        description: Código do programa orçamentário
      - name: nome_programa
        description: Nome do programa orçamentário
      - name: acao
        description: Código da ação (projeto ou atividade) orçamentária
      - name: nome_acao
        description: Nome da ação (projeto ou atividade) orçamentária
      - name: categoria_economica
        description: Código da categoria econômica da despesa
      - name: nome_categoria_economica
        description: Nome da categoria econômica da despesa
      - name: grupo_despesa
        description: Código do grupo de natureza da despesa
      - name: nome_grupo_despesa
        description: Nome do grupo de natureza da despesa
      - name: modalidade_aplicacao
        description: Código da modalidade de aplicação
      - name: nome_modalidade_aplicacao
        description: Nome da modalidade de aplicação
      - name: elemento_despesa
        description: Código do elemento de despesa
      - name: nome_elemento_despesa
        description: Nome do elemento de despesa
      - name: subelemento_despesa
        description: Código do subelemento de despesa
      - name: nome_subelemento_despesa
        description: Nome do subelemento de despesa
      - name: fonte_recurso
        description: Código da fonte de recurso
      - name: nome_fonte_recurso
        description: Nome da fonte de recurso
      - name: gestao
        description: Código da gestão
      - name: nome_gestao
        description: Nome da gestão
      - name: valor_dotacao_inicial
        description: Dotação inicial da linha orçamentária em reais correntes
      - name: valor_dotacao_atual
        description: Dotação atualizada da linha orçamentária em reais correntes
      - name: valor_despesa_autorizada
        description: Despesa autorizada em reais correntes
      - name: valor_empenhado
        description: Valor empenhado acumulado no exercício em reais correntes
      - name: valor_liquidado
        description: Valor liquidado acumulado no exercício em reais correntes
      - name: valor_pago
        description: Valor pago acumulado no exercício em reais correntes
      - name: valor_restos_a_pagar
        description: Restos a pagar ainda a pagar em reais correntes
      - name: valor_restos_a_pagar_pago
        description: Restos a pagar já pagos em reais correntes
      - name: valor_total_desembolsado
        description: Total desembolsado no exercício em reais correntes
  - name: br_bd_execucao_estadual__empenho_credor
    description: >
      Empenhos e seus credores, sem valores. Existe para estados cuja fonte publica
      o
      credor em uma base separada da base de valores, sem chave que permita atribuir
      valor
      a credor. Permite saber quem foi empenhado, quando e sob qual instrumento
      orçamentário, mas não quanto.
    # 1,7% das linhas repetem (empenho, credor): a fonte lança o mesmo empenho mais de
    # uma vez para o mesmo credor, em pedidos distintos. Nenhuma linha é idêntica em
    # todas as colunas.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns: [sigla_uf, ano, numero_empenho, id_credor]
          proportion_allowed_failures: 0.03
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: Ano do exercício orçamentário
        tests: [not_null]
      - name: mes
        description: Mês do pedido de empenho
      - name: sigla_uf
        description: Sigla da unidade da federação do governo estadual
        tests: [not_null]
      - name: numero_empenho
        description: Número do empenho no sistema orçamentário do estado
      - name: instrumento_orcamentario
        description: Número do instrumento orçamentário que originou o empenho
      - name: tipo_empenho
        description: Código do tipo de empenho
      - name: tipo_despesa
        description: Código do tipo de despesa
      - name: id_credor
        description: Código do credor no sistema de origem
      - name: nome_credor
        description: Nome ou razão social do credor
      - name: documento_credor_formatado
        description: CPF ou CNPJ do credor com máscara, como publicado pela fonte
      - name: documento_credor
        description: CPF ou CNPJ do credor apenas com dígitos
      - name: data_pedido
        description: Data do pedido de empenho
      - name: data_autorizacao
        description: Data e hora da autorização do empenho
      - name: processo_sei
        description: Número do processo no sistema eletrônico de informações
      - name: dotacao_orcamentaria
        description: >
          Chave de dotação orçamentária do empenho. Não permite atribuir valores por
          credor: há cerca de seis empenhos por dotação
  - name: br_bd_execucao_estadual__licitacao_participante
    description: >
      Participantes de licitações estaduais. Uma linha por item e fornecedor, com
      o valor
      cotado, o valor homologado e a situação do fornecedor naquele item. Inclui os
      fornecedores derrotados, o que permite medir concorrência.
    # 0,16% das linhas repetem (item, fornecedor) -- o mesmo fornecedor cotando duas
    # vezes o mesmo item -- e 238 linhas são idênticas em todas as colunas, na fonte.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns: [sigla_uf, id_item_bd, documento]
          proportion_allowed_failures: 0.01
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: Ano do processo de aquisição
        tests: [not_null]
      - name: sigla_uf
        description: Sigla da unidade da federação do governo estadual
        tests: [not_null]
      - name: id_licitacao_bd
        description: Identificador único do processo licitatório construído pela Data
          Basis
      - name: id_item_bd
        description: Identificador único do item construído pela Data Basis
      - name: id_item
        description: Número do item dentro do processo
      - name: razao_social
        description: Nome ou razão social do fornecedor participante
      - name: documento_formatado
        description: CPF ou CNPJ do fornecedor com máscara, como publicado pela fonte
      - name: documento
        description: CPF ou CNPJ do fornecedor apenas com dígitos
      - name: situacao
        description: >
          Situação do fornecedor naquele item, como classificado, desclassificado
          ou
          habilitado
      - name: vencedor
        description: >
          Indica se o fornecedor venceu o item, conforme a situação publicada pela
          fonte.
          Não é inferido a partir do valor homologado: 84% das linhas marcadas como
          Perdedor também trazem valor homologado positivo, porque a coluna registra
          o
          valor do item e não o que aquele fornecedor recebeu
      - name: quantidade
        description: Quantidade pedida do item
      - name: valor_unitario_cotado
        description: Valor unitário cotado pelo fornecedor em reais correntes
      - name: valor_total_cotado
        description: Valor total cotado pelo fornecedor em reais correntes
      - name: valor_unitario_homologado
        description: Valor unitário homologado ao fornecedor em reais correntes
      - name: valor_total_homologado
        description: Valor total homologado ao fornecedor em reais correntes
      - name: categoria
        description: Categoria do processo de aquisição
  - name: br_bd_execucao_estadual__contrato
    description: >
      Contratos dos governos estaduais: os instrumentos contratuais celebrados, com
      objeto, contratado, vigência e valor. Uma linha por contrato. Existe para Espírito
      Santo, Santa Catarina, Rio Grande do Sul e Rondônia, os quatro estados que publicam
      um cadastro de contratos. Complementa as tabelas de execução: o contrato é o compromisso,
      a
      execução é o gasto contra ele; ligue à licitação por numero_processo quando
      presente. Só contratos: a base do ES, que mistura contratos com autorizações
      de
      compra e ordens de fornecimento, é filtrada para os documentos do tipo Contrato.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [sigla_uf, id_contrato_bd]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >
          Ano de assinatura ou início de vigência do contrato; nulo quando a data
          está
          ausente ou é claramente inválida na origem
      - name: sigla_uf
        description: Sigla da unidade da federação do governo estadual
        tests: [not_null]
      - name: id_contrato_bd
        description: >
          Identificador único do contrato construído pela Data Basis, no formato
          <sigla_uf>-<unidade gestora>-<número do contrato>-<sequência>
      - name: numero_contrato
        description: Número do contrato na origem
      - name: numero_processo
        description: Número do processo ou licitação que originou o contrato, quando
          informado
      - name: id_unidade_gestora
        description: Código da unidade gestora (órgão) contratante
      - name: nome_unidade_gestora
        description: Nome da unidade gestora (órgão) contratante
      - name: objeto
        description: Objeto do contrato
      - name: modalidade
        description: Modalidade da licitação ou do procedimento que originou o contrato
      - name: tipo_contrato
        description: >
          Tipo do instrumento. No Rio Grande do Sul distingue os quatro cadastros
          (fornecimento de bens, locação, obras e serviços de engenharia, serviços
          de
          terceiros); no Espírito Santo é sempre Contrato
      - name: documento_contratado
        description: >
          CPF ou CNPJ do contratado; nulo no Rio Grande do Sul, que publica apenas
          o nome
      - name: nome_contratado
        description: Nome ou razão social do contratado
      - name: situacao
        description: Situação do contrato; nula no Rio Grande do Sul, que não a publica
      - name: data_assinatura
        description: >
          Data de assinatura ou celebração; no Rio Grande do Sul, a data de publicação
          no
          Diário Oficial, quando é a única disponível
      - name: data_inicio_vigencia
        description: Data de início da vigência do contrato
      - name: data_fim_vigencia
        description: Data de fim da vigência do contrato
      - name: valor_inicial
        description: Valor inicial do contrato em reais correntes
      - name: valor_atual
        description: Valor atual do contrato em reais correntes, após aditivos quando
          informado
