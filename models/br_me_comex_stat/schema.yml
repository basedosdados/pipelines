  - name: br_me_comex_stat__dicionario
    description: Dicionário para tradução dos códigos do conjunto br_me_comex_stat.
      Para taduzir códigos compartilhados entre instituições, como id_municipio, buscar
      por diretórios
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id_tabela
            - nome_coluna
            - chave
            - cobertura_temporal
      - not_null_proportion_multiple_columns:
          at_least: 0.90
    columns:
      - name: id_tabela
        description: ID da tabela
        tests:
          - accepted_values:
              values:
                - municipio_exportacao
                - municipio_importacao
                - ncm_exportacao
                - ncm_importacao
      - name: nome_coluna
        description: Nome da coluna
        tests:
          - accepted_values:
              values: [id_pais, id_via, id_urf]
      - name: chave
        description: Chave
      - name: cobertura_temporal
        description: Cobertura temporal
      - name: valor
        description: Valor
