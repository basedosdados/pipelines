---
version: 2
models:
  - name: br_me_comex_stat__municipio_exportacao
    description: Base de dados detalhada por município da empresa exportadora e Posição
      do Sistema Harmonizado (SH4)
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano
            - mes
            - id_sh4
            - id_pais
            - sigla_uf
            - id_municipio
          config:
            where: __most_recent_year_month__
      - not_null_proportion_multiple_columns:
          at_least: 0.90
          config:
            where: __most_recent_year_month__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [id_pais]
          dictionary_model: ref('br_me_comex_stat__dicionario')
          config:
            where: __most_recent_year_month__
    columns:
      - name: ano
        description: Ano
      - name: mes
        description: Mês
      - name: id_sh4
        description: ID Sistema Harmonizado
        tests:
          - relationships:
              to: ref('br_bd_diretorios_comercio_internacional__sistema_harmonizado')
              field: id_sh4
              config:
                where: __most_recent_year_month__
      - name: id_pais
        description: ID do País
      - name: sigla_pais_iso3
        description: Sigla ISO3 do País
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
              ignore_values: [ANT, CSK, SCG, PCZ]
              config:
                where: __most_recent_year_month__
      - name: sigla_uf
        description: Sigla da Unidade da Federação
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_brasil__uf')
              field: sigla
              ignore_values: [EX]
              config:
                where: __most_recent_year_month__
      - name: id_municipio
        description: ID Município - IBGE 7 Dígitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__municipio')
              field: id_municipio
              config:
                where: __most_recent_year_month__
      - name: peso_liquido_kg
        description: Peso Líquido
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                where: __most_recent_year_month__
      - name: valor_fob_dolar
        description: Valor Livre a Bordo
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                where: __most_recent_year_month__
