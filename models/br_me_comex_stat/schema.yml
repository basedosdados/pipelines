  - name: br_me_comex_stat__ncm_importacao
    description: Base de dados dos produtos importados pelo Brasil segundo a Nomenclatura
      Comum do Mercosul
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano
            - mes
            - sigla_uf_ncm
            - id_ncm
            - id_pais
            - id_via
            - id_urf
          config:
            where: __most_recent_year_month__
      - not_null_proportion_multiple_columns:
          at_least: 0.90
          config:
            where: __most_recent_year_month__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [id_pais, id_via, id_urf]
          dictionary_model: ref('br_me_comex_stat__dicionario')
          config:
            where: __most_recent_year_month__
    columns:
      - name: ano
        description: Ano
      - name: mes
        description: Mês
      - name: id_ncm
        description: ID Produto - Nomenclatura Comum do Mercosul
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_mundo__nomenclatura_comum_mercosul')
              field: id_ncm
              ignore_values: ['85492100', '90189097', '26011220', '29159070']
              config:
                where: __most_recent_year_month__
      - name: id_unidade
        description: ID Unidade
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__nomenclatura_comum_mercosul')
              field: id_unidade
              config:
                where: __most_recent_year_month__
      - name: id_pais
