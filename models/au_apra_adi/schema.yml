  - name: au_apra_adi__dicionario
    description: >-
      Dictionary mapping the coded columns (institution_type, and measure in the long tables) of the au_apra_adi tables to their labels.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
    columns:
      - name: id_tabela
        description: >-
          Slug of the au_apra_adi table the dictionary entry describes
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Name of the column the dictionary entry describes
        tests: [not_null]
      - name: chave
        description: >-
          Coded value (key) exactly as stored in the data
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Temporal coverage of the key
      - name: valor
        description: >-
          Human-readable label corresponding to the coded value
