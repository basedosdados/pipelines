  - name: au_apra_adi__capital_adequacy
    description: >-
      Quarterly capital adequacy of APRA-regulated ADIs by institution type, long format (one row per quarter, institution type and measure). Spans the pre-Basel III and Basel III regimes. Source: APRA Quarterly ADI Performance.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, institution_type, measure]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Reference year of the quarter-end observation
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: quarter
        description: >-
          Reference quarter of the observation, from 1 to 4
        tests: [not_null]
      - name: institution_type
        description: >-
          Authorised deposit-taking institution type or grouping
        tests: [not_null]
      - name: measure
        description: >-
          Coded measure within the statement (see dictionary for the label)
        tests: [not_null]
      - name: unit
        description: >-
          Unit of the value: aud_million, proportion or unit
      - name: value
        description: >-
          Reported value of the measure (unit given by the unit column; NULL when not applicable or confidentiality-masked)
  - name: au_apra_adi__asset_quality
    description: >-
      Quarterly asset quality of APRA-regulated ADIs by institution type, long format (one row per quarter, institution type and measure): impaired and past-due facilities, provisions and non-performing exposures. Source: APRA Quarterly ADI Performance.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, institution_type, measure]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Reference year of the quarter-end observation
        tests:
