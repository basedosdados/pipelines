---
version: 2
models:
  - name: au_apra_adi__financial_performance
    description: >-
      Quarterly financial performance of APRA-regulated authorised deposit-taking institutions (ADIs) by institution type, from the September 2004 quarter. One row per quarter and institution type, with interest, fee, expense and profit flows in millions of Australian dollars. Source: APRA Quarterly ADI Performance.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, institution_type]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Reference year of the quarter-end observation
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: quarter
        description: >-
          Reference quarter of the observation, from 1 to 4
        tests: [not_null]
      - name: institution_type
        description: >-
          Authorised deposit-taking institution type or grouping
        tests: [not_null]
      - name: interest_income
        description: >-
