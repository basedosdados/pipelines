  - name: au_apra_adi__liquidity_mlh
    description: >-
      Quarterly Minimum Liquidity Holdings (MLH) reporting of APRA-regulated ADIs by institution type, long format (one row per quarter, institution type and measure). Source: APRA Quarterly ADI Performance.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, institution_type, measure]
      - not_null_proportion_multiple_columns:
