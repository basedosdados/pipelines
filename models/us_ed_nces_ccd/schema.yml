---
version: 2
models:
  - name: us_ed_nces_ccd__school
    description: >-
      Annual directory of every public elementary and secondary school in the United
      States,
      from the NCES Common Core of Data school universe survey. One row per NCES school
      identifier and school year, with location, geography codes, school type and
      level,
      charter, magnet and virtual indicators, Title I status, grade span, full-time
      equivalent
      teachers, total enrollment and free and reduced-price lunch eligibility counts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, school_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - direct_certification
            - state_leg_district_lower
            - state_leg_district_upper
            - elem_cedp
            - middle_cedp
            - high_cedp
            - ungrade_cedp
            - title_i_schoolwide
            - shared_time
            - virtual
            - csa_id
            - bureau_indian_education
            - title_i_status
            - title_i_eligible
            - magnet
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - state_id
            - urban_centric_locale
            - school_level
            - school_type
            - school_status
            - lowest_grade_offered
            - highest_grade_offered
            - bureau_indian_education
            - title_i_status
            - title_i_eligible
            - title_i_schoolwide
            - charter
            - magnet
            - shared_time
            - virtual
            - elem_cedp
            - middle_cedp
            - high_cedp
            - ungrade_cedp
            - lunch_program
          dictionary_model: ref('us_ed_nces_ccd__dicionario')
    columns:
      - name: year
        description: >-
          Fall year of the school year the record refers to (2020 denotes school year
          2020-21)
        tests: [not_null]
      - name: school_id
        description: >-
          NCES school identification number (12 characters: 7-character LEAID followed
          by a
          5-digit school number)
        tests: [not_null]
      - name: agency_id
        description: >-
          NCES local education agency (school district) identification number, or
          LEAID (7
          characters: 2-digit state FIPS followed by a 5-digit agency number)
      - name: state_id
        description: >-
          State FIPS code as reported by the CCD
      - name: county_id
        description: >-
          County FIPS code (5 digits: state FIPS followed by the 3-digit county code)
      - name: school_id_local
        description: >-
          NCES school number within the state (state FIPS followed by the school number)
      - name: school_id_state
        description: >-
          School identification number assigned by the state education agency
      - name: agency_id_state
        description: >-
          Local education agency identification number assigned by the state
      - name: school_name
        description: >-
          School name
      - name: agency_name
        description: >-
          Local education agency (school district) name
      - name: cbsa_id
        description: >-
          OMB core-based statistical area code of the vintage in force in the school
          year
      - name: csa_id
        description: >-
          OMB combined statistical area code of the vintage in force in the school
          year
      - name: congressional_district_id
        description: >-
          State and congressional district identification number
      - name: state_leg_district_lower
        description: >-
          State legislative district, lower chamber
      - name: state_leg_district_upper
        description: >-
          State legislative district, upper chamber
      - name: street_location
        description: >-
          Street of the location address
      - name: city_location
        description: >-
          City of the location address
      - name: state_location
        description: >-
          USPS state abbreviation of the location address
      - name: zip_location
        description: >-
          ZIP code of the location address
      - name: street_mailing
        description: >-
          Street of the mailing address
      - name: city_mailing
        description: >-
          City of the mailing address
      - name: state_mailing
        description: >-
          USPS state abbreviation of the mailing address
      - name: zip_mailing
        description: >-
          ZIP code of the mailing address
      - name: phone
        description: >-
          School telephone number
      - name: latitude
        description: >-
          Latitude of the school in decimal degrees
      - name: longitude
        description: >-
          Longitude of the school in decimal degrees
      - name: urban_centric_locale
        description: >-
          Degree of urbanization (urban-centric locale) of the school location
      - name: school_level
        description: >-
          School level
      - name: school_type
        description: >-
          School type
      - name: school_status
        description: >-
          Operational status of the school at the start of the school year
      - name: lowest_grade_offered
        description: >-
          Lowest grade offered by the school
      - name: highest_grade_offered
        description: >-
          Highest grade offered by the school
      - name: bureau_indian_education
        description: >-
          Whether the school is funded or operated by the Bureau of Indian Education
      - name: title_i_status
        description: >-
          Title I status of the school
      - name: title_i_eligible
        description: >-
          Whether the school is eligible for Title I funding
      - name: title_i_schoolwide
        description: >-
          Whether the school operates a schoolwide Title I program
      - name: charter
        description: >-
          Whether the school is a charter school
      - name: magnet
        description: >-
          Whether the school is a magnet school
      - name: shared_time
        description: >-
          Whether the school operates on a shared-time basis with another school
      - name: virtual
        description: >-
          Whether the school delivers instruction virtually
      - name: elem_cedp
        description: >-
          Elementary school indicator derived by the Urban Institute Center on Education
          Data and
          Policy
      - name: middle_cedp
        description: >-
          Middle school indicator derived by the Urban Institute Center on Education
          Data and
          Policy
      - name: high_cedp
        description: >-
          High school indicator derived by the Urban Institute Center on Education
          Data and Policy
      - name: ungrade_cedp
        description: >-
          Ungraded school indicator derived by the Urban Institute Center on Education
          Data and
          Policy
      - name: lunch_program
        description: >-
          National School Lunch Program participation status
      - name: teachers_fte
        description: >-
          Full-time equivalent classroom teachers
      - name: enrollment
        description: >-
          Total student enrollment reported in the school directory
      - name: free_lunch
        description: >-
          Students eligible for a free lunch under the National School Lunch Act
      - name: reduced_price_lunch
        description: >-
          Students eligible for a reduced-price lunch under the National School Lunch
          Act
      - name: free_or_reduced_price_lunch
        description: >-
          Students eligible for a free or reduced-price lunch under the National School
          Lunch Act
      - name: direct_certification
        description: >-
          Students eligible for a free lunch through direct certification
  - name: us_ed_nces_ccd__school_district
    description: >-
      Annual directory of every public school district (local education agency) in
      the United
      States, from the NCES Common Core of Data agency universe survey. One row per
      NCES LEAID
      and school year, with location, geography codes, agency type and level, grade
      span,
      number of schools operated, total enrollment, and counts of special education,
      English
      learner and migrant students. Staff counts are published separately in the staff
      table.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, agency_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - cmsa_id
            - necta_id
            - supervisory_union_number
            - csa_id
            - agency_charter_indicator
            - bureau_indian_education
            - spec_ed_students
            - english_language_learners
            - migrant_students
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - state_id
            - cbsa_type
            - urban_centric_locale
            - agency_type
            - agency_level
            - agency_charter_indicator
            - boundary_change_indicator
            - bureau_indian_education
            - lowest_grade_offered
            - highest_grade_offered
          dictionary_model: ref('us_ed_nces_ccd__dicionario')
    columns:
      - name: year
        description: >-
          Fall year of the school year the record refers to (2020 denotes school year
          2020-21)
        tests: [not_null]
      - name: agency_id
        description: >-
          NCES local education agency (school district) identification number, or
          LEAID (7
          characters: 2-digit state FIPS followed by a 5-digit agency number)
        tests: [not_null]
      - name: state_id
        description: >-
          State FIPS code as reported by the CCD
      - name: county_id
        description: >-
          County FIPS code (5 digits) of the agency's location
      - name: agency_id_state
        description: >-
          Local education agency identification number assigned by the state
      - name: agency_name
        description: >-
          Local education agency (school district) name
      - name: county_name
        description: >-
          County name
      - name: cbsa_id
        description: >-
          OMB core-based statistical area code of the vintage in force in the school
          year
      - name: cbsa_type
        description: >-
          Whether the core-based statistical area is metropolitan or micropolitan
      - name: csa_id
        description: >-
          OMB combined statistical area code of the vintage in force in the school
          year
      - name: cmsa_id
        description: >-
          Consolidated metropolitan statistical area code (discontinued after 2003)
      - name: necta_id
        description: >-
          New England city and town area code
      - name: congressional_district_id
        description: >-
          State and congressional district identification number
      - name: state_leg_district_lower
        description: >-
          State legislative district, lower chamber
      - name: state_leg_district_upper
        description: >-
          State legislative district, upper chamber
      - name: supervisory_union_number
        description: >-
          Supervisory union identification number, where the agency belongs to one
      - name: street_location
        description: >-
          Street of the location address
      - name: city_location
        description: >-
          City of the location address
      - name: state_location
        description: >-
          USPS state abbreviation of the location address
      - name: zip_location
        description: >-
          ZIP code of the location address
      - name: zip4_location
        description: >-
          Four-digit ZIP code extension of the location address
      - name: street_mailing
        description: >-
          Street of the mailing address
      - name: city_mailing
        description: >-
          City of the mailing address
      - name: state_mailing
        description: >-
          USPS state abbreviation of the mailing address
      - name: zip_mailing
        description: >-
          ZIP code of the mailing address
      - name: zip4_mailing
        description: >-
          Four-digit ZIP code extension of the mailing address
      - name: phone
        description: >-
          Agency telephone number
      - name: latitude
        description: >-
          Latitude of the agency in decimal degrees
      - name: longitude
        description: >-
          Longitude of the agency in decimal degrees
      - name: urban_centric_locale
        description: >-
          Degree of urbanization (urban-centric locale) of the agency location
      - name: agency_type
        description: >-
          Type of local education agency
      - name: agency_level
        description: >-
          Grade span served by the agency
      - name: agency_charter_indicator
        description: >-
          Whether the agency operates charter schools
      - name: boundary_change_indicator
        description: >-
          Whether the agency's boundary changed since the previous school year
      - name: bureau_indian_education
        description: >-
          Whether the agency is funded or operated by the Bureau of Indian Education
      - name: lowest_grade_offered
        description: >-
          Lowest grade offered by the agency
      - name: highest_grade_offered
        description: >-
          Highest grade offered by the agency
      - name: number_of_schools
        description: >-
          Schools operated by the agency
      - name: enrollment
        description: >-
          Total student enrollment reported in the agency directory
      - name: spec_ed_students
        description: >-
          Students served under the Individuals with Disabilities Education Act
      - name: english_language_learners
        description: >-
          Students identified as English language learners
      - name: migrant_students
        description: >-
          Students identified as migrant
  - name: us_ed_nces_ccd__school_enrollment
    description: >-
      Public school enrollment counts in long format, one row per school, school year,
      grade,
      race or ethnicity and sex, from the NCES Common Core of Data school membership
      file. The
      source ships roughly 200 wide membership columns whose composition changes across
      years;
      they are reshaped here into a single count column. Marginal totals are retained
      and
      carry the code 99 on grade, race and sex, so the cells and their totals must
      not be
      summed together. Race and sex detail begins in 1998; earlier years carry totals
      only.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, school_id, grade, race, sex]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [state_id, grade, race, sex]
          dictionary_model: ref('us_ed_nces_ccd__dicionario')
    columns:
      - name: year
        description: >-
          Fall year of the school year the record refers to (2020 denotes school year
          2020-21)
        tests: [not_null]
      - name: school_id
        description: >-
          NCES school identification number (12 characters: 7-character LEAID followed
          by a
          5-digit school number)
        tests: [not_null]
      - name: agency_id
        description: >-
          NCES local education agency (school district) identification number, or
          LEAID (7
          characters: 2-digit state FIPS followed by a 5-digit agency number)
      - name: state_id
        description: >-
          State FIPS code as reported by the CCD
      - name: grade
        description: >-
          Grade the enrollment count refers to
        tests: [not_null]
      - name: race
        description: >-
          Race or ethnicity the enrollment count refers to
        tests: [not_null]
      - name: sex
        description: >-
          Sex the enrollment count refers to
        tests: [not_null]
      - name: enrollment
        description: >-
          Students enrolled in the school in the given grade, race and sex cell
  - name: us_ed_nces_ccd__staff
    description: >-
      Full-time equivalent staff of public school districts in long format, one row
      per school
      district, school year and staff category, from the NCES Common Core of Data
      agency
      universe survey. Categories cover teachers by grade span, instructional aides,
      coordinators, guidance counselors, psychologists, librarians and administrative
      and
      support staff. Category totals are reported alongside their components and must
      not be
      summed together with them. Rows with no reported count are omitted.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, agency_id, staff_category]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [state_id, staff_category]
          dictionary_model: ref('us_ed_nces_ccd__dicionario')
    columns:
      - name: year
        description: >-
          Fall year of the school year the record refers to (2020 denotes school year
          2020-21)
        tests: [not_null]
      - name: agency_id
        description: >-
          NCES local education agency (school district) identification number, or
          LEAID (7
          characters: 2-digit state FIPS followed by a 5-digit agency number)
        tests: [not_null]
      - name: state_id
        description: >-
          State FIPS code as reported by the CCD
      - name: staff_category
        description: >-
          Staff category the full-time equivalent count refers to
        tests: [not_null]
      - name: staff_fte
        description: >-
          Full-time equivalent staff in the category
        tests: [not_null]
  - name: us_ed_nces_ccd__district_finance
    description: >-
      Revenues, expenditures, salaries, employee benefits, debt and assets of public
      school
      districts, from the Census Bureau and NCES Annual Survey of School System Finances
      (form
      F-33). One row per school district and fiscal year, in nominal US dollars. Categories
      that a given year's form did not collect are null; the CARES Act, CRRSA and
      ARP relief
      items exist only from 2019 onward.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, agency_id, census_id]
          config:
            where: agency_id is not null or census_id is not null
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - census_id
            - rev_fed_arra
            - exp_current_arra
            - outlay_capital_arra
            - rev_fed_state_math_sci_teach
            - rev_fed_state_drug_free
            - rev_cares_act_relief_serv
            - rev_cares_act_relief_esf_rwp
          config:
            where: __most_recent_year_en__
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [state_id]
          dictionary_model: ref('us_ed_nces_ccd__dicionario')
    columns:
      - name: year
        description: >-
          Fall year of the school year the record refers to (2020 denotes school year
