  - name: us_ed_nces_ccd__dicionario
    description: >-
      Dictionary of the codes stored in the coded columns of the us_ed_nces_ccd tables,
      with
      the label each code stands for.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [cobertura_temporal]
    columns:
      - name: id_tabela
        description: >-
          Slug of the us_ed_nces_ccd table the dictionary entry describes
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Name of the column the dictionary entry describes
        tests: [not_null]
      - name: chave
        description: >-
          Code stored in the column
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Temporal coverage of the dictionary entry
      - name: valor
        description: >-
          Label the code stands for
        tests: [not_null]
