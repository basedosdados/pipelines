---
version: 2
models:
  - name: us_usda_nass__survey_national
    description: >
      Estatísticas de pesquisa (survey) do USDA NASS QuickStats no nível nacional
      dos EUA, em formato longo: uma linha por ano, geografia, commodity, categoria
      estatística, domínio e unidade. A unidade de medida varia por linha e está na
      coluna unit.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - commodity
            - commodity_class
            - production_practice
            - utilization_practice
            - statistic_category
            - unit
            - domain
            - domain_category
            - reference_period
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [value_suppression_flag, coefficient_of_variation]
      - custom_dictionary_coverage:
          dictionary_model: ref('us_usda_nass__dicionario')
          columns_covered_by_dictionary: [value_suppression_flag]
    columns:
      - name: year
        description: Ano de referência da observação
        tests: [not_null]
      - name: sector
        description: Setor da commodity no QuickStats (crops, animals & products,
          economics, demographics, environmental)
      - name: commodity_group
        description: Grupo de commodities ao qual a observação pertence
      - name: commodity
        description: Commodity agrícola medida
        tests: [not_null]
      - name: commodity_class
        description: Classe ou subtipo da commodity
      - name: production_practice
        description: 'Prática de produção (ex.: irrigada, orgânica, todas as práticas)'
      - name: utilization_practice
        description: 'Prática de utilização (ex.: para grão, para silagem, todas as
          práticas)'
      - name: statistic_category
        description: 'Categoria estatística medida (ex.: production, yield, area planted,
          price received)'
        tests: [not_null]
      - name: unit
        description: 'Unidade de medida do valor; varia por linha (ex.: BU, LB, ACRES,
          HEAD, $)'
      - name: short_description
        description: Descrição completa da série (commodity, classe, práticas e estatística
          concatenadas)
      - name: domain
        description: Domínio de desagregação da observação (TOTAL quando não desagregada)
      - name: domain_category
        description: Categoria dentro do domínio de desagregação
      - name: frequency
        description: Frequência de referência da observação
      - name: reference_period
        description: 'Período de referência dentro do ano (ex.: YEAR, MARKETING YEAR)'
      - name: value
        description: Valor observado; a unidade está na coluna unit e varia por linha
      - name: value_suppression_flag
        description: Código de supressão quando o valor foi retido pela fonte ((D),
          (Z) etc.); nulo caso contrário
      - name: coefficient_of_variation
        description: Coeficiente de variação da estimativa, em porcentagem
