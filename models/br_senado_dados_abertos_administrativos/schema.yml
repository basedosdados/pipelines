      - name: quantidade_total
        description: >
          Total publicado pelo relatório de origem
      - name: quantidade_com_opcao
        description: >
          Quantidade de ocupantes com opção pela remuneração do cargo efetivo
      - name: quantidade_sem_opcao
        description: >
          Quantidade de ocupantes sem opção pela remuneração do cargo efetivo
      - name: quantidade_sem_vinculo
        description: >
          Quantidade de ocupantes sem vínculo efetivo com o Senado Federal
      - name: quantidade_estaveis
        description: >
          Quantidade de servidores estáveis
      - name: quantidade_nao_estaveis
        description: >
          Quantidade de servidores não estáveis
      - name: quantidade_total_ativo
        description: >
