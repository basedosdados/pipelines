  - name: br_senado_dados_abertos_administrativos__quadro_pessoal
    description: >
      Quantitativos oficiais do quadro de pessoal do Senado Federal, consolidando
      os seis relatórios de efetivo publicados pela fonte: cargos efetivos, funções
      comissionadas, servidores estáveis e não estáveis, quantitativo de pessoal,
      quantitativo de cargos e funções e quantitativo de senadores. Cada linha combina
      o relatório de origem, uma combinação de dimensões e o período, e traz cada
      medida em sua própria coluna. As variações percentuais publicadas pela fonte
      são omitidas por serem deriváveis do par de períodos ANTERIOR e ATUAL.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - data_extracao
            - data_referencia
            - quadro
            - periodo
            - categoria
            - classe
            - grupo
            - cargo
            - nivel
            - especialidade
            - referencia
            - tabela_vencimento
            - plano_carreira
            - nivel_escolaridade
            - padrao_nivel_referencia
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: data_referencia
        description: >
          Data de referência do quantitativo, informada apenas no quadro de senadores,
          que a fonte publica como série histórica
      - name: quadro
        description: >
          Relatório de efetivo de origem da linha
        tests: [not_null]
      - name: periodo
        description: >
          Período a que a medida se refere, atual ou anterior
        tests: [not_null]
      - name: categoria
        description: >
          Categoria funcional
      - name: classe
        description: >
          Classe do cargo
      - name: grupo
        description: >
          Grupo ocupacional
      - name: cargo
        description: >
          Denominação do cargo
      - name: nivel
        description: >
          Nível do cargo ou da função
      - name: especialidade
        description: >
          Especialidade do cargo
      - name: referencia
        description: >
          Referência da função comissionada
      - name: tabela_vencimento
        description: >
          Tabela de vencimento aplicável
      - name: plano_carreira
        description: >
          Plano de carreira
      - name: nivel_escolaridade
        description: >
          Nível de escolaridade exigido
      - name: padrao_nivel_referencia
        description: >
          Padrão, nível ou referência remuneratória
      - name: quantidade_cargos
        description: >
          Quantidade de cargos autorizados
      - name: quantidade_ocupados
        description: >
          Quantidade de cargos ocupados
      - name: quantidade_vagos
        description: >
          Quantidade de cargos vagos
      - name: quantidade_subtotal
        description: >
