---
version: 2
models:
  - name: br_senado_dados_abertos_administrativos__senador
    description: >
      Dimensão de identificação dos senadores e senadoras referenciados nas demais
      tabelas do conjunto, com nome, sexo e, para os senadores em exercício, partido,
      unidade da federação, mandato e data de nascimento. A identificação e os códigos
      vêm do Serviço de Dados Abertos Legislativos do Senado Federal, cujo código
      de parlamentar é o mesmo usado nos dados administrativos.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_senador]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_senador
        description: >
          Código identificador do senador, correspondente ao código de parlamentar
          do Senado Federal
        tests: [not_null]
      - name: nome_parlamentar
        description: >
          Nome parlamentar do senador
      - name: nome_completo
        description: >
          Nome civil completo do senador
      - name: sexo
        description: >
          Sexo do senador
      - name: sigla_uf
        description: >
          Sigla da unidade da federação pela qual o senador exerce o mandato, informada
          apenas para senadores em exercício
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__uf')
              field: sigla
      - name: sigla_partido
        description: >
          Sigla do partido do senador, informada apenas para senadores em exercício
      - name: titular_suplente
        description: >
          Condição do senador no mandato, titular ou suplente, informada apenas para
          senadores em exercício
      - name: mandato
        description: >
          Período do mandato em exercício, no formato AAAA / AAAA, informado apenas
          para senadores em exercício
      - name: data_nascimento
        description: >
          Data de nascimento do senador, informada apenas para senadores em exercício
      - name: email
        description: >
          Endereço eletrônico institucional do senador, informado apenas para senadores
          em exercício
      - name: indicador_em_exercicio
        description: >
          Indica se o senador está em exercício na data de extração
  - name: br_senado_dados_abertos_administrativos__despesa_ceaps
    description: >
      Despesas reembolsadas pela Cota para o Exercício da Atividade Parlamentar dos
      Senadores (CEAPS), documento a documento, com fornecedor, tipo de despesa e
      valor reembolsado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, id_despesa]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >
          Ano de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: mes
        description: >
          Mês de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: id_despesa
        description: >
          Código identificador da despesa
        tests: [not_null]
      - name: id_senador
        description: >
          Código identificador do senador, referenciando a tabela senador
        tests:
          - relationships:
              to: ref('br_senado_dados_abertos_administrativos__senador')
              field: id_senador
              config:
                where: id_senador is not null
      - name: tipo_despesa
        description: >
          Natureza da despesa reembolsada
      - name: tipo_documento
        description: >
          Espécie do documento fiscal apresentado
      - name: documento
        description: >
          Número do documento fiscal apresentado
      - name: data
        description: >
          Data de emissão do documento fiscal
      - name: cpf_cnpj_fornecedor
        description: >
          CPF ou CNPJ do fornecedor
      - name: nome_fornecedor
        description: >
          Razão social ou nome do fornecedor
      - name: detalhamento
        description: >
          Detalhamento textual da despesa, quando informado
      - name: valor_reembolsado
        description: >
          Valor reembolsado ao senador
  - name: br_senado_dados_abertos_administrativos__senador_gabinete
    description: >
      Retrato do gabinete parlamentar de cada senador em exercício: endereço, telefones
      e chefe de gabinete. A identificação do senador está na tabela senador.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, id_senador]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [fax]
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: id_senador
        description: >
          Código identificador do senador, referenciando a tabela senador
        tests:
          - relationships:
              to: ref('br_senado_dados_abertos_administrativos__senador')
              field: id_senador
              config:
                where: id_senador is not null
      - name: endereco
        description: >
          Endereço do gabinete no complexo do Senado Federal
      - name: telefones
        description: >
          Telefones de contato do gabinete
      - name: fax
        description: >
          Fax do gabinete, quando informado
      - name: chefe_gabinete
        description: >
          Nome do chefe de gabinete
  - name: br_senado_dados_abertos_administrativos__senador_escritorio_apoio
    description: >
      Escritórios de apoio parlamentar mantidos pelos senadores nos estados, com o
      setor responsável e o endereço declarado. A identificação do senador está na
      tabela senador.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, id_senador, nome_escritorio]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [sigla_setor]
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: id_senador
        description: >
          Código identificador do senador titular do escritório, referenciando a tabela
          senador
        tests:
          - relationships:
              to: ref('br_senado_dados_abertos_administrativos__senador')
              field: id_senador
              config:
                where: id_senador is not null
      - name: nome_escritorio
        description: >
          Denominação do escritório de apoio
      - name: sigla_setor
        description: >
          Sigla do setor responsável, quando informada
      - name: endereco
        description: >
          Endereço declarado do escritório de apoio
      - name: telefone
        description: >
          Telefone de contato do escritório, quando informado
  - name: br_senado_dados_abertos_administrativos__senador_auxilio_moradia
    description: >
      Indicação, por senador, de recebimento de auxílio-moradia e de ocupação de imóvel
      funcional. A identificação do senador está na tabela senador.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, id_senador]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: id_senador
        description: >
          Código identificador do senador, referenciando a tabela senador, ausente
          em um registro publicado pela fonte sem identificação
        tests:
          - relationships:
              to: ref('br_senado_dados_abertos_administrativos__senador')
              field: id_senador
              config:
                where: id_senador is not null
      - name: indicador_auxilio_moradia
        description: >
          Indica se o senador recebe auxílio-moradia
      - name: indicador_imovel_funcional
        description: >
          Indica se o senador ocupa imóvel funcional
  - name: br_senado_dados_abertos_administrativos__senador_aposentado_pensionista
    description: >
      Ex-senadores aposentados e pensionistas de ex-senadores, empilhando os regimes
      do Instituto de Previdência dos Congressistas (IPC) e do Plano de Seguridade
      Social dos Congressistas (PSSC).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - data_extracao
            - nome
            - tipo_beneficio
            - regime
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [data_fim]
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: nome
        description: >
          Nome do beneficiário
        tests: [not_null]
      - name: tipo_beneficio
        description: >
          Espécie do benefício, aposentadoria ou pensão
      - name: regime
        description: >
          Regime previdenciário de origem do benefício
      - name: tipo
        description: >
          Descrição do vínculo tal como informada pela fonte
      - name: data_inicio
        description: >
          Data de início do benefício
      - name: data_fim
        description: >
          Data de encerramento do benefício, quando houver
      - name: valor_remuneracao
        description: >
          Valor da remuneração do benefício, disponível apenas para os aposentados
  - name: br_senado_dados_abertos_administrativos__servidor
    description: >
      Quadro completo de servidores do Senado Federal, ativos, aposentados e desligados,
      com vínculo, situação, cargo, função, lotação e cessão. Superconjunto dos recortes
      por situação e por tipo de vínculo oferecidos pela fonte.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, id_servidor]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [tipo_cessao, orgao_origem, orgao_destino]
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: id_servidor
        description: >
          Código sequencial identificador do servidor
        tests: [not_null]
      - name: nome
        description: >
          Nome do servidor
      - name: vinculo
        description: >
          Tipo de vínculo do servidor com o Senado Federal
      - name: situacao
        description: >
          Situação funcional do servidor
      - name: cargo
        description: >
          Denominação do cargo ocupado
      - name: especialidade
        description: >
          Especialidade do cargo, quando houver
      - name: padrao
        description: >
          Padrão remuneratório do servidor na carreira
      - name: codigo_categoria
        description: >
          Código da categoria funcional
      - name: categoria
        description: >
          Denominação da categoria funcional
      - name: codigo_funcao
        description: >
          Código da função comissionada exercida, quando houver
      - name: funcao
        description: >
          Denominação da função comissionada exercida, quando houver
      - name: sigla_lotacao
        description: >
          Sigla da unidade de lotação
      - name: lotacao
        description: >
          Nome da unidade de lotação
      - name: tipo_cessao
        description: >
          Tipo de cessão do servidor, quando cedido
      - name: orgao_origem
        description: >
          Órgão de origem na cessão, quando houver
      - name: orgao_destino
        description: >
          Órgão de destino na cessão, quando houver
      - name: ano_admissao
        description: >
          Ano de admissão do servidor
        tests:
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
  - name: br_senado_dados_abertos_administrativos__servidor_ativo
    description: >
      Servidores em atividade, com data de admissão, jornada semanal, afastamento,
      isenção de ponto e a hierarquia administrativa completa da unidade de lotação.
      Complementa a tabela `servidor`, que não traz esses campos. A fonte não expõe
      identificador nesta consulta, de modo que a junção com `servidor` só é possível
      pelo nome.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, nome, sigla_lotacao]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: nome
        description: >
          Nome do servidor
        tests: [not_null]
      - name: tipo_vinculo
        description: >
          Tipo de vínculo do servidor com o Senado Federal
      - name: cargo
        description: >
          Denominação do cargo ocupado
      - name: categoria
        description: >
          Denominação da categoria funcional
      - name: funcao
        description: >
          Denominação da função comissionada exercida, quando houver
      - name: data_admissao
        description: >
          Data de admissão do servidor
      - name: jornada_semanal_horas
        description: >
          Jornada de trabalho semanal contratada
      - name: afastamento
        description: >
          Descrição do afastamento em curso, quando houver
      - name: isencao_ponto
        description: >
          Fundamento da isenção de registro de ponto, quando houver
      - name: sigla_lotacao
        description: >
          Sigla da unidade de lotação, extraída do nível mais profundo da hierarquia
      - name: lotacao
        description: >
          Nome da unidade de lotação, extraído do nível mais profundo da hierarquia
      - name: nivel_lotacao
        description: >
          Profundidade da unidade de lotação na hierarquia administrativa
      - name: hierarquia_lotacao
        description: >
          Caminho hierárquico completo da unidade de lotação, do Senado Federal à
          unidade, separado por barras
  - name: br_senado_dados_abertos_administrativos__servidor_remuneracao
    description: >
      Folha de pagamento mensal dos servidores do Senado Federal, com as parcelas
      remuneratórias, os descontos e a remuneração líquida, por servidor e tipo de
      folha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, mes, id_remuneracao, tipo_folha]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >
          Ano de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: mes
        description: >
          Mês de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: id_remuneracao
        description: >
          Código sequencial identificador do registro de remuneração, repetido entre
          tipos de folha do mesmo servidor e mês
        tests: [not_null]
      - name: nome
        description: >
          Nome do servidor
      - name: tipo_folha
        description: >
          Tipo da folha de pagamento em que a remuneração foi processada
      - name: remuneracao_basica
        description: >
          Remuneração básica do cargo efetivo
      - name: vantagens_pessoais
        description: >
          Vantagens pessoais incorporadas
      - name: funcao_comissionada
        description: >
          Valor recebido pelo exercício de função comissionada
      - name: gratificacao_natalina
        description: >
          Gratificação natalina, correspondente ao décimo terceiro salário
      - name: horas_extras
        description: >
          Valor pago a título de horas extras
      - name: auxilios
        description: >
          Auxílios pagos ao servidor no mês
      - name: diarias
        description: >
          Diárias pagas ao servidor no mês
      - name: vantagens_indenizatorias
        description: >
          Vantagens de natureza indenizatória
      - name: outras_eventuais
        description: >
          Outras parcelas eventuais
      - name: abono_permanencia
        description: >
          Abono de permanência em serviço
      - name: faltas
        description: >
          Desconto por faltas
      - name: previdencia
        description: >
          Contribuição previdenciária descontada
      - name: imposto_renda
        description: >
          Imposto de renda retido na fonte
      - name: reversao_teto_constitucional
        description: >
          Valor revertido por aplicação do teto constitucional
      - name: remuneracao_liquida
        description: >
          Remuneração líquida recebida no mês
  - name: br_senado_dados_abertos_administrativos__servidor_hora_extra
    description: >
      Horas extras autorizadas por servidor e mês de prestação, com o valor total
      pago e o mês em que o pagamento foi processado. O detalhamento diário está em
      `servidor_hora_extra_dia`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, mes, id_hora_extra, mes_ano_prestacao]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >
          Ano de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: mes
        description: >
          Mês de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: id_hora_extra
        description: >
          Código sequencial identificador do registro de horas extras
        tests: [not_null]
      - name: nome
        description: >
          Nome do servidor
      - name: mes_ano_prestacao
        description: >
          Mês e ano em que as horas extras foram prestadas, no formato MM/AAAA
      - name: mes_ano_pagamento
        description: >
          Mês e ano em que as horas extras foram pagas, no formato MM/AAAA
      - name: valor_total
        description: >
          Valor total pago pelas horas extras do período
  - name: br_senado_dados_abertos_administrativos__servidor_hora_extra_dia
    description: >
      Detalhamento diário das horas extras prestadas, com a quantidade de horas e
      o setor de prestação. Junta-se a `servidor_hora_extra` pelo par `ano` e `id_hora_extra`.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano
            - id_hora_extra
            - mes_ano_prestacao
            - data
            - sigla_setor_prestacao
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >
          Ano de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: mes
        description: >
          Mês de referência
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: id_hora_extra
        description: >
          Código sequencial do registro de horas extras a que o dia pertence
        tests: [not_null]
      - name: mes_ano_prestacao
        description: >
          Mês e ano de prestação do registro a que o dia pertence, no formato MM/AAAA,
          necessário porque o código sequencial se repete entre meses de prestação
          pagos juntos
        tests: [not_null]
      - name: data
        description: >
          Dia em que as horas extras foram prestadas
      - name: quantidade_horas
        description: >
          Quantidade de horas extras prestadas no dia
      - name: sigla_setor_prestacao
        description: >
          Sigla do setor em que as horas extras foram prestadas
      - name: setor_prestacao
        description: >
          Nome do setor em que as horas extras foram prestadas
  - name: br_senado_dados_abertos_administrativos__servidor_aposentado
    description: >
      Servidores aposentados do Senado Federal, empilhando os quadros efetivo e comissionado,
      com a data e o tipo de aposentadoria.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, matricula, tipo_quadro]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: matricula
        description: >
          Matrícula do servidor
        tests: [not_null]
      - name: tipo_quadro
        description: >
          Quadro de origem da aposentadoria, efetivo ou comissionado
      - name: nome
        description: >
          Nome do servidor aposentado
      - name: categoria
        description: >
          Denominação da categoria funcional
      - name: cargo
        description: >
          Denominação do cargo ocupado na aposentadoria
      - name: data_aposentadoria
        description: >
          Data em que a aposentadoria teve início
      - name: tipo_aposentadoria
        description: >
          Modalidade da aposentadoria concedida
  - name: br_senado_dados_abertos_administrativos__servidor_exonerado
    description: >
      Servidores desligados do Senado Federal, com a forma de vacância do cargo, a
      data de entrada em exercício e a data da vacância.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, matricula, data_vacancia]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: matricula
        description: >
          Matrícula do servidor
        tests: [not_null]
      - name: nome
        description: >
          Nome do servidor exonerado
      - name: forma_vacancia
        description: >
          Forma pela qual o cargo tornou-se vago
      - name: data_exercicio
        description: >
          Data de entrada em exercício no cargo
      - name: data_vacancia
        description: >
          Data em que o cargo tornou-se vago
  - name: br_senado_dados_abertos_administrativos__servidor_cedido
    description: >
      Servidores em cessão, empilhando as cessões para o Senado Federal, as cessões
      feitas pelo Senado a outros órgãos, as cessões da Infraero e os exercícios provisórios.
      Os órgãos de origem e de destino são normalizados a partir do sentido da cessão,
      que a fonte expressa apenas pelo endpoint consultado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [data_extracao, matricula, tipo_cessao]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: data_extracao
        description: >
          Data em que o retrato foi extraído da API de dados abertos administrativos
        tests: [not_null]
      - name: matricula
        description: >
          Matrícula do servidor
        tests: [not_null]
      - name: tipo_cessao
        description: >
          Sentido e natureza da cessão
      - name: nome
        description: >
          Nome do servidor cedido
      - name: orgao_origem
        description: >
          Órgão de origem do servidor cedido
      - name: orgao_destino
        description: >
          Órgão de destino do servidor cedido
      - name: cargo
        description: >
          Denominação do cargo do servidor, informada apenas nas cessões pelo Senado
      - name: categoria
        description: >
          Denominação da categoria funcional, informada apenas nas cessões pelo Senado
      - name: lotacao
        description: >
          Unidade de lotação no órgão de destino, quando informada
