---
version: 2
models:
  - name: world_openalex__work
    description: 'Um registro por trabalho acadêmico indexado pelo OpenAlex (artigos,
      livros, capítulos, teses, conjuntos de dados, preprints), com identificadores,
      data e tipo de publicação, fonte e tópico principais, situação de acesso aberto
      e contagens de autores, referências e citações. Fonte: snapshot do OpenAlex
      (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [pmid, pmcid, mag_id, apc_list_usd, apc_paid_usd]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - custom_dictionary_coverage:
          dictionary_model: ref('world_openalex__dicionario')
          columns_covered_by_dictionary: [language]
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: doi
        description: DOI do trabalho
      - name: pmid
        description: Identificador PubMed (PMID)
      - name: pmcid
        description: Identificador PubMed Central (PMCID)
      - name: mag_id
        description: Identificador no antigo Microsoft Academic Graph
      - name: title
        description: Título do trabalho
      - name: publication_date
        description: Data de publicação do trabalho
      - name: type
        description: 'Tipo do trabalho (ex.: article, book-chapter, dataset, preprint)'
      - name: language
        description: Idioma do trabalho (código ISO 639-1)
      - name: primary_source_id
        description: Identificador da fonte (periódico, repositório, conferência)
          no OpenAlex
      - name: primary_topic_id
        description: Tópico principal do trabalho no OpenAlex
      - name: is_open_access
        description: Se o trabalho tem alguma versão em acesso aberto
      - name: open_access_status
        description: Status de acesso aberto (diamond, gold, green, hybrid, bronze,
          closed)
      - name: open_access_url
        description: Melhor URL de acesso aberto ao trabalho
      - name: any_repository_has_fulltext
        description: Se alguma cópia em repositório tem o texto completo
      - name: is_paratext
        description: Se o registro é paratexto (capa, sumário, expediente) e não um
          trabalho acadêmico
      - name: is_retracted
        description: Se o trabalho foi retratado
      - name: is_xpac
        description: Se o trabalho pertence ao conjunto estendido (xpac) do OpenAlex
      - name: volume
        description: Volume da publicação
      - name: issue
        description: Número (fascículo) da publicação
      - name: first_page
        description: Primeira página
      - name: last_page
        description: Última página
      - name: authors_count
        description: Número de autores
      - name: institutions_distinct_count
        description: Número de instituições distintas entre os autores
      - name: countries_distinct_count
        description: Número de países distintos entre os autores
      - name: locations_count
        description: Número de locais (cópias) em que o trabalho está hospedado
      - name: referenced_works_count
        description: Número de trabalhos citados por este trabalho
      - name: cited_by_count
        description: Número de citações recebidas
      - name: fwci
        description: Impacto de citação normalizado por área (FWCI)
      - name: citation_normalized_percentile
        description: Percentil de citações em relação a trabalhos do mesmo ano e área,
          de 0 a 1
      - name: is_in_top_1_percent
        description: Se está no 1% mais citado do mesmo ano e área
      - name: is_in_top_10_percent
        description: Se está nos 10% mais citados do mesmo ano e área
      - name: apc_list_usd
        description: Preço de tabela da taxa de publicação (APC) da fonte, em dólares
          americanos
      - name: apc_paid_usd
        description: Taxa de publicação (APC) efetivamente paga, em dólares americanos
      - name: has_fulltext
        description: Se o OpenAlex indexou o texto completo
      - name: has_pdf
        description: Se o OpenAlex possui o PDF do trabalho
      - name: created_date
        description: Data de criação do registro no OpenAlex
      - name: updated_date
        description: Data da última alteração do registro no OpenAlex
  - name: world_openalex__work_abstract
    description: 'Resumo de cada trabalho em texto corrido, reconstruído a partir
      do índice invertido publicado pelo OpenAlex. Cerca de metade dos trabalhos tem
      resumo. Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: abstract
        description: Resumo do trabalho em texto corrido
  - name: world_openalex__work_authorship
    description: 'Um registro por autor de cada trabalho, na ordem da lista de autoria,
      com o autor desambiguado pelo OpenAlex, o nome como impresso e a indicação de
      autor correspondente. Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, author_sequence]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [raw_orcid]
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
          - relationships:
              to: ref('world_openalex__work')
              field: work_id
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: author_sequence
        description: Ordem do autor na lista de autoria do trabalho
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: author_id
        description: Identificador do autor no OpenAlex
      - name: author_position
        description: 'Posição do autor: first, middle ou last'
      - name: author_name
        description: Nome do autor conforme o perfil do OpenAlex
      - name: orcid
        description: ORCID do autor
      - name: raw_author_name
        description: Nome do autor como impresso no trabalho
      - name: raw_orcid
        description: ORCID declarado na fonte, antes da desambiguação
      - name: is_corresponding
        description: Se é o autor correspondente
  - name: world_openalex__work_authorship_institution
    description: 'Um registro por instituição do OpenAlex associada a cada autor de
      cada trabalho. Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, author_sequence, institution_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: author_sequence
        description: Ordem do autor na lista de autoria do trabalho
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: institution_id
        description: Identificador da instituição no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
  - name: world_openalex__work_authorship_affiliation
    description: 'Um registro por texto de afiliação de cada autor, como impresso
      no trabalho, com as instituições do OpenAlex identificadas nesse texto. Fonte:
      snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - work_id
            - author_sequence
            - affiliation_sequence
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: author_sequence
        description: Ordem do autor na lista de autoria do trabalho
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: affiliation_sequence
        description: Ordem da afiliação na lista do autor
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: raw_affiliation_string
        description: Texto da afiliação como impresso no trabalho
      - name: institution_ids
        description: Instituições do OpenAlex identificadas neste texto de afiliação
  - name: world_openalex__work_authorship_country
    description: 'Um registro por país de afiliação de cada autor de cada trabalho,
      inclusive quando a instituição não foi identificada. Fonte: snapshot do OpenAlex
      (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, author_sequence, country_code]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: author_sequence
        description: Ordem do autor na lista de autoria do trabalho
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: country_code
        description: País de afiliação do autor (código ISO 3166-1 alfa-2)
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
  - name: world_openalex__work_location
    description: 'Um registro por local em que um trabalho está hospedado (periódico,
      repositório, servidor de preprints), com versão, licença, URLs e situação de
      acesso aberto, marcando o local principal e o melhor local de acesso aberto.
      Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, location_sequence]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - custom_dictionary_coverage:
          dictionary_model: ref('world_openalex__dicionario')
          columns_covered_by_dictionary: [license]
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
          - relationships:
              to: ref('world_openalex__work')
              field: work_id
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: location_sequence
        description: Ordem do local na lista do trabalho
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: location_id
        description: Identificador do local no OpenAlex, estável mesmo quando trabalhos
          são fundidos
      - name: source_id
        description: Identificador da fonte (periódico, repositório, conferência)
          no OpenAlex
      - name: is_primary
        description: Se é o local principal (versão de registro) do trabalho
      - name: is_best_open_access
        description: Se é o melhor local de acesso aberto do trabalho
      - name: is_open_access
        description: Se o trabalho é de acesso aberto neste local
      - name: is_published
        description: Se esta é a versão publicada
      - name: is_accepted
        description: Se esta é a versão aceita ou publicada
      - name: version
        description: Versão do trabalho neste local (submittedVersion, acceptedVersion,
          publishedVersion)
      - name: license
        description: Licença do trabalho neste local
      - name: landing_page_url
        description: URL da página do trabalho neste local
      - name: pdf_url
        description: URL do PDF neste local
      - name: raw_source_name
        description: Nome da fonte como informado pelo provedor
      - name: raw_type
        description: Tipo do trabalho como informado pelo provedor
      - name: provenance
        description: 'Provedor de onde o OpenAlex obteve o local (ex.: crossref, pmh,
          datacite)'
  - name: world_openalex__work_topic
    description: 'Até três tópicos atribuídos a cada trabalho pelo classificador do
      OpenAlex, com o escore de confiança; o tópico de ordem 1 é o principal. Fonte:
      snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, topic_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: topic_id
        description: Identificador do tópico no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
          - relationships:
              to: ref('world_openalex__topic')
              field: topic_id
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: topic_rank
        description: Ordem do tópico por escore, 1 = tópico principal
      - name: score
        description: Escore de confiança da atribuição, de 0 a 1
  - name: world_openalex__work_keyword
    description: 'Palavras-chave atribuídas a cada trabalho pelo OpenAlex, com o escore
      de confiança. Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, keyword_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: keyword_id
        description: Identificador da palavra-chave no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: score
        description: Escore de confiança da atribuição, de 0 a 1
  - name: world_openalex__work_sdg
    description: 'Objetivos de Desenvolvimento Sustentável da ONU associados a cada
      trabalho pelo classificador do OpenAlex, com o escore de confiança. Fonte: snapshot
      do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, sdg_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - custom_dictionary_coverage:
          dictionary_model: ref('world_openalex__dicionario')
          columns_covered_by_dictionary: [sdg_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: sdg_id
        description: Objetivo de Desenvolvimento Sustentável da ONU (1 a 17)
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: score
        description: Escore de confiança da atribuição, de 0 a 1
  - name: world_openalex__work_mesh
    description: 'Descritores e qualificadores do vocabulário MeSH atribuídos pelo
      PubMed a cada trabalho nele indexado. Fonte: snapshot do OpenAlex (OurResearch),
      licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, descriptor_id, qualifier_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
      - name: descriptor_id
        description: Identificador do descritor MeSH
      - name: descriptor_name
        description: Nome do descritor MeSH
      - name: qualifier_id
        description: Identificador do qualificador MeSH
      - name: qualifier_name
        description: Nome do qualificador MeSH
      - name: is_major_topic
        description: Se o descritor é assunto principal do trabalho
  - name: world_openalex__work_award
    description: 'Um registro por financiamento (award) declarado em cada trabalho,
      com o financiador e o código atribuído por ele. Fonte: snapshot do OpenAlex
      (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, award_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: award_id
        description: Identificador do financiamento (award) no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: funder_id
        description: Identificador do financiador no OpenAlex
      - name: funder_award_id
        description: Código do financiamento atribuído pelo financiador
  - name: world_openalex__work_funder
    description: 'Um registro por financiador declarado em cada trabalho. Fonte: snapshot
      do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, funder_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: funder_id
        description: Identificador do financiador no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
  - name: world_openalex__work_reference
    description: 'Rede de citações: um registro por trabalho citado na lista de referências
      de cada trabalho, quando o citado também está no OpenAlex. Fonte: snapshot do
      OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, referenced_work_id]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: referenced_work_id
        description: Identificador do trabalho citado
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
  - name: world_openalex__work_counts_by_year
    description: 'Citações recebidas por cada trabalho em cada ano, nos últimos dez
      anos. Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, year]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: year
        description: Ano em que as citações foram recebidas
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: cited_by_count
        description: Número de citações recebidas no ano
  - name: world_openalex__work_indexed_in
    description: 'Bases e índices em que cada trabalho está indexado (Crossref, PubMed,
      DOAJ, arXiv, DataCite). Fonte: snapshot do OpenAlex (OurResearch), licença CC0.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [work_id, index_name]
          config:
            where: publication_year >= extract(year from current_date()) - 1
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: publication_year >= extract(year from current_date()) - 1
    columns:
      - name: publication_year
        description: Ano de publicação do trabalho
      - name: work_id
        description: Identificador do trabalho no OpenAlex
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
      - name: index_name
        description: 'Índice ou base que indexa o trabalho (ex.: crossref, pubmed,
          doaj, arxiv, datacite)'
        tests:
          - not_null:
              config:
                where: publication_year >= extract(year from current_date()) - 1
  - name: world_openalex__author
    description: 'Um registro por autor desambiguado pelo OpenAlex, com nome, ORCID,
      contagens de trabalhos e citações e índices h e i10. Fonte: snapshot do OpenAlex
      (OurResearch), licença CC0.'
    tests:
