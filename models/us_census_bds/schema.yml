  - name: us_census_bds__dictionary
    description: >-
      Dictionary of the coded values used across the us_census_bds tables, one
      row per table, column and key.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [table_id, column_name, key]
    columns:
      - name: table_id
        description: >-
          Slug of the us_census_bds table the dictionary entry describes
      - name: column_name
