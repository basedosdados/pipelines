    columns:
      - name: ano
        description: >
          Año del trimestre móvil al que corresponde el registro
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: mes
        description: >
          Mes central del trimestre móvil al que corresponde el registro, de 1 a 12
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: ano_encuesta
        description: >
          Año del período de recolección de datos
      - name: mes_encuesta
        description: >
          Mes del período de recolección de datos, de 1 a 12
      - name: id_region
        description: >
          Código CUT de la región de residencia de la persona encuestada
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__region')
              field: id_region
      - name: id_provincia
        description: >
          Código CUT de la provincia de residencia de la persona encuestada
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__provincia')
              field: id_provincia
      - name: id_comuna
        description: >
          Código CUT de la comuna de residencia de la persona encuestada
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__comuna')
              field: id_comuna
      - name: tipo
        description: >
          Tipo de estrato
      - name: estrato
        description: >
          Estrato muestral
      - name: conglomerado
        description: >
          Permite identificar el conglomerado correspondiente a la unidad primaria de muestreo
      - name: id_identificacion
        description: >
          Identificador único del hogar
        tests:
          - not_null
      - name: hogar
        description: >
          Número del hogar dentro de la vivienda
      - name: idrph
        description: >
          Identificador único de personas
        tests:
          - not_null
      - name: nro_linea
        description: >
          Número de línea de la persona dentro del cuestionario
      - name: proveedor
        description: >
          Indica si la persona es la proveedora económica principal del hogar
      - name: parentesco
        description: >
          Parentesco con proveedor/a principal del hogar
      - name: sexo
        description: >
          Sexo
        tests:
          - not_null
      - name: edad
        description: >
          Edad de la persona durante la semana de referencia de la encuesta, de 0 a 120 años
        tests:
          - not_null
      - name: est_conyugal
        description: >
          Estado civil  o conyugal
      - name: mig1
        description: >
          ¿En qué país vivía hace cinco años?
      - name: mig2_cod
        description: >
          Comuna en que vivía hace cinco años
      - name: mig3_cod
        description: >
          País en que vivía hace cinco años
      - name: mig4
        description: >
          Cuando nació, ¿en qué comuna o país vivía su madre?
      - name: mig5_cod
        description: >
          Comuna en que vivía su madre cuando la persona nació
      - name: mig6_cod
        description: >
          País en que vivía su madre cuando la persona nació
      - name: nacionalidad
        description: >
          Nacionalidad de la persona encuestada
      - name: orig1
        description: >
          ¿Se considera perteneciente a algún pueblo indígena u originario?
      - name: orig2
        description: >
          Pueblo indígena u originario al que la persona declara pertenecer
      - name: orig3
        description: >
          Pueblo indígena u originario declarado, cuando orig2 es «Otro»
      - name: curso
        description: >
          Curso más alto aprobado 1 – 8
      - name: nivel
        description: >
          Nivel educacional más alto aprobado
      - name: termino_nivel
        description: >
          Término de nivel educacional
      - name: estudia_actual
        description: >
          ¿Se encuentra estudiando actualmente en un establecimiento educacional?
      - name: edu1
        description: >
          ¿Cuál es el curso o año más alto aprobado?
      - name: edu2
        description: >
          Nivel educacional al que corresponde el curso declarado
      - name: edu3
        description: >
          ¿Terminó el nivel antes declarado?
      - name: edu4
        description: >
          ¿Se encuentra estudiando actualmente?
      - name: a1
        description: >
          La semana pasada, es decir, entre lunes y domingo, ¿trabajó por lo menos una hora?
      - name: a2
        description: >
          Independientemente de lo que acaba de decir, ¿hizo algún negocio, 'pololo' u otra actividad por cuenta propia por lo menos durante una hora?
