      - name: id_classe_para
        description: >
          Código da classe de cobertura e uso da terra final da transição
        tests:
          - not_null
          - relationships:
              to: ref('br_mapbiomas_estatisticas__classe')
              field: chave
      - name: bioma
        description: >
