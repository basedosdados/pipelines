  - name: br_mapbiomas_estatisticas__classe
    description: >
      Legenda hierárquica de cobertura e uso da terra da Coleção 11 do
      MapBiomas, com os rótulos dos quatro níveis em português, inglês e
      espanhol. Uma linha por classe presente nas estatísticas. Os rótulos em
      português e inglês são os da legenda publicada pelo MapBiomas; os em
      espanhol são tradução da Base dos Dados, já que o MapBiomas Brasil não
      publica legenda nesse idioma.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [chave]
      # observacoes é preenchida apenas para as classes cuja presença nas
      # estatísticas diverge da legenda publicada, hoje duas de 34.
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [observacoes]
    columns:
      - name: chave
        description: >
          Código da classe de cobertura e uso da terra na legenda do MapBiomas
        tests: [not_null, unique]
      - name: nivel
        description: >
          Nível da legenda em que a classe é definida, de 1 a 4
        tests: [not_null]
      - name: origem
        description: >
          Origem da classe: Natural, Antrópico, Natural/Antrópico ou Indefinido
        tests: [not_null]
      - name: codigo_hierarquia
        description: >
          Código hierárquico da classe na planilha de estatísticas, como 3.2.1.1
      - name: valor_pt
        description: >
          Nome da classe em português
        tests: [not_null]
      - name: valor_en
        description: >
          Nome da classe em inglês
      - name: valor_es
        description: >
          Nome da classe em espanhol
      - name: nivel_1_pt
        description: >
          Rótulo em português da classe no nível 1 da legenda
        tests: [not_null]
      - name: nivel_1_en
        description: >
          Rótulo em inglês da classe no nível 1 da legenda
      - name: nivel_1_es
        description: >
          Rótulo em espanhol da classe no nível 1 da legenda
      - name: nivel_2_pt
        description: >
          Rótulo em português da classe no nível 2 da legenda
      - name: nivel_2_en
        description: >
          Rótulo em inglês da classe no nível 2 da legenda
      - name: nivel_2_es
        description: >
          Rótulo em espanhol da classe no nível 2 da legenda
      - name: nivel_3_pt
        description: >
          Rótulo em português da classe no nível 3 da legenda
      - name: nivel_3_en
        description: >
          Rótulo em inglês da classe no nível 3 da legenda
      - name: nivel_3_es
        description: >
          Rótulo em espanhol da classe no nível 3 da legenda
      - name: nivel_4_pt
        description: >
          Rótulo em português da classe no nível 4 da legenda
      - name: nivel_4_en
        description: >
          Rótulo em inglês da classe no nível 4 da legenda
      - name: nivel_4_es
        description: >
          Rótulo em espanhol da classe no nível 4 da legenda
      - name: cor_hex
        description: >
          Cor hexadecimal da classe na legenda oficial do MapBiomas
      - name: observacoes
        description: >-
          Notas sobre divergências entre a tabela de estatísticas e a legenda
          publicada
