---
version: 2
models:
  - name: cl_ine_censo__persona
    description: >
      Microdatos de personas del Censo de Poblacion y Vivienda 2024 de Chile,
      con una fila por persona censada. El maximo nivel de desagregacion
      geografica es la comuna: el INE no publica la manzana ni la zona censal
      de cada persona por control de divulgacion estadistica, de modo que esta
      tabla NO se puede cruzar con manzana_entidad ni zona_localidad.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_vivienda, id_hogar, id_persona]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - asistencia_parv
            - asistencia_basica
            - asistencia_media
            - asistencia_superior
            - p26_llegada_periodo
            - p28_pueblo_pert
      - custom_dictionary_coverage:
          dictionary_model: ref('cl_ine_censo__dicionario')
          columns_covered_by_dictionary:
            - comuna_bajo_umbral
            - area
            - tipo_operativo
            - sexo
            - edad_quinquenal
            - parentesco
            - p23_est_civil
            - p24_lug_resid5
            - p24_lug_resid5_esp
            - p25_lug_nacimiento
            - p25_lug_nacimiento_rec
            - p25_lug_nacimiento_esp
            - p26_llegada_periodo
            - p27_nacionalidad
            - p27_nacionalidad_esp
            - p27_nacionalidad_rec
            - p28_autoid_pueblo
            - p28_pueblo_pert
            - p29_afrodescendencia_rec
            - p29_afrodescendencia
            - p30_lengua_indigena
            - p30_lengua_indigena_rec
            - p31_religion
            - p31_religion_rec
            - p32a_dificultad_ver
            - p32b_dificultad_oir
            - p32c_dificultad_mover
            - p32d_dificultad_cogni
            - p32e_dificultad_cuidado
            - p32f_dificultad_comunic
            - discapacidad
            - p33_edu_asiste
            - asistencia_parv
            - asistencia_basica
            - asistencia_media
            - asistencia_superior
            - p37_alfabet
            - cine11
            - sit_fuerza_trabajo
            - p40_cise_rec
            - depend_econ_deficit_hab
            - cod_ciuo
            - cod_caenes
            - p44_lug_trab
            - p44_lug_trab_esp
            - p45_medio_transporte
            - div_genero
    columns:
      - name: ano
        description: >
          Ano del levantamiento censal
        tests: [not_null]
      - name: id_region
        description: >
          Codigo unico territorial (CUT) de la region, de dos digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__region')
              field: id_region
      - name: id_provincia
        description: >
          Codigo unico territorial (CUT) de la provincia, de tres digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__provincia')
              field: id_provincia
      - name: id_comuna
        description: >
          Codigo unico territorial (CUT) de la comuna, de cinco digitos
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__comuna')
              field: id_comuna
      - name: id_vivienda
        description: >
          Identificador de la vivienda, unico en todo el pais
        tests: [not_null]
      - name: id_hogar
        description: >
          Identificador del hogar dentro de la vivienda
        tests: [not_null]
      - name: id_persona
        description: >
          Identificador de la persona dentro del hogar
        tests: [not_null]
      - name: comuna_bajo_umbral
        description: >
          Comuna con menos de 6.000 personas censadas
      - name: area
        description: >
          Estrato censal urbano o rural en que se ubica el registro
      - name: tipo_operativo
        description: >
          Tipo de operativo
      - name: sexo
        description: >
          ¿Cuál es su sexo?
      - name: edad
        description: >
          ¿Cuántos años cumplidos tiene?
      - name: edad_quinquenal
        description: >
          Edad en quinquenios
      - name: parentesco
        description: >
          ¿Qué relación de parentesco tiene con la jefa o jefe de hogar?
      - name: p23_est_civil
        description: >
          ¿Cuál es su estado conyugal o civil actual?
      - name: p24_lug_resid5
        description: >
          ¿En qué comuna o país vivía en abril de 2019?
      - name: p24_lug_resid5_esp
        description: >
          Lugar específico de residencia hace 5 años
      - name: p25_lug_nacimiento
        description: >
          Cuándo nació, ¿en qué comuna o país vivía su madre?
      - name: p25_lug_nacimiento_rec
        description: >
          Indica si la persona nacio en Chile o en el extranjero
      - name: p25_lug_nacimiento_esp
        description: >
          Lugar específico de nacimiento
      - name: p26_llegada_periodo
        description: >
          ¿En qué año llegó a vivir a Chile?
      - name: p27_nacionalidad
        description: >
          ¿Cuál es su nacionalidad?
      - name: p27_nacionalidad_esp
        description: >
          Pais de nacionalidad
      - name: p27_nacionalidad_rec
        description: >
          Nacionalidad chilena
      - name: p28_autoid_pueblo
        description: >
          ¿Es o se considera perteneciente a algún pueblo indígena u originario?
      - name: p28_pueblo_pert
        description: >
          Pueblo originario al que declara pertenecer la persona que se
          autoidentifico como indigena en p28_autoid_pueblo
      - name: p29_afrodescendencia_rec
        description: >
          Afrodescendencia
      - name: p29_afrodescendencia
        description: >
          De acuerdo con sus antepasados, tradiciones y cultura, es o se
          considera:
      - name: p30_lengua_indigena
        description: >
          ¿Habla o entiende una de las siguientes lenguas indígenas u originarias?
      - name: p30_lengua_indigena_rec
        description: >
          Habla o entiende alguna lengua originaria
      - name: p31_religion
        description: >
          ¿Cuál es su religión o credo?
      - name: p31_religion_rec
        description: >
          Tiene religión o credo
      - name: p32a_dificultad_ver
        description: >
          ¿Tiene dificultad para ver, aun usando anteojos o lentes?
      - name: p32b_dificultad_oir
        description: >
          ¿Tiene dificultad para oír, aun usando un dispositivo auditivo
      - name: p32c_dificultad_mover
        description: >
          ¿Tiene dificultad para caminar o subir escaleras?
      - name: p32d_dificultad_cogni
        description: >
          ¿Tiene dificultad para recordar o concentrarse?
      - name: p32e_dificultad_cuidado
        description: >
          ¿Tiene dificultad para realizar tareas de cuidado personal, como bañarse
          o vestirse?
      - name: p32f_dificultad_comunic
        description: >
          ¿Tiene dificultad para hablar o comunicarse usando su idioma habitual,
          por ejemplo, entender o ser entendido por otras personas?
      - name: discapacidad
        description: >
          Condicion de discapacidad, derivada del conjunto de preguntas de
          dificultad funcional p32a a p32f
      - name: p33_edu_asiste
        description: >
          ¿Asiste actualmente a la educación formal? Incluye educación parvularia,
          especial, básica, media y superior
      - name: asistencia_parv
        description: >
          Asistencia a nivel de educación parvularia o preescolar
      - name: asistencia_basica
        description: >
          Asistencia a nivel de educación básica
      - name: asistencia_media
        description: >
          Asistencia a nivel de educación media
      - name: asistencia_superior
        description: >
          Asistencia a nivel de educación superior
      - name: p37_alfabet
        description: >
          ¿Sabe leer y escribir?
      - name: escolaridad
        description: >
          Años de escolaridad
      - name: cine11
        description: >
          Logro educativo de acuerdo con la Clasificación Internacional
          Normalizada de la Educación
      - name: sit_fuerza_trabajo
        description: >
          Situación en la fuerza de trabajo
      - name: p40_cise_rec
        description: >
          Categoria ocupacional en el empleo (CISE recodificada): independiente,
          dependiente o trabajador no remunerado
      - name: depend_econ_deficit_hab
        description: >
          Dependencia económica
      - name: cod_ciuo
        description: >
          CIUO-08.CL a 1 dígito
      - name: cod_caenes
        description: >
          CAENES a 1 dígito
      - name: p44_lug_trab
        description: >
          ¿En qué comuna o país se ubica su trabajo?
      - name: p44_lug_trab_esp
        description: >
          Lugar de trabajo
      - name: p45_medio_transporte
        description: >
          ¿Cuál es el medio de transporte principal que utiliza para dirigirse a
          su lugar de trabajo?
      - name: p46a_tot_hijs_nac
        description: >
          ¿Cuántas hijas e hijos nacidos vivos ha tenido en total?
      - name: p46b_hijas_nac
        description: >
          Del total de hijas e hijos nacidos vivos, ¿cuántas son mujeres?
      - name: p46c_hijos_nac
        description: >
          Del total de hijas e hijos nacidos vivos, ¿cuántos son hombres?
      - name: p47a_tot_hijs_sobrev
        description: >
          ¿Cuántas hijas e hijos están vivos actualmente?
      - name: p47b_hijas_sobrev
        description: >
          Del total de hijas e hijos que se encuentran vivos, ¿cuántas son
          mujeres?
      - name: p47c_hijos_sobrev
        description: >
          Del total de hijas e hijos que se encuentran vivos, ¿cuántos son
          hombres?
      - name: p48_anio_nac_uh
        description: >
          ¿En qué mes y año nació su última hija o hijo nacido vivo? Año
      - name: p48_mes_nac_uh
        description: >
          ¿En qué mes y año nació su última hija o hijo nacido vivo? Mes
      - name: div_genero
        description: >
          Diversidades de género
  - name: cl_ine_censo__hogar
    description: >
      Microdatos de hogares del Censo de Poblacion y Vivienda 2024 de Chile,
      con una fila por hogar censado. Se vincula con vivienda por id_vivienda
      y con persona por id_vivienda e id_hogar.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_vivienda, id_hogar]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('cl_ine_censo__dicionario')
          columns_covered_by_dictionary:
            - comuna_bajo_umbral
            - area
            - tipo_operativo
            - p12_tenencia_viv
            - p13_comb_cocina
            - p14_comb_calefaccion
            - p15a_serv_tel_movil
            - p15b_serv_compu
            - p15c_serv_tablet
            - p15d_serv_internet_fija
            - p15e_serv_internet_movil
            - p15f_serv_internet_satelital
            - tipologia_hogar
    columns:
      - name: ano
        description: >
          Ano del levantamiento censal
        tests: [not_null]
      - name: id_region
        description: >
          Codigo unico territorial (CUT) de la region, de dos digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__region')
              field: id_region
      - name: id_provincia
        description: >
          Codigo unico territorial (CUT) de la provincia, de tres digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__provincia')
              field: id_provincia
      - name: id_comuna
        description: >
          Codigo unico territorial (CUT) de la comuna, de cinco digitos
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__comuna')
              field: id_comuna
      - name: id_vivienda
        description: >
          Identificador de la vivienda, unico en todo el pais
        tests: [not_null]
      - name: id_hogar
        description: >
          Identificador del hogar dentro de la vivienda
        tests: [not_null]
      - name: comuna_bajo_umbral
        description: >
          Comuna con menos de 6.000 personas censadas
      - name: area
        description: >
          Estrato censal urbano o rural en que se ubica el registro
      - name: tipo_operativo
        description: >
          Tipo de operativo
      - name: p12_tenencia_viv
        description: >
          Tenencia de la vivienda
      - name: p13_comb_cocina
        description: >
          Fuente de energía o combustible para cocinar
      - name: p14_comb_calefaccion
        description: >
          Fuente de energía o combustible para calefaccionar
      - name: p15a_serv_tel_movil
        description: >
          Dispone de telefono movil en el hogar
      - name: p15b_serv_compu
        description: >
          Dispone de computador en el hogar
      - name: p15c_serv_tablet
        description: >
          Dispone de tablet en el hogar
      - name: p15d_serv_internet_fija
        description: >
          Dispone de conexion a internet fija en el hogar
      - name: p15e_serv_internet_movil
        description: >
          Dispone de conexion a internet movil en el hogar
      - name: p15f_serv_internet_satelital
        description: >
          Dispone de conexion a internet satelital en el hogar
      - name: tipologia_hogar
        description: >
          Tipologia del hogar segun su composicion: unipersonal, nuclear, extenso,
          compuesto o sin nucleo
  - name: cl_ine_censo__vivienda
    description: >
      Microdatos de viviendas del Censo de Poblacion y Vivienda 2024 de Chile,
      con una fila por vivienda censada. El total publicado por el INE
      (7.642.716) es menor que el numero de filas porque excluye los
      operativos de vivienda colectiva, que aqui aparecen como registros con
      las preguntas de vivienda en nulo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_vivienda]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [p11c_num_hogar]
      - custom_dictionary_coverage:
          dictionary_model: ref('cl_ine_censo__dicionario')
          columns_covered_by_dictionary:
            - comuna_bajo_umbral
            - area
            - tipo_operativo
            - p2_tipo_vivienda
            - p3a_estado_ocupacion
            - p3b_estado_ocupacion
            - p4a_mat_paredes
            - p4b_mat_techo
            - p4c_mat_piso
            - p6_fuente_agua
            - p7_distrib_agua
            - p8_serv_hig
            - p9_fuente_elect
            - p10_basura
            - p11b_comparte_gasto
            - indice_hacinamiento
    columns:
      - name: ano
        description: >
          Ano del levantamiento censal
        tests: [not_null]
      - name: id_region
        description: >
          Codigo unico territorial (CUT) de la region, de dos digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__region')
              field: id_region
      - name: id_provincia
        description: >
          Codigo unico territorial (CUT) de la provincia, de tres digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__provincia')
              field: id_provincia
      - name: id_comuna
        description: >
          Codigo unico territorial (CUT) de la comuna, de cinco digitos
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__comuna')
              field: id_comuna
      - name: id_vivienda
        description: >
          Identificador de la vivienda, unico en todo el pais
        tests: [not_null]
      - name: comuna_bajo_umbral
        description: >
          Comuna con menos de 6.000 personas censadas
      - name: area
        description: >
          Estrato censal urbano o rural en que se ubica el registro
      - name: tipo_operativo
        description: >
          Tipo de operativo
      - name: cant_hog
        description: >
          Número de hogares censados en la vivienda particular
      - name: cant_per
        description: >
          Número de personas censadas en la vivienda
      - name: p2_tipo_vivienda
        description: >
          Tipo de vivienda particular
      - name: p3a_estado_ocupacion
        description: >
          Estado de ocupación de la vivienda
      - name: p3b_estado_ocupacion
        description: >
          Estado de ocupación de la vivienda (detalle)
      - name: p4a_mat_paredes
        description: >
          ¿Cuál es el material de construcción en las paredes exteriores?
      - name: p4b_mat_techo
        description: >
          ¿Cuál es el material de construcción en la cubierta del techo?
      - name: p4c_mat_piso
        description: >
          ¿Cuál es el material de construcción en el piso?
      - name: p5_num_dormitorios
        description: >
          ¿Cuántas piezas de esta vivienda se usan exclusivamente como dormitorio?
      - name: p6_fuente_agua
        description: >
          El agua que usa esta vivienda proviene principalmente de:
      - name: p7_distrib_agua
        description: >
          ¿Cuál es el sistema de distribución del agua en esta vivienda?
      - name: p8_serv_hig
        description: >
          El servicio higiénico (WC) principal de esta vivienda es o está:
      - name: p9_fuente_elect
        description: >
          La electricidad de esta vivienda proviene principalmente de:
      - name: p10_basura
        description: >
          ¿Cuál es el principal medio de eliminación de basura de esta vivienda?
      - name: p11a_num_personas
        description: >
          ¿Cuántas personas residen habitualmente en esta vivienda?
      - name: p11b_comparte_gasto
        description: >
          1. De las personas que residen habitualmente en esta vivienda, ¿todas
          comparten los gastos para alimentación?
      - name: p11c_num_hogar
        description: >
          2. ¿Cuántos grupos tienen gastos separados de alimentación?
      - name: indice_hacinamiento
        description: >
          Índice de hacinamiento
  - name: cl_ine_censo__manzana_entidad
    description: >
      Base manzana-entidad del Censo 2024 de Chile: 189 variables agregadas de
      poblacion, hogares y viviendas por manzana urbana o entidad rural, con
      la geometria del poligono. Union de las capas cartograficas Manzanas y
      Entidades publicadas por el INE; la columna nivel_geografico indica el
      origen de cada fila. Sumar n_per sobre esta tabla da 18.226.208 personas
      y no el total censal de 18.480.432: la cartografia no tiene poligono
      para los registros contenedores comunales (113.447 personas sin
      geografia a nivel de manzana) ni para las personas censadas en viviendas
      colectivas o en situacion de calle.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [manzent]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [geometria]
    columns:
      - name: ano
        description: >
          Ano del levantamiento censal
        tests: [not_null]
      - name: id_region
        description: >
          Codigo unico territorial (CUT) de la region, de dos digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__region')
              field: id_region
      - name: id_provincia
        description: >
          Codigo unico territorial (CUT) de la provincia, de tres digitos
        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__provincia')
              field: id_provincia
      - name: id_comuna
        description: >
          Codigo unico territorial (CUT) de la comuna, de cinco digitos
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_cl__comuna')
              field: id_comuna
      - name: nivel_geografico
        description: >
          Nivel geografico del registro, que indica de cual de las dos capas
          cartograficas de INE proviene la fila
      - name: nombre_region
        description: >
          Nombre de la region
      - name: nombre_provincia
        description: >
          Nombre de la provincia
      - name: nombre_comuna
        description: >
          Nombre de la comuna
      - name: area_c
        description: >
          Estrato censal urbano o rural del area cartografica
      - name: manzent
        description: >
          Código único identificador de manzana / entidad
        tests: [not_null]
      - name: nombre_distrito
        description: >
          Nombre del distrito censal
      - name: cod_distrito
        description: >
          Número de distrito
      - name: cod_localidad
        description: >
          Código de localidad urbana/rural
      - name: cod_zona
        description: >
          Código de zonal censal
      - name: nombre_localidad
        description: >
          Nombre de la localidad
      - name: cod_entidad
        description: >
          Código de entidad poblada urbana/rural
      - name: cod_manzana
        description: >
          Código de manzana urbana/aldea
      - name: nombre_entidad
        description: >
          Nombre de la entidad poblada
      - name: tipo_mz
        description: >
          Tipo de manzana censal: URBANO para manzanas urbanas y ALDEA para
          manzanas de aldea. Nulo en los registros de entidad rural
      - name: cod_categoria
        description: >
          Código de categoria de entidad
      - name: categoria
        description: >
          Categoria de la entidad poblada segun INE: Ciudad, Pueblo, Aldea,
          Caserio, Parcela-Hijuela, Comunidad Indigena, entre otras
      - name: mz_base_censo
        description: >
          Indica si el poligono forma parte de la cartografia base del censo (1) o
          fue incorporado como area complementaria (0)
      - name: id_entidad
        description: >
          Identificador único de entidad agrupada (no considera división
          distrital)
      - name: id_localidad
        description: >
          Identificador único de localidad agrupada (no considera división
          distrital)
      - name: id_distrito
        description: >
          Identificador único de distrito
      - name: id_zona
        description: >
          Identificador único de zona censal
      - name: n_per
        description: >
          Personas censadas en el area
      - name: n_hombres
        description: >
          Hombres censados en el area
      - name: n_mujeres
        description: >
          Mujeres censadas en el area
      - name: n_edad_0_5
        description: >
          Personas de 0 a 5 años
      - name: n_edad_6_13
        description: >
          Personas de 6 a 13 años
      - name: n_edad_14_17
        description: >
          Personas de 14 a 17 años
      - name: n_edad_18_24
        description: >
          Personas de 18 a 24 años
      - name: n_edad_25_44
        description: >
          Personas de 25 a 44 años
      - name: n_edad_45_59
        description: >
          Personas de 45 a 59 años
      - name: n_edad_60_mas
        description: >
          Personas de 60 años o más
      - name: prom_edad
        description: >
          Promedio de edad
      - name: n_inmigrantes
        description: >
          Personas inmigrantes internacionales (Lugar de nacimiento fuera de
          Chile)
      - name: n_nacionalidad
        description: >
          Personas con otra nacionalidad (no considera aquellos con doble
          nacionalidad)
      - name: n_pueblos_orig
        description: >
          Personas que son o se consideran pertenecientes a un pueblo originario
      - name: n_afrodescendencia
