  - name: cl_ine_censo__dicionario
    description: >
      Diccionario de las columnas codificadas del Censo 2024 de Chile, con una
      fila por combinacion de tabla, columna y codigo. Incluye los codigos
      centinela -99 (no respuesta) y -66 (valor suprimido por anonimizacion).
      Las etiquetas provienen del diccionario Redatam oficial CPV2024.dicX.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >
          Nombre de la tabla a la que pertenece la columna codificada
        tests: [not_null]
      - name: nome_coluna
        description: >
          Nombre de la columna codificada
        tests: [not_null]
      - name: chave
        description: >
          Codigo almacenado en la columna
        tests: [not_null]
      - name: cobertura_temporal
        description: >
          Cobertura temporal de la correspondencia entre codigo y etiqueta
      - name: valor
        description: >-
          Etiqueta correspondiente al codigo
