---
version: 2
models:
  - name: au_qld_ecq_elections__election
    description: >-
      Catálogo dos 54 eventos eleitorais estaduais e municipais de Queensland cobertos
      pelo conjunto: eleições gerais estaduais, eleições quadrienais municipais e
      eleições suplementares. Serve de chave para todas as demais tabelas de resultados
      por election_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [election_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: election_stub
        description: >-
          Sigla curta do evento eleitoral usada nas URLs da ECQ
      - name: election_name
        description: >-
          Nome do evento eleitoral
      - name: election_type
        description: >-
          Tipo do evento eleitoral
      - name: government_level
        description: >-
          Esfera de governo do evento eleitoral: estadual ou local
      - name: election_date
        description: >-
          Data da votação
      - name: results_archive_url
        description: >-
          Endereço do arquivo de resultados publicado pela ECQ para o evento
  - name: au_qld_ecq_elections__candidate
    description: >-
      Pessoas candidatas em cada disputa, com posição na cédula, partido e indicação
      de
      eleição. Reúne disputas estaduais e municipais, distinguidas por government_level.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - contest_type
            - ballot_order_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: lga_id
        description: >-
          Código da área de governo local no padrão ABS 2021
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__lga_2021')
              field: id_lga
      - name: lga_code
        description: >-
          Código da área de governo local atribuído pela própria ECQ
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: government_level
        description: >-
          Esfera de governo da disputa: estadual ou local
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: lga_name
        description: >-
          Nome da área de governo local tal como publicado pela ECQ
      - name: district_name
        description: >-
          Nome da disputa: distrito estadual, divisão de conselho ou cargo de prefeitura
      - name: ballot_order_number
        description: >-
          Posição da pessoa candidata na cédula
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: candidate_surname
        description: >-
          Sobrenome da pessoa candidata
      - name: candidate_given_names
        description: >-
          Prenomes da pessoa candidata
      - name: party_code
        description: >-
          Sigla do partido da pessoa candidata
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: is_declared_elected
        description: >-
          Indica se a pessoa candidata foi declarada eleita na disputa
  - name: au_qld_ecq_elections__enrolment_turnout
    description: >-
      Uma linha por disputa e rodada de apuração, com pessoas inscritas, votos totais,
      válidos e inválidos e os percentuais correspondentes. As apurações preliminar
      e
      oficial não são recortes redundantes do mesmo número, portanto filtre sempre
      por
      count_status.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - contest_type
            - count_status
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: lga_id
        description: >-
          Código da área de governo local no padrão ABS 2021
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__lga_2021')
              field: id_lga
      - name: lga_code
        description: >-
          Código da área de governo local atribuído pela própria ECQ
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: government_level
        description: >-
          Esfera de governo da disputa: estadual ou local
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: lga_name
        description: >-
          Nome da área de governo local tal como publicado pela ECQ
      - name: district_name
        description: >-
          Nome da disputa: distrito estadual, divisão de conselho ou cargo de prefeitura
      - name: count_status
        description: >-
          Estágio da apuração ao qual a linha se refere
      - name: count_round_number
        description: >-
          Número da rodada de apuração dentro do estágio
      - name: number_to_elect
        description: >-
          Número de cadeiras a preencher na disputa
      - name: candidates_count
        description: >-
          Número de pessoas candidatas na disputa
      - name: enrolment
        description: >-
          Número de pessoas inscritas na disputa
      - name: votes_total
        description: >-
          Total de votos apurados
      - name: votes_formal
        description: >-
          Total de votos válidos
      - name: votes_informal
        description: >-
          Total de votos inválidos
      - name: percentage_formal
        description: >-
          Votos válidos como percentual do total apurado
      - name: percentage_informal
        description: >-
          Votos inválidos como percentual do total apurado
      - name: percentage_roll_counted
        description: >-
          Votos apurados como percentual das pessoas inscritas
      - name: voting_method
        description: >-
          Método de votação ao qual os totais se referem
      - name: is_final
        description: >-
          Indica se a rodada de apuração é a final do estágio
      - name: last_updated
        description: >-
          Momento da última atualização da rodada de apuração pela ECQ
  - name: au_qld_ecq_elections__result_district
    description: >-
      Votos de cada pessoa candidata no total da disputa, por estágio e tipo de
      apuração. A ECQ não publica apuração de preferência entre dois partidos, apenas
      primeira preferência e preferência entre dois candidatos.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - contest_type
            - count_status
            - count_type
            - ballot_order_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: lga_id
        description: >-
          Código da área de governo local no padrão ABS 2021
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__lga_2021')
              field: id_lga
      - name: lga_code
        description: >-
          Código da área de governo local atribuído pela própria ECQ
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: government_level
        description: >-
          Esfera de governo da disputa: estadual ou local
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: lga_name
        description: >-
          Nome da área de governo local tal como publicado pela ECQ
      - name: district_name
        description: >-
          Nome da disputa: distrito estadual, divisão de conselho ou cargo de prefeitura
      - name: count_status
        description: >-
          Estágio da apuração ao qual a linha se refere
      - name: count_type
        description: >-
          Tipo de apuração ao qual os votos se referem
      - name: ballot_order_number
        description: >-
          Posição da pessoa candidata na cédula
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: party_code
        description: >-
          Sigla do partido da pessoa candidata
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: votes
        description: >-
          Votos recebidos pela pessoa candidata na disputa
      - name: percentage
        description: >-
          Votos da pessoa candidata como percentual dos votos válidos da disputa
  - name: au_qld_ecq_elections__result_voting_centre
    description: >-
      Votos de cada pessoa candidata em cada local de votação, por estágio e tipo
      de
      apuração, com os totais do local repetidos em cada linha de candidatura.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - contest_type
            - count_status
            - count_type
            - voting_centre_id
            - voting_centre_district_name
            - ballot_order_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: lga_id
        description: >-
          Código da área de governo local no padrão ABS 2021
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__lga_2021')
              field: id_lga
      - name: lga_code
        description: >-
          Código da área de governo local atribuído pela própria ECQ
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: government_level
        description: >-
          Esfera de governo da disputa: estadual ou local
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: lga_name
        description: >-
          Nome da área de governo local tal como publicado pela ECQ
      - name: district_name
        description: >-
          Nome da disputa: distrito estadual, divisão de conselho ou cargo de prefeitura
      - name: voting_centre_id
        description: >-
          Identificador do local de votação atribuído pela ECQ
      - name: count_status
        description: >-
          Estágio da apuração ao qual a linha se refere
      - name: count_type
        description: >-
          Tipo de apuração ao qual os votos se referem
      - name: ballot_order_number
        description: >-
          Posição da pessoa candidata na cédula
      - name: voting_centre_name
        description: >-
          Nome do local de votação
      - name: voting_centre_type_code
        description: >-
          Código do tipo de local de votação
      - name: voting_centre_district_name
        description: >-
          Nome do distrito de apuração ao qual o local de votação pertence
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como impresso na cédula
      - name: party_code
        description: >-
          Sigla do partido da pessoa candidata
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: votes
        description: >-
          Votos recebidos pela pessoa candidata no local de votação
      - name: percentage
        description: >-
          Votos da pessoa candidata como percentual dos votos válidos do local de
          votação
      - name: votes_total
        description: >-
          Total de votos apurados no local de votação
      - name: votes_formal
        description: >-
          Total de votos válidos no local de votação
      - name: votes_informal
        description: >-
          Total de votos inválidos no local de votação
  - name: au_qld_ecq_elections__distribution_of_preferences
    description: >-
      Transferências de voto na distribuição de preferências, no nível da disputa:
      uma
      linha por pessoa candidata excluída e pessoa candidata receptora. A ECQ também
      publica a mesma distribuição por local de votação, grão não incluído aqui.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - contest_type
            - count_status
            - distribution_number
            - excluded_ballot_order_number
            - ballot_order_number
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: contest_id
        description: >-
          Identificador da disputa por uma cadeira dentro do evento eleitoral
      - name: lga_id
        description: >-
          Código da área de governo local no padrão ABS 2021
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__lga_2021')
              field: id_lga
      - name: lga_code
        description: >-
          Código da área de governo local atribuído pela própria ECQ
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: government_level
        description: >-
          Esfera de governo da disputa: estadual ou local
      - name: contest_type
        description: >-
          Tipo de cadeira disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: lga_name
        description: >-
          Nome da área de governo local tal como publicado pela ECQ
      - name: district_name
        description: >-
          Nome da disputa: distrito estadual, divisão de conselho ou cargo de prefeitura
      - name: count_status
        description: >-
          Estágio da apuração ao qual a linha se refere
      - name: distribution_number
        description: >-
          Número da etapa de distribuição de preferências
      - name: excluded_ballot_order_number
        description: >-
          Posição na cédula da pessoa candidata excluída na etapa
      - name: ballot_order_number
        description: >-
          Posição na cédula da pessoa candidata que recebeu os votos transferidos
      - name: excluded_ballot_name
        description: >-
          Nome na cédula da pessoa candidata excluída na etapa
      - name: ballot_name
        description: >-
          Nome na cédula da pessoa candidata que recebeu os votos transferidos
      - name: party_code
        description: >-
          Sigla do partido da pessoa candidata
      - name: party_name
        description: >-
          Nome do partido da pessoa candidata
      - name: votes_transferred
        description: >-
          Votos transferidos da pessoa candidata excluída para a pessoa candidata
          receptora
      - name: percentage_transferred
        description: >-
          Votos transferidos como percentual dos votos distribuídos na etapa
      - name: votes_distributed
        description: >-
          Total de votos distribuídos na etapa
      - name: votes_exhausted
        description: >-
          Votos esgotados na etapa, sem preferência seguinte válida
      - name: percentage_exhausted
        description: >-
          Votos esgotados como percentual dos votos distribuídos na etapa
      - name: votes_remaining_in_count
        description: >-
          Votos que permanecem na apuração após a etapa
  - name: au_qld_ecq_elections__voting_centre
    description: >-
      Locais de votação de cada evento eleitoral, com endereço e coordenadas. O grão
      é
      uma linha por evento, local e distrito atendido: um local que atende dois
      distritos aparece duas vezes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - voting_centre_id
            - district_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [joint_type]
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela ECQ
      - name: voting_centre_id
        description: >-
          Identificador do local de votação atribuído pela ECQ
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: district_name
        description: >-
          Nome do distrito atendido pelo local de votação
      - name: voting_centre_name
        description: >-
          Nome do local de votação
      - name: building_name
        description: >-
          Nome do estabelecimento que sedia o local de votação
      - name: street_number
        description: >-
          Número do endereço do local de votação
      - name: street_name
        description: >-
          Logradouro do local de votação
      - name: locality
        description: >-
          Localidade ou bairro do local de votação
      - name: postcode
        description: >-
          Código postal do local de votação
      - name: state_abbreviation
        description: >-
          Sigla do estado ou território do local de votação
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: abbreviation
      - name: latitude
        description: >-
          Latitude do local de votação
      - name: longitude
        description: >-
          Longitude do local de votação
      - name: joint_type
        description: >-
          Papel do local de votação quando ele é compartilhado entre distritos
      - name: is_abolished
        description: >-
          Indica se o local de votação foi extinto
  - name: au_qld_ecq_elections__disclosure_gift
    description: >-
      Doações individuais declaradas ao Electronic Disclosure System da ECQ, reunindo
      as
      exportações estadual e local. Linhas inteiramente duplicadas são frequentes
      e não
      são necessariamente erros, de modo que a tabela não publica chave primária.
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - election_name
            - has_electoral_committee
            - electoral_committee_name
    columns:
      - name: year
        description: >-
          Ano da doação declarada
        tests:
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: government_level
        description: >-
          Esfera de governo à qual a doação se refere: estadual ou local
      - name: date_gift_made
        description: >-
          Data em que a doação foi feita
      - name: donor_name
        description: >-
          Nome de quem fez a doação
      - name: recipient_name
        description: >-
          Nome de quem recebeu a doação
      - name: gift_value
        description: >-
          Valor da doação em dólares australianos
      - name: election_name
        description: >-
          Nome do evento eleitoral ao qual a doação se refere
      - name: is_political_donation
        description: >-
          Indica se a doação foi declarada como doação política
      - name: has_electoral_committee
        description: >-
          Indica se quem recebeu a doação possui comitê eleitoral registrado
      - name: electoral_committee_name
        description: >-
          Nome do comitê eleitoral de quem recebeu a doação
  - name: au_qld_ecq_elections__disclosure_expenditure
    description: >-
      Despesas eleitorais individuais declaradas ao Electronic Disclosure System da
      ECQ,
      com bem ou serviço adquirido e finalidade. A cobertura é concentrada nos ciclos
      eleitorais e começa na prática em 2019.
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano em que a despesa foi incorrida
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: date_incurred
        description: >-
          Data em que a despesa foi incorrida
      - name: incurred_by_name
        description: >-
          Nome de quem incorreu na despesa
      - name: expenditure_value
        description: >-
          Valor da despesa em dólares australianos
      - name: candidate_type
        description: >-
          Categoria da candidatura que incorreu na despesa
      - name: local_electorate_name
        description: >-
          Nome da área eleitoral local à qual a despesa se refere
      - name: election_name
        description: >-
          Nome do evento eleitoral ao qual a despesa se refere
      - name: goods_or_services_description
        description: >-
          Descrição dos bens ou serviços adquiridos
      - name: expenditure_purpose
        description: >-
          Finalidade declarada da despesa
  - name: au_qld_ecq_elections__disclosure_return
    description: >-
      Totais recebidos e pagos nas declarações periódicas semestrais apresentadas
      ao
      Electronic Disclosure System da ECQ. As exportações do sistema não trazem coluna
      de situação da declaração, que é uma lacuna conhecida.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - return_for_name
            - period_start_date
            - period_end_date
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano de criação da declaração periódica
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: date_created
        description: >-
          Data de criação da declaração periódica
      - name: submitter_name
        description: >-
          Nome de quem apresentou a declaração
      - name: return_for_name
        description: >-
          Nome da entidade à qual a declaração se refere
      - name: period_start_date
        description: >-
          Data inicial do período de referência da declaração
      - name: period_end_date
        description: >-
          Data final do período de referência da declaração
      - name: period_label
        description: >-
          Rótulo do período de referência publicado pela ECQ
      - name: amount_received
        description: >-
          Total recebido no período de referência, em dólares australianos
      - name: amount_paid
        description: >-
          Total pago no período de referência, em dólares australianos
  - name: au_qld_ecq_elections__dicionario
    description: >-
      Correspondência entre as chaves codificadas das colunas do conjunto e o seu
      significado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [cobertura_temporal]
    columns:
      - name: id_tabela
        description: >-
          Slug da tabela descrita pela entrada do dicionário
      - name: nome_coluna
        description: >-
          Nome da coluna descrita pela entrada do dicionário
      - name: chave
        description: >-
          Valor da chave codificada na coluna
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da entrada do dicionário
      - name: valor
        description: >-
          Significado da chave codificada
