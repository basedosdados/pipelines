---
version: 2
models:
  - name: au_tas_tec_elections__election
    description: >-
      Catálogo dos eventos eleitorais estaduais da Tasmânia cobertos pelo conjunto:
      eleições gerais da Casa de Assembleia e eleições periódicas e suplementares
      do
      Conselho Legislativo. Serve de chave para todas as demais tabelas por election_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [election_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: election_name
        description: >-
          Nome do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento da Tasmânia à qual a disputa se refere
      - name: election_type
        description: >-
          Tipo do evento eleitoral
      - name: election_date
        description: >-
          Data da votação
      - name: seats_per_division
        description: >-
          Número de cadeiras preenchidas em cada divisão do evento
      - name: results_index_url
        description: >-
          Endereço da página de resultados publicada pela TEC para o evento
  - name: au_tas_tec_elections__candidate
    description: >-
      Pessoas candidatas em cada disputa, com partido, situação final e ordem de
      eleição. A Casa de Assembleia usa rotação Robson, que embaralha a ordem das
      candidaturas em cada cédula, por isso não há posição na cédula a publicar.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, election_id, contest_id, ballot_name]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - state_electoral_division_id
            - commonwealth_electoral_division_id
            - election_order
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma divisão dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento da Tasmânia à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de divisão disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da divisão disputada
      - name: commonwealth_electoral_division_id
        description: >-
          Código da divisão eleitoral federal correspondente, no padrão ASGS 2021
          do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__commonwealth_electoral_division_2021')
              field: id_commonwealth_electoral_division
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como publicado pela TEC
      - name: candidate_surname
        description: >-
          Sobrenome da pessoa candidata
      - name: candidate_given_names
        description: >-
          Prenomes da pessoa candidata
      - name: party_name
        description: >-
          Nome do partido ou grupo da pessoa candidata
      - name: is_elected
        description: >-
          Indica se a pessoa candidata foi eleita na disputa
      - name: election_order
        description: >-
          Ordem em que a pessoa candidata foi eleita dentro da disputa
      - name: candidate_status
        description: >-
          Situação final da pessoa candidata ao término da apuração
  - name: au_tas_tec_elections__enrolment_turnout
    description: >-
      Uma linha por disputa, com pessoas inscritas, cédulas apuradas, votos válidos
      e
      inválidos, quota e número de cadeiras. O voto é obrigatório nas duas câmaras
      em
      todo o período coberto.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, election_id, contest_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - state_electoral_division_id
            - commonwealth_electoral_division_id
            - percentage_turnout
            - percentage_informal
            - votes_total
            - votes_informal
            - enrolment
            - quota
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma divisão dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento da Tasmânia à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de divisão disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da divisão disputada
      - name: commonwealth_electoral_division_id
        description: >-
          Código da divisão eleitoral federal correspondente, no padrão ASGS 2021
          do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__commonwealth_electoral_division_2021')
              field: id_commonwealth_electoral_division
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: enrolment
        description: >-
          Número de pessoas inscritas na divisão
      - name: votes_total
        description: >-
          Total de cédulas apuradas
      - name: votes_formal
        description: >-
          Total de votos válidos
      - name: votes_informal
        description: >-
          Total de votos inválidos
      - name: percentage_turnout
        description: >-
          Cédulas apuradas como percentual das pessoas inscritas
      - name: percentage_informal
        description: >-
          Votos inválidos como percentual das cédulas apuradas
      - name: quota
        description: >-
          Quota necessária para a eleição na disputa
      - name: seats_to_elect
        description: >-
          Número de cadeiras a preencher na disputa
      - name: candidates_count
        description: >-
          Número de pessoas candidatas na disputa
  - name: au_tas_tec_elections__result_district
    description: >-
      Votos de cada pessoa candidata no total da divisão, por tipo de apuração. As
      linhas de primeira preferência e de distribuição final não são recortes
      redundantes do mesmo número, portanto filtre sempre por count_type.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - count_type
            - ballot_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - state_electoral_division_id
            - commonwealth_electoral_division_id
            - quotas
            - candidate_status
            - percentage_formal_votes
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma divisão dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento da Tasmânia à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de divisão disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da divisão disputada
      - name: commonwealth_electoral_division_id
        description: >-
          Código da divisão eleitoral federal correspondente, no padrão ASGS 2021
          do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__commonwealth_electoral_division_2021')
              field: id_commonwealth_electoral_division
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: count_type
        description: >-
          Tipo de apuração ao qual os votos se referem
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como publicado pela TEC
      - name: party_name
        description: >-
          Nome do partido ou grupo da pessoa candidata
      - name: votes
        description: >-
          Votos atribuídos à pessoa candidata
      - name: percentage_formal_votes
        description: >-
          Votos da pessoa candidata como percentual dos votos válidos da disputa
      - name: quotas
        description: >-
          Votos da pessoa candidata expressos em quotas
      - name: candidate_status
        description: >-
          Situação da pessoa candidata na apuração a que a linha se refere
  - name: au_tas_tec_elections__result_voting_centre
    description: >-
      Votos de primeira preferência de cada pessoa candidata em cada local de votação,
      com os totais do local repetidos em cada linha de candidatura. Inclui as
      categorias de voto especial publicadas pela TEC na mesma tabela.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - voting_centre_name
            - ballot_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - state_electoral_division_id
            - commonwealth_electoral_division_id
            - votes_informal
            - votes_total
            - votes_formal
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma divisão dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento da Tasmânia à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de divisão disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da divisão disputada
      - name: commonwealth_electoral_division_id
        description: >-
          Código da divisão eleitoral federal correspondente, no padrão ASGS 2021
          do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__commonwealth_electoral_division_2021')
              field: id_commonwealth_electoral_division
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: voting_centre_name
        description: >-
          Nome do local de votação
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como publicado pela TEC
      - name: party_name
        description: >-
          Nome do partido ou grupo da pessoa candidata
      - name: votes
        description: >-
          Votos de primeira preferência da pessoa candidata no local de votação
      - name: votes_formal
        description: >-
          Total de votos válidos no local de votação
      - name: votes_informal
        description: >-
          Total de votos inválidos no local de votação
      - name: votes_total
        description: >-
          Total de cédulas apuradas no local de votação
  - name: au_tas_tec_elections__distribution_of_preferences
    description: >-
      Transferências de voto contagem a contagem, com o total acumulado de cada pessoa
      candidata ao fim de cada contagem. Cobre a Casa de Assembleia a partir de 2024,
      quando a TEC passou a publicar a folha de escrutínio em planilha, e o Conselho
      Legislativo em todo o período.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - contest_id
            - count_number
            - ballot_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - state_electoral_division_id
            - commonwealth_electoral_division_id
            - votes_exhausted
            - remarks
            - votes_transferred
            - votes_progressive_total
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: contest_id
        description: >-
          Identificador da disputa por uma divisão dentro do evento eleitoral
      - name: chamber
        description: >-
          Câmara do parlamento da Tasmânia à qual a disputa se refere
      - name: government_level
        description: >-
          Esfera de governo da disputa
      - name: contest_type
        description: >-
          Tipo de divisão disputada
      - name: voting_system
        description: >-
          Sistema de votação aplicado à disputa
      - name: district_name
        description: >-
          Nome da divisão disputada
      - name: commonwealth_electoral_division_id
        description: >-
          Código da divisão eleitoral federal correspondente, no padrão ASGS 2021
          do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__commonwealth_electoral_division_2021')
              field: id_commonwealth_electoral_division
      - name: state_electoral_division_id
        description: >-
          Código do distrito eleitoral estadual no padrão ASGS 2021 do ABS
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
      - name: count_number
        description: >-
          Número da contagem dentro da apuração da disputa
      - name: ballot_name
        description: >-
          Nome da pessoa candidata tal como publicado pela TEC
      - name: party_name
        description: >-
          Nome do partido ou grupo da pessoa candidata
      - name: votes_transferred
        description: >-
          Votos transferidos para a pessoa candidata na contagem
      - name: votes_progressive_total
        description: >-
          Total acumulado de votos da pessoa candidata ao fim da contagem
      - name: votes_exhausted
        description: >-
          Votos esgotados acumulados ao fim da contagem, sem preferência seguinte
          válida
      - name: remarks
        description: >-
          Observação publicada pela TEC sobre o que ocorreu na contagem
  - name: au_tas_tec_elections__voting_centre
    description: >-
      Locais de votação de cada evento eleitoral, com endereço, código postal e nível
      de
      acessibilidade. O grão é uma linha por evento, local e divisão atendida.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - voting_centre_name
            - district_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - location_within_premise
            - premise_address
            - postcode
            - premise_name
            - disabled_access
            - locality
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral
      - name: voting_centre_name
        description: >-
          Nome do local de votação
      - name: locality
        description: >-
          Localidade do local de votação
      - name: premise_name
        description: >-
          Nome do estabelecimento que sedia o local de votação
      - name: premise_address
        description: >-
          Endereço do estabelecimento que sedia o local de votação
      - name: postcode
        description: >-
          Código postal do local de votação
      - name: state_abbreviation
        description: >-
          Sigla do estado do local de votação
      - name: location_within_premise
        description: >-
          Localização do local de votação dentro do estabelecimento
      - name: disabled_access
        description: >-
          Nível de acessibilidade do local de votação
      - name: district_name
        description: >-
          Nome da divisão atendida pelo local de votação
  - name: au_tas_tec_elections__dicionario
    description: >-
      Correspondência entre as chaves codificadas das colunas do conjunto e o seu
      significado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [cobertura_temporal]
    columns:
      - name: id_tabela
        description: >-
          Slug da tabela descrita pela entrada do dicionário
      - name: nome_coluna
        description: >-
          Nome da coluna descrita pela entrada do dicionário
      - name: chave
        description: >-
          Valor da chave codificada na coluna
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da entrada do dicionário
      - name: valor
        description: >-
          Significado da chave codificada
