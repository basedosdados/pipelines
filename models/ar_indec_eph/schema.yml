  - name: ar_indec_eph__microdatos_hogar
    description: >
      Microdatos de hogares de la Encuesta Permanente de Hogares (EPH continua) del
      INDEC,
      con una fila por hogar y trimestre. Cubre las 87 ondas trimestrales publicadas
      entre
      2003 Q3 y 2026 Q1 para los 31 aglomerados urbanos relevados. Incluye caracteristicas
      habitacionales de la vivienda, estrategias de ingreso del hogar, ingreso total
      familiar y per capita, y la organizacion de las tareas domesticas. Se vincula
      con
      microdatos_individuo por id_vivienda y nro_hogar. La tabla es la union de todos
      los
      esquemas de cuestionario de la serie, por lo que una columna que una onda no
      pregunto
      aparece nula en esa onda. INDEC no relevo 2007 Q3 y no publico 2015 Q3, 2015
      Q4 ni
      2016 Q1. Use siempre pondera como factor de expansion.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, trimestre, id_vivienda, nro_hogar]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - idimph
            - ii7_esp
            - ii8_esp
            - iv1_esp
            - iv3_esp
            - iv7_esp
    columns:
      - name: ano
        description: >
          Año de relevamiento
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano
      - name: trimestre
        description: >
          Número de trimestre
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__trimestre')
              field: trimestre
      - name: id_vivienda
        description: >
          Código para distinguir viviendas
        tests: [not_null]
      - name: nro_hogar
        description: >
