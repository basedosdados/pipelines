---
version: 2
models:
  - name: ar_indec_eph__microdatos_individuo
    description: >
      Microdatos de personas de la Encuesta Permanente de Hogares (EPH continua) del
      INDEC,
      con una fila por persona, hogar y trimestre. Cubre las 87 ondas trimestrales
      publicadas entre 2003 Q3 y 2026 Q1 para los 31 aglomerados urbanos relevados,
      aproximadamente el 70% de la poblacion urbana argentina. El cuestionario cambio
      a lo
      largo de la serie, por lo que la tabla es la union de todos los esquemas: una
      columna
      que una onda no pregunto aparece nula en esa onda, y la columna temporal_coverage
      de
      la arquitectura indica el periodo de vigencia de cada una. INDEC no relevo 2007
      Q3 y
      no publico 2015 Q3, 2015 Q4 ni 2016 Q1; las series entre 2007 y 2015 estan sujetas
      a
      la advertencia oficial de INDEC sobre el periodo de intervencion. Use siempre
      pondera
      como factor de expansion. El identificador de vivienda id_vivienda cambia de
      formato
      en 2016, por lo que no permite seguir una vivienda a traves de ese corte.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ano
            - trimestre
            - id_vivienda
            - nro_hogar
            - componente
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
