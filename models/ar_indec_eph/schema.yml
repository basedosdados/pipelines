  - name: ar_indec_eph__dicionario
    description: >
      Cobertura de diccionario para as colunas categoricas de ar_indec_eph. Traduz
      cada
      codigo armazenado nas tabelas de microdados para seu rotulo em espanhol, tal
      como
      publicado pelo INDEC. Os rotulos das ondas de 2003 a 2015 vem das etiquetas
      de valor
      dos arquivos Stata; os das ondas de 2016 em diante vem do desenho de registros
      publicado pelo INDEC, ja que as bases TXT nao trazem etiquetas.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
    columns:
      - name: id_tabela
        description: Nome da tabela de microdados a que se refere a linha
      - name: nome_coluna
        description: Nome da coluna codificada
      - name: chave
        description: Codigo armazenado na coluna
      - name: cobertura_temporal
        description: Periodo de vigencia do codigo
      - name: valor
        description: Rotulo do codigo, em espanhol, tal como publicado pelo INDEC
