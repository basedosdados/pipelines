---
version: 2
models:
  - name: au_abs_migration__overseas_country_of_birth_australia
    description: >-
      Migração internacional da Austrália por país de nascimento, uma linha por
      exercício fiscal e país, com chegadas, partidas e migração líquida do país
      como um todo. Os valores são arredondados pelo ABS para a dezena mais próxima,
      de modo que os componentes nem sempre somam os totais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, country_of_birth_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano inicial do exercício fiscal australiano a que se referem os dados;
          2004 corresponde ao exercício 2004-05, encerrado em 30 de junho de 2005
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: country_of_birth_id
        description: >-
          Código do país de nascimento na Standard Australian Classification of
          Countries (SACC) 2016, com quatro dígitos
        tests: [not_null]
      - name: country_iso3_code
        description: >-
          Código ISO 3166-1 alfa-3 do país de nascimento
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
      - name: arrivals
        description: >-
          Número de chegadas de migrantes do exterior
      - name: departures
        description: >-
          Número de partidas de migrantes para o exterior
      - name: net
        description: >-
          Migração líquida internacional: chegadas menos partidas
  - name: au_abs_migration__overseas_country_of_birth_state
    description: >-
      Migração internacional por país de nascimento e estado ou território de
      residência, uma linha por exercício fiscal, estado e país. Os valores são
      arredondados pelo ABS para a dezena mais próxima, de modo que os componentes
      nem sempre somam os totais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, state_id, country_of_birth_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano inicial do exercício fiscal australiano a que se referem os dados;
          2004 corresponde ao exercício 2004-05, encerrado em 30 de junho de 2005
