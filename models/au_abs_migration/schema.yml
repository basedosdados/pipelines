      fiscal, estado e grupo de visto. Os valores são arredondados pelo ABS para a
      dezena mais próxima, de modo que os componentes nem sempre somam os totais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, state_id, visa_group_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
