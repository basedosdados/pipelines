  - name: au_abs_migration__overseas_visa_quarter_australia
    description: >-
      Chegadas e partidas de migrantes internacionais da Austrália por grupo de
      visto ou de cidadania, em trimestres civis. O ABS revisa esta série a cada
      divulgação trimestral da população, de modo que o ano preliminar pode divergir
      das tabelas anuais, que refletem a divulgação anual. O código de visto 03
      (outros vistos) existe apenas nesta série; as planilhas anuais o incluem
      apenas no total. Os valores são arredondados pelo ABS para a dezena mais
      próxima, de modo que os componentes nem sempre somam os totais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, visa_group_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano civil de referência dos dados
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: quarter
        description: >-
          Trimestre civil de referência, de 1 a 4
        tests: [not_null]
      - name: visa_group_id
        description: >-
          Código do grupo de visto ou de cidadania do migrante no momento da
          migração
        tests: [not_null]
      - name: arrivals
        description: >-
          Número de chegadas de migrantes do exterior
      - name: departures
        description: >-
          Número de partidas de migrantes para o exterior
  - name: au_abs_migration__overseas_visa_quarter_state
    description: >-
