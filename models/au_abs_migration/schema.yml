  - name: au_abs_migration__dicionario
    description: >-
      Dicionário dos valores codificados usados nas tabelas de au_abs_migration:
      país de nascimento (SACC), grupo etário, sexo e grupo de visto.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [cobertura_temporal]
    columns:
      - name: id_tabela
        description: >-
          Slug da tabela de au_abs_migration descrita pela entrada
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Nome da coluna descrita pela entrada
        tests: [not_null]
      - name: chave
        description: >-
          Valor da chave, conforme armazenado na coluna
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da entrada
      - name: valor
        description: >-
          Descrição da chave
