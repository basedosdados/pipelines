  - name: au_abs_migration__overseas_visa_australia
    description: >-
      Chegadas e partidas de migrantes internacionais da Austrália por grupo de
      visto ou de cidadania, uma linha por exercício fiscal e grupo de visto.
      Contabiliza migrações segundo o visto detido no momento do deslocamento, e não
      vistos concedidos. Os valores são arredondados pelo ABS para a dezena mais
      próxima, de modo que os componentes nem sempre somam os totais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, visa_group_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano inicial do exercício fiscal australiano a que se referem os dados;
          2004 corresponde ao exercício 2004-05, encerrado em 30 de junho de 2005
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: visa_group_id
        description: >-
          Código do grupo de visto ou de cidadania do migrante no momento da
          migração
        tests: [not_null]
      - name: arrivals
        description: >-
          Número de chegadas de migrantes do exterior
      - name: departures
        description: >-
          Número de partidas de migrantes para o exterior
  - name: au_abs_migration__overseas_visa_state
    description: >-
      Chegadas e partidas de migrantes internacionais por grupo de visto ou de
