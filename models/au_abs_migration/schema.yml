        tests: [not_null]
      - name: arrivals
        description: >-
          Número de chegadas de migrantes do exterior
      - name: departures
        description: >-
          Número de partidas de migrantes para o exterior
  - name: au_abs_migration__interstate_age_sex_australia
    description: >-
      Migração interestadual na Austrália por grupo etário e sexo, uma linha por
      exercício fiscal, grupo etário e sexo. Os totais nacionais correspondem à soma
      dos deslocamentos entre estados e territórios. Os valores são arredondados
      pelo ABS para a dezena mais próxima, de modo que os componentes nem sempre
      somam os totais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, age_group, sex]
      - not_null_proportion_multiple_columns:
