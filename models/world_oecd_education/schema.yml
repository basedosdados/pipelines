---
version: 2
models:
  - name: world_oecd_education__student
    description: >-
      Matrículas, ingressantes, concluintes e repetentes por nível de ensino, área
      de formação, idade, sexo e mobilidade internacional, na coleta UOE conduzida
      em conjunto pela OCDE, pelo Instituto de Estatística da UNESCO e pelo
      Eurostat.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - reference_area
            - education_level
            - measure
            - education_type
            - intensity
            - education_field
            - grade
            - frequency
            - origin_area
            - destination_area
            - education_institution_type
            - mobility
            - unit_measure
            - sex
            - age
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('world_oecd_education__dicionario')
          columns_covered_by_dictionary:
            - reference_area
            - education_level
            - measure
            - education_type
            - intensity
            - education_field
            - grade
            - frequency
            - origin_area
            - destination_area
            - education_institution_type
            - mobility
            - unit_measure
            - sex
            - age
            - confidentiality_status
            - decimals
            - obs_status
            - origin_criterion
            - time_period_collection
            - unit_multiplier
    columns:
      - name: year
        description: >-
          Ano de referência da observação
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: country_iso3_code
        description: >-
          Código ISO 3166-1 alfa-3 do país da observação
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
      - name: reference_area
        description: >-
          Área de referência da observação: país, entidade subnacional ou agregado
      - name: education_level
        description: >-
          Nível de ensino segundo a CINE 2011 (ISCED 2011)
      - name: measure
        description: >-
          Grandeza medida pela observação
      - name: education_type
        description: >-
          Tipo de ensino, distinguindo educação formal inicial e de adultos
      - name: intensity
        description: >-
          Regime de dedicação do estudante: tempo integral ou parcial
      - name: education_field
        description: >-
          Área de formação segundo a CINE-F 2013
      - name: grade
        description: >-
          Série ou ano de estudo dentro do nível de ensino
      - name: frequency
        description: >-
          Periodicidade da série
      - name: origin_area
        description: >-
          País ou região de origem do estudante móvel
      - name: destination_area
        description: >-
          País ou região de destino do estudante móvel
      - name: education_institution_type
        description: >-
          Natureza da instituição de ensino: pública, privada dependente ou
          independente do governo
      - name: mobility
        description: >-
          Condição de mobilidade internacional do estudante
      - name: unit_measure
        description: >-
          Unidade em que a observação está expressa
      - name: sex
        description: >-
          Sexo da população de referência
      - name: age
        description: >-
          Idade ou faixa etária da população de referência
      - name: obs_value
        description: >-
          Valor da observação
      - name: obs_comment
        description: >-
          Nota de rodapé da fonte sobre a observação
      - name: confidentiality_status
        description: >-
          Situação de confidencialidade da observação
      - name: decimals
        description: >-
          Número de casas decimais com que a fonte publica o valor
      - name: obs_status
        description: >-
          Situação da observação, incluindo o motivo de ausência do valor
      - name: origin_criterion
        description: >-
          Critério usado para classificar a origem do estudante móvel
      - name: reference_date_ages
        description: >-
          Data de referência usada para apurar as idades
      - name: reporting_year_end
        description: >-
          Fim do ano de referência do país, quando não coincide com o ano civil
      - name: reporting_year_start
        description: >-
          Início do ano de referência do país, quando não coincide com o ano civil
      - name: time_period_collection
        description: >-
          Momento do período a que a coleta se refere
      - name: unit_multiplier
        description: >-
          Potência de dez pela qual o valor deve ser multiplicado
      - name: source_flow
        description: >-
          Dataflow SDMX de onde a linha foi extraída
      - name: source_flow_version
        description: >-
          Versão do dataflow SDMX de onde a linha foi extraída
