  - name: world_oecd_education__finance
    description: >-
      Despesa com instituições de ensino por origem dos recursos, destino e
      natureza do gasto, em valores absolutos, por estudante e como proporção do
      PIB. A fonte publica uma janela móvel de cerca de 18 anos, descartando os
      anos mais antigos a cada edição.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - reference_area
            - measure
            - education_level
            - financing_source
            - expenditure_destination
            - expenditure_type
            - price_base
            - unit_measure
            - questionnaire_sheet
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('world_oecd_education__dicionario')
          columns_covered_by_dictionary:
            - reference_area
            - measure
            - education_level
            - financing_source
            - expenditure_destination
            - expenditure_type
            - price_base
            - unit_measure
            - questionnaire_sheet
            - decimals
            - denominator_category
            - numerator_category
            - obs_status
            - obs_status_2
            - obs_status_3
            - unit_multiplier
    columns:
      - name: year
        description: >-
          Ano de referência da observação
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: country_iso3_code
        description: >-
          Código ISO 3166-1 alfa-3 do país da observação
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
      - name: reference_area
        description: >-
          Área de referência da observação: país, entidade subnacional ou agregado
      - name: measure
        description: >-
          Grandeza medida pela observação
      - name: education_level
        description: >-
          Nível de ensino segundo a CINE 2011 (ISCED 2011)
      - name: financing_source
        description: >-
          Origem dos recursos aplicados em educação
      - name: expenditure_destination
        description: >-
          Destino da despesa em educação
      - name: expenditure_type
        description: >-
          Natureza da despesa: corrente, de capital ou por rubrica
      - name: price_base
        description: >-
          Base de preços do valor monetário: corrente ou constante
      - name: unit_measure
        description: >-
          Unidade em que a observação está expressa
      - name: questionnaire_sheet
        description: >-
          Aba do questionário de origem da observação
      - name: obs_value
        description: >-
          Valor da observação
      - name: base_period
        description: >-
          Ano-base usado quando o valor está a preços constantes
      - name: decimals
        description: >-
          Número de casas decimais com que a fonte publica o valor
      - name: denominator_category
        description: >-
          Categoria que compõe o denominador do indicador
      - name: denominator_value
        description: >-
          Valor do denominador do indicador
      - name: last_modified
        description: >-
          Data em que a fonte modificou a observação
      - name: last_update
        description: >-
          Data em que a fonte atualizou a observação
      - name: numerator_category
        description: >-
          Categoria que compõe o numerador do indicador
      - name: numerator_value
        description: >-
          Valor do numerador do indicador
      - name: obs_status
        description: >-
          Situação da observação, incluindo o motivo de ausência do valor
      - name: obs_status_2
        description: >-
          Segunda marcação de situação da observação, quando a fonte registra mais
