  - name: world_oecd_education__talis_principal
    description: >-
      Resultados agregados do questionário de diretores da Pesquisa Internacional
      sobre Ensino e Aprendizagem (TALIS), com os mesmos recortes do questionário
      de docentes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - reference_area
            - frequency
            - measure
            - unit_measure
            - statistical_operation
            - education_level
            - age
            - sex
            - urbanisation_degree
            - institution_type
            - students_characteristics
            - teacher_profile
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('world_oecd_education__dicionario')
          columns_covered_by_dictionary:
            - reference_area
            - frequency
            - measure
            - unit_measure
            - statistical_operation
            - education_level
            - age
            - sex
            - urbanisation_degree
            - institution_type
            - students_characteristics
            - teacher_profile
            - decimals
            - obs_status
            - unit_multiplier
    columns:
      - name: year
        description: >-
          Ano de referência da observação
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: country_iso3_code
        description: >-
          Código ISO 3166-1 alfa-3 do país da observação
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
      - name: reference_area
        description: >-
          Área de referência da observação: país, entidade subnacional ou agregado
      - name: frequency
        description: >-
          Periodicidade da série
      - name: measure
        description: >-
          Grandeza medida pela observação
      - name: unit_measure
        description: >-
          Unidade em que a observação está expressa
      - name: statistical_operation
        description: >-
          Operação estatística aplicada ao valor, por exemplo média ou mediana
      - name: education_level
        description: >-
          Nível de ensino segundo a CINE 2011 (ISCED 2011)
      - name: age
        description: >-
          Idade ou faixa etária da população de referência
      - name: sex
        description: >-
          Sexo da população de referência
      - name: urbanisation_degree
        description: >-
          Grau de urbanização da localidade da escola
      - name: institution_type
        description: >-
          Tipo de instituição declarado no inquérito TALIS
      - name: students_characteristics
        description: >-
          Característica do corpo discente da escola no TALIS
      - name: teacher_profile
        description: >-
          Perfil do docente segundo o recorte usado no TALIS
      - name: obs_value
        description: >-
          Valor da observação
      - name: talis_question
        description: >-
          Pergunta do TALIS e resposta a que a observação corresponde
      - name: decimals
        description: >-
          Número de casas decimais com que a fonte publica o valor
      - name: obs_status
        description: >-
          Situação da observação, incluindo o motivo de ausência do valor
      - name: unit_multiplier
        description: >-
          Potência de dez pela qual o valor deve ser multiplicado
      - name: source_flow
        description: >-
          Dataflow SDMX de onde a linha foi extraída
      - name: source_flow_version
        description: >-
          Versão do dataflow SDMX de onde a linha foi extraída
  - name: world_oecd_education__dicionario
    description: >-
      Rótulos das colunas codificadas deste conjunto, extraídos das listas de
      códigos SDMX publicadas pela OCDE. As tabelas de fatos carregam apenas
      códigos: os rótulos são metadados de estrutura, não dados.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
    columns:
      - name: id_tabela
        description: >-
          Tabela deste conjunto a que a entrada se refere
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Coluna codificada a que a entrada se refere
        tests: [not_null]
      - name: chave
        description: >-
          Código tal como aparece na coluna
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da entrada, vazia quando igual à da tabela
      - name: valor
        description: >-
          Rótulo que a OCDE publica para o código
        tests: [not_null]
