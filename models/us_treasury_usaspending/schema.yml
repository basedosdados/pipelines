  - name: us_treasury_usaspending__assistance_transaction
    description: >
      Transações de assistência financeira federal norte-americana — subvenções,
      empréstimos, pagamentos diretos e seguros — publicadas pelo USAspending.gov,
      uma linha por ação, com agência concedente e financiadora, beneficiário,
      programa CFDA, valores empenhados e local de execução
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fiscal_year, assistance_transaction_id]
          config:
            where: __most_recent_fiscal_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - funding_opportunity_goals_text
            - funding_opportunity_number
            - highly_compensated_officer_1_amount
            - highly_compensated_officer_1_name
            - highly_compensated_officer_2_amount
            - highly_compensated_officer_2_name
            - highly_compensated_officer_3_amount
            - highly_compensated_officer_3_name
            - highly_compensated_officer_4_amount
            - highly_compensated_officer_4_name
            - highly_compensated_officer_5_amount
            - highly_compensated_officer_5_name
            - indirect_cost_federal_share_amount
            - obligated_amount_from_IIJA_supplemental_for_overall_award
            - outlayed_amount_from_IIJA_supplemental_for_overall_award
            - primary_place_of_performance_foreign_location
            - recipient_foreign_city_name
            - recipient_foreign_postal_code
            - recipient_foreign_province_name
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - action_type_code
            - business_funds_indicator_code
            - record_type_code
          dictionary_model: ref('us_treasury_usaspending__dicionario')
    columns:
      - name: fiscal_year
        description: >
          Ano fiscal federal norte-americano da data da ação, iniciado em 1º de
          outubro do ano civil anterior
        tests: [not_null]
      - name: assistance_transaction_id
        description: >
          Chave única da transação de assistência financeira, gerada pelo USAspending
        tests: [not_null]
      - name: assistance_award_id
        description: >
          Chave única do auxílio ao qual a transação pertence
      - name: award_id_fain
        description: >
          Número de identificação federal do auxílio (FAIN)
      - name: modification_number
        description: >
          Número do aditivo que identifica esta modificação do contrato
      - name: award_id_uri
        description: >
          Identificador único do registro (URI) para auxílios sem FAIN
      - name: sai_number
        description: >
          Número atribuído pelo processo estadual de revisão prévia (SAI)
      - name: federal_action_obligation
        description: >
          Valor empenhado ou desempenhado pelo governo federal nesta transação
      - name: total_obligated_amount
        description: >
          Valor total empenhado no auxílio, somadas todas as transações
      - name: total_outlayed_amount_for_overall_award
        description: >
          Valor total desembolsado no auxílio ou contrato até a data
      - name: indirect_cost_federal_share_amount
        description: >
          Parcela federal dos custos indiretos do auxílio
      - name: non_federal_funding_amount
        description: >
          Valor de contrapartida não federal aportado nesta transação
      - name: total_non_federal_funding_amount
        description: >
          Valor total de contrapartida não federal do auxílio
      - name: face_value_of_loan
        description: >
          Valor de face do empréstimo concedido nesta transação
      - name: original_loan_subsidy_cost
        description: >
          Custo de subsídio do empréstimo estimado nesta transação
      - name: total_face_value_of_loan
        description: >
          Valor de face total do empréstimo, somadas todas as transações
      - name: total_loan_subsidy_cost
        description: >
          Custo de subsídio total do empréstimo, somadas todas as transações
      - name: generated_pragmatic_obligations
        description: >
          Valor comparável entre modalidades, igual ao subsídio nos empréstimos e
          ao
          empenho nos demais auxílios
      - name: disaster_emergency_fund_codes_for_overall_award
        description: >
          Códigos de fundos de emergência e desastre que financiam o auxílio ou
          contrato, separados por ponto e vírgula
      - name: outlayed_amount_from_covid19_supplementals_for_overall_award
        description: >
          Valor desembolsado no auxílio ou contrato com recursos suplementares de
          resposta à COVID-19
      - name: obligated_amount_from_covid19_supplementals_for_overall_award
        description: >
