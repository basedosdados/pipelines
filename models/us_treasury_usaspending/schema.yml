---
version: 2
models:
  - name: us_treasury_usaspending__contract_transaction
    description: >
      Transações de contratos federais norte-americanos registradas no FPDS e
      publicadas pelo USAspending.gov, uma linha por ação contratual (assinatura
      ou aditivo), com agência concedente e financiadora, contratado, valores
      empenhados, objeto, local de execução e características da contratação
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [fiscal_year, contract_transaction_id]
          config:
            where: __most_recent_fiscal_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - highly_compensated_officer_4_amount
            - highly_compensated_officer_5_amount
            - highly_compensated_officer_5_name
            - idv_type
            - idv_type_code
            - multiple_or_single_award_idv
            - multiple_or_single_award_idv_code
            - obligated_amount_from_IIJA_supplemental_for_overall_award
            - obligated_amount_from_covid19_supplementals_for_overall_award
            - ordering_period_end_date
            - other_statutory_authority
            - outlayed_amount_from_IIJA_supplemental_for_overall_award
            - outlayed_amount_from_covid19_supplementals_for_overall_award
            - program_acronym
            - recipient_address_line_2
            - recipient_doing_business_as_name
            - research
            - sam_exception
            - type_of_idc
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - action_type
            - airport_authority
            - alaskan_native_corporation_owned_firm
            - alaskan_native_servicing_institution
            - american_indian_owned_business
            - asian_pacific_american_owned_business
            - award_type_code
            - black_american_owned_business
            - c8a_program_participant
            - city_local_government
            - community_developed_corporation_owned_firm
            - community_development_corporation
            - consolidated_contract
            - construction_wage_rate_requirements_code
            - contingency_humanitarian_or_peacekeeping_operation_code
            - contracting_officers_determination_of_business_size_code
            - corporate_entity_not_tax_exempt
            - corporate_entity_tax_exempt
            - cost_accounting_standards_clause_code
            - cost_or_pricing_data
            - council_of_governments
            - county_local_government
            - domestic_shelter
            - dot_certified_disadvantage
            - economically_disadvantaged_women_owned_small_business
            - educational_institution
            - emerging_small_business
            - epa_designated_product
            - extent_competed
            - fed_biz_opps
            - federal_agency
            - federally_funded_research_and_development_corp
            - for_profit_organization
            - foreign_government
            - foreign_owned
            - foundation
            - government_furnished_property_code
            - hispanic_american_owned_business
            - hispanic_servicing_institution
            - historically_black_college
            - historically_underutilized_business_zone_hubzone_firm
            - hospital_flag
            - housing_authorities_public_tribal
            - idv_type
            - indian_tribe_federally_recognized
            - information_technology_commercial_item_category_code
            - inter_municipal_local_government
            - interagency_contracting_authority_code
            - international_organization
            - interstate_entity
            - joint_venture_economic_disadvantaged_women_owned_small_bus
            - joint_venture_women_owned_small_business
            - labor_standards
            - labor_surplus_area_firm
            - land_grant_college_1862
            - land_grant_college_1890
            - land_grant_college_1994
            - limited_liability_corporation
            - local_government_owned
            - manufacturer_of_goods
            - materials_supplies_articles_equipment_code
            - minority_institution
            - minority_owned_business
            - multi_year_contract
            - municipality_local_government
            - native_american_owned_business
            - native_hawaiian_organization_owned_firm
            - native_hawaiian_servicing_institution
            - nonprofit_organization
            - other_minority_owned_business
            - other_not_for_profit_organization
            - parent_award_type_code
            - partnership_or_limited_liability_partnership
            - performance_based_service_acquisition_code
            - planning_commission
            - port_authority
            - private_university_or_college
            - purchase_card_as_payment_method_code
            - receives_contracts
            - receives_contracts_and_financial_assistance
            - receives_financial_assistance
            - research
            - sam_exception
            - sba_certified_8a_joint_venture
            - school_district_local_government
            - school_of_forestry
            - sea_transportation
            - self_certified_small_disadvantaged_business
            - service_disabled_veteran_owned_business
            - simplified_procedures_for_certain_commercial_items_code
            - small_agricultural_cooperative
            - small_business_competitiveness_demonstration_program
            - small_disadvantaged_business
            - sole_proprietorship
            - state_controlled_institution_of_higher_learning
            - subchapter_scorporation
            - subcontinent_asian_asian_indian_american_owned_business
            - subcontracting_plan
            - the_ability_one_program
            - township_local_government
            - transit_authority
            - tribal_college
            - tribally_owned_firm
            - type_of_idc
            - us_federal_government
            - us_government_entity
            - us_local_government
            - us_state_government
            - us_tribal_government
            - veteran_owned_business
            - veterinary_college
            - veterinary_hospital
            - woman_owned_business
            - women_owned_small_business
          dictionary_model: ref('us_treasury_usaspending__dicionario')
    columns:
      - name: fiscal_year
        description: >
          Ano fiscal federal norte-americano da data da ação, iniciado em 1º de
          outubro do ano civil anterior
        tests: [not_null]
      - name: contract_transaction_id
        description: >
          Chave única da transação de contrato, gerada pelo USAspending
        tests: [not_null]
      - name: contract_award_id
        description: >
          Chave única do contrato ao qual a transação pertence
      - name: award_id_piid
        description: >
          Identificador do instrumento de compra (PIID) atribuído pela agência
      - name: modification_number
        description: >
          Número do aditivo que identifica esta modificação do contrato
      - name: transaction_number
        description: >
          Número que distingue transações registradas com o mesmo PIID e aditivo
      - name: parent_award_agency_id
        description: >
          Código da agência que firmou o contrato-mãe (IDV)
      - name: parent_award_agency_name
        description: >
          Nome da agência que firmou o contrato-mãe (IDV)
      - name: parent_award_id_piid
        description: >
          Identificador (PIID) do contrato-mãe ao qual a ação se vincula
      - name: parent_award_modification_number
        description: >
          Número do aditivo do contrato-mãe
      - name: federal_action_obligation
        description: >
          Valor empenhado ou desempenhado pelo governo federal nesta transação
      - name: total_dollars_obligated
        description: >
          Valor total empenhado no contrato, somadas todas as transações
      - name: total_outlayed_amount_for_overall_award
        description: >
          Valor total desembolsado no auxílio ou contrato até a data
      - name: base_and_exercised_options_value
        description: >
          Valor do contrato considerando a base e as opções já exercidas nesta
          transação
      - name: current_total_value_of_award
        description: >
          Valor total corrente do contrato, incluindo as opções já exercidas
      - name: base_and_all_options_value
        description: >
          Valor do contrato considerando a base e todas as opções previstas nesta
          transação
      - name: potential_total_value_of_award
        description: >
          Valor total potencial do contrato caso todas as opções sejam exercidas
      - name: disaster_emergency_fund_codes_for_overall_award
        description: >
          Códigos de fundos de emergência e desastre que financiam o auxílio ou
          contrato, separados por ponto e vírgula
      - name: outlayed_amount_from_covid19_supplementals_for_overall_award
        description: >
          Valor desembolsado no auxílio ou contrato com recursos suplementares de
          resposta à COVID-19
      - name: obligated_amount_from_covid19_supplementals_for_overall_award
        description: >
          Valor empenhado no auxílio ou contrato com recursos suplementares de
          resposta à COVID-19
      - name: outlayed_amount_from_IIJA_supplemental_for_overall_award
        description: >
          Valor desembolsado no auxílio ou contrato com recursos suplementares da
          lei
          de infraestrutura (IIJA)
      - name: obligated_amount_from_IIJA_supplemental_for_overall_award
        description: >
          Valor empenhado no auxílio ou contrato com recursos suplementares da lei
          de
          infraestrutura (IIJA)
      - name: action_date
        description: >
          Data em que a ação foi assinada ou passou a vigorar
      - name: period_of_performance_start_date
        description: >
          Data de início do período de execução
      - name: period_of_performance_current_end_date
        description: >
          Data de término corrente do período de execução
      - name: period_of_performance_potential_end_date
        description: >
          Data de término do período de execução caso todas as opções sejam exercidas
      - name: ordering_period_end_date
        description: >
          Data-limite para emissão de novos pedidos sob o contrato-mãe
      - name: solicitation_date
        description: >
          Data de publicação do edital
      - name: awarding_agency_code
        description: >
          Código CGAC da agência que concedeu o auxílio ou contrato
      - name: awarding_agency_name
        description: >
          Nome da agência que concedeu o auxílio ou contrato
      - name: awarding_sub_agency_code
        description: >
          Código da subagência que concedeu o auxílio ou contrato
      - name: awarding_sub_agency_name
        description: >
          Nome da subagência que concedeu o auxílio ou contrato
      - name: awarding_office_code
        description: >
          Código do escritório que concedeu o auxílio ou contrato
      - name: awarding_office_name
        description: >
          Nome do escritório que concedeu o auxílio ou contrato
      - name: funding_agency_code
        description: >
          Código CGAC da agência que forneceu os recursos
      - name: funding_agency_name
        description: >
          Nome da agência que forneceu os recursos
      - name: funding_sub_agency_code
        description: >
          Código da subagência que forneceu os recursos
      - name: funding_sub_agency_name
        description: >
          Nome da subagência que forneceu os recursos
      - name: funding_office_code
        description: >
          Código do escritório que forneceu os recursos
      - name: funding_office_name
        description: >
          Nome do escritório que forneceu os recursos
      - name: treasury_accounts_funding_this_award
        description: >
          Contas do Tesouro (TAS) que financiam o auxílio ou contrato, separadas por
          ponto e vírgula
      - name: federal_accounts_funding_this_award
        description: >
          Contas federais que financiam o auxílio ou contrato, separadas por ponto
          e
          vírgula
      - name: object_classes_funding_this_award
        description: >
          Classes de objeto de despesa que financiam o auxílio ou contrato, separadas
          por ponto e vírgula
      - name: program_activities_funding_this_award
        description: >
          Atividades programáticas que financiam o auxílio ou contrato, separadas
          por
          ponto e vírgula
      - name: foreign_funding
        description: >
          Código de uso de recursos de origem estrangeira no contrato
      - name: foreign_funding_description
        description: >
          Descrição de uso de recursos de origem estrangeira no contrato
      - name: sam_exception
        description: >
          Código de exceção que dispensa o fornecedor de registro no SAM
      - name: sam_exception_description
        description: >
          Descrição de exceção que dispensa o fornecedor de registro no SAM
      - name: recipient_uei
        description: >
          Identificador único de entidade (UEI) do beneficiário
      - name: recipient_duns
        description: >
          Número DUNS do beneficiário, identificador usado antes da adoção do UEI
      - name: recipient_name
        description: >
          Nome do beneficiário, padronizado a partir do registro no SAM
      - name: recipient_name_raw
        description: >
          Nome do beneficiário exatamente como informado pela agência
      - name: recipient_doing_business_as_name
        description: >
          Nome fantasia do beneficiário
      - name: cage_code
        description: >
          Código CAGE do beneficiário, atribuído pelo Departamento de Defesa
      - name: recipient_parent_uei
        description: >
          Identificador único de entidade (UEI) da controladora do beneficiário
      - name: recipient_parent_duns
        description: >
          Número DUNS da controladora do beneficiário
      - name: recipient_parent_name
        description: >
          Nome da controladora do beneficiário, padronizado a partir do registro no
          SAM
      - name: recipient_parent_name_raw
        description: >
          Nome da controladora do beneficiário exatamente como informado pela agência
      - name: recipient_country_code
        description: >
          Código do país do endereço do beneficiário
      - name: recipient_country_name
        description: >
          Nome do país do endereço do beneficiário
      - name: recipient_address_line_1
        description: >
          Primeira linha do endereço do beneficiário
      - name: recipient_address_line_2
        description: >
          Segunda linha do endereço do beneficiário
      - name: recipient_city_name
        description: >
          Nome da cidade do beneficiário
      - name: prime_award_transaction_recipient_county_fips_code
        description: >
          Código FIPS de cinco dígitos do condado do beneficiário
      - name: recipient_county_name
        description: >
          Nome do condado do beneficiário
      - name: prime_award_transaction_recipient_state_fips_code
        description: >
          Código FIPS de dois dígitos do estado do beneficiário
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              config:
                where: __most_recent_fiscal_year__
      - name: recipient_state_code
