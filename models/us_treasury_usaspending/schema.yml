      - name: prime_award_transaction_recipient_cd_original
        description: >
          Distrito eleitoral do beneficiário na delimitação vigente na data da ação
      - name: prime_award_transaction_recipient_cd_current
        description: >
          Distrito eleitoral do beneficiário na delimitação vigente atualmente
      - name: recipient_phone_number
        description: >
          Telefone do beneficiário
      - name: recipient_fax_number
        description: >
