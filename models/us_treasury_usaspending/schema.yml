  - name: us_treasury_usaspending__dicionario
    description: >
      Dicionário dos valores codificados das tabelas do conjunto, com uma linha
      por par de chave e valor, construído a partir dos domínios do dicionário de
      elementos do DATA Act
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [cobertura_temporal]
    columns:
      - name: id_tabela
        description: >
          Nome da tabela à qual a chave se aplica
      - name: nome_coluna
        description: >
          Nome da coluna à qual a chave se aplica
      - name: chave
        description: >
          Valor codificado armazenado na coluna
      - name: cobertura_temporal
        description: >
          Período em que a chave é válida
      - name: valor
        description: >-
          Significado da chave
