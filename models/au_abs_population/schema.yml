---
version: 2
models:
  - name: au_abs_population__national_state
    description: 'Quarterly estimated resident population and components of population
      change for Australia and for each state and territory (ABS, former catalogue
      3101.0), from the June quarter 1981. One row per quarter, region, sex and measure,
      keyed on the ABS Series ID. Measures cover the estimated resident population,
      births, deaths, natural increase, interstate and overseas arrivals and departures,
      and net interstate and net overseas migration. The unit varies by row and is
      given by the unit column: ABS publishes the Australia-only summary series in
      thousands and the state series in persons. Where a measure was published in
      both, the persons figure is kept, which was verified to differ from the thousands
      figure by at most 50 persons, exactly half of the rounding unit.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, quarter, region_name, sex, measure]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: Reference year of the quarterly observation
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: quarter
        description: Reference quarter of the observation, from 1 to 4
        tests: [not_null]
      - name: geography_level
        description: Geographic level of the row, either state or australia
        tests: [not_null]
      - name: state_id
        description: Code of the Australian state or territory
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
      - name: region_name
        description: Name of the state, territory or national aggregate as published
          by the ABS
        tests: [not_null]
      - name: sex
        description: Sex of the population counted
        tests: [not_null]
      - name: measure
        description: Demographic measure reported by the series
        tests: [not_null]
      - name: unit
        description: Unit the value is published in
      - name: series_id
        description: ABS series identifier of the observation
        tests:
          - not_null
          - relationships:
              to: ref('au_abs_population__series')
              field: series_id
      - name: value
        description: Observed value of the series for the quarter
  - name: au_abs_population__erp_age_sex
    description: Estimated resident population by single year of age and sex, at 30
      June, for Australia and for each state and territory (ABS, former catalogue
      3101.0), from 1971. One row per year, region, sex and single year of age. This
      is the historical actual population; the projection table holds the projected
      population on the same grain.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, region_name, sex, age]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: Reference year of the estimate, at 30 June
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: geography_level
        description: Geographic level of the row, either state or australia
        tests: [not_null]
      - name: state_id
        description: Code of the Australian state or territory
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
      - name: region_name
        description: Name of the state, territory or national aggregate as published
          by the ABS
        tests: [not_null]
      - name: sex
        description: Sex of the population counted
        tests: [not_null]
      - name: age
        description: Single year of age of the population counted
        tests: [not_null]
      - name: series_id
        description: ABS series identifier of the observation
        tests:
          - not_null
          - relationships:
              to: ref('au_abs_population__series')
              field: series_id
      - name: erp
        description: Estimated resident population at 30 June
        tests: [not_null]
  - name: au_abs_population__projection
    description: 'Population projections by single year of age and sex, at 30 June,
      for Australia and for each state and territory (ABS, former catalogue 3222.0).
      One row per projected year, series, region, sex and age, covering the three
      published series: high (ABS series 1(A)), medium (29(B)) and low (45(C)). These
      are projections, not estimates: they are the arithmetic consequence of the stated
      fertility, mortality and migration assumptions, not a forecast. The historical
      actual population on the same grain is in the erp_age_sex table.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, series, region_name, sex, age]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: Year the population is projected for, at 30 June
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: projection_base_year
        description: Year of the estimated resident population the projection is based
          on
      - name: series
        description: Projection series, high, medium or low
        tests: [not_null]
      - name: geography_level
        description: Geographic level of the row, either state or australia
        tests: [not_null]
      - name: state_id
        description: Code of the Australian state or territory
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
      - name: region_name
        description: Name of the state, territory or national aggregate as published
          by the ABS
        tests: [not_null]
      - name: sex
        description: Sex of the population counted
        tests: [not_null]
      - name: age
        description: Single year of age of the projected population
        tests: [not_null]
      - name: series_id
        description: ABS series identifier of the projected series
        tests:
          - not_null
          - relationships:
              to: ref('au_abs_population__series')
              field: series_id
      - name: projected_population
        description: Projected population at 30 June
        tests: [not_null]
  - name: au_abs_population__regional_sa2
    description: 'Estimated resident population and components of population change
      by Statistical Area Level 2 (ABS, former catalogue 3218.0), from 2001. One row
      per SA2 and year, carrying the full ASGS hierarchy so that SA3, SA4, GCCSA and
      state totals can be recomputed by summing: every aggregate ABS publishes was
      verified to equal the sum of its SA2s exactly, at every level and in every year,
      so the pre-aggregated levels are not stored. Components of change are published
      for the four most recent financial years only. Exception: population_density
      is excluded from the non-null proportion test because ABS publishes it for a
      single year of the series.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, sa2_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [population_density]
    columns:
      - name: year
        description: Reference year, at 30 June for the population and the financial
          year ending 30 June for the components
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: sa2_id
        description: Code of the Statistical Area Level 2
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__sa2_2021')
              field: id_sa2
      - name: sa2_name
        description: Name of the Statistical Area Level 2
      - name: sa3_id
        description: Code of the Statistical Area Level 3 containing the SA2
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__sa3_2021')
              field: id_sa3
      - name: sa4_id
        description: Code of the Statistical Area Level 4 containing the SA2
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__sa4_2021')
              field: id_sa4
      - name: gccsa_id
        description: Code of the Greater Capital City Statistical Area containing
          the SA2
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__gccsa_2021')
              field: id_gccsa
      - name: state_id
        description: Code of the Australian state or territory containing the SA2
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
      - name: erp
        description: Estimated resident population at 30 June
        tests: [not_null]
      - name: births
        description: Number of births registered to usual residents of the area during
          the financial year
      - name: deaths
        description: Number of deaths of usual residents of the area during the financial
          year
      - name: natural_increase
        description: Births less deaths during the financial year
      - name: internal_arrivals
        description: Number of people who moved into the area from elsewhere in Australia
      - name: internal_departures
        description: Number of people who moved out of the area to elsewhere in Australia
      - name: net_internal_migration
        description: Internal arrivals less internal departures
      - name: overseas_arrivals
        description: Number of people who moved into the area from overseas
      - name: overseas_departures
        description: Number of people who moved out of the area to overseas
      - name: net_overseas_migration
        description: Overseas arrivals less overseas departures
      - name: area_sqkm
        description: Area of the region in square kilometres
      - name: population_density
        description: Estimated resident population per square kilometre, as published
          by the ABS
  - name: au_abs_population__regional_lga
    description: 'Estimated resident population and components of population change
      by Local Government Area (ABS, former catalogue 3218.0), from 2001. One row
      per LGA and year. Components of change are published for the four most recent
      financial years only. Exceptions: three LGA codes are ignored in the directory
      relationship test because ABS restates the series onto boundaries newer than
      the ASGS 2021 LGA directory (24700 Merri-bek, renamed from Moreland in 2022;
      71500 East Arnhem and 71700 Groote Archipelago, split in 2023); and population_density
      is excluded from the non-null proportion test because ABS publishes it for a
      single year of the series.'
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, lga_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [population_density]
    columns:
      - name: year
        description: Reference year, at 30 June for the population and the financial
          year ending 30 June for the components
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: lga_id
        description: Code of the Local Government Area
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_au__lga_2021')
              field: id_lga
              ignore_values: ['24700', '71500', '71700']
              proportion_allowed_failures: 0
      - name: lga_name
        description: Name of the Local Government Area
      - name: state_id
        description: Code of the Australian state or territory containing the LGA
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
      - name: erp
        description: Estimated resident population at 30 June
        tests: [not_null]
      - name: births
        description: Number of births registered to usual residents of the area during
          the financial year
      - name: deaths
        description: Number of deaths of usual residents of the area during the financial
          year
      - name: natural_increase
        description: Births less deaths during the financial year
      - name: internal_arrivals
        description: Number of people who moved into the area from elsewhere in Australia
      - name: internal_departures
        description: Number of people who moved out of the area to elsewhere in Australia
      - name: net_internal_migration
        description: Internal arrivals less internal departures
      - name: overseas_arrivals
        description: Number of people who moved into the area from overseas
      - name: overseas_departures
        description: Number of people who moved out of the area to overseas
      - name: net_overseas_migration
        description: Overseas arrivals less overseas departures
      - name: area_sqkm
        description: Area of the region in square kilometres
      - name: population_density
        description: Estimated resident population per square kilometre, as published
          by the ABS
  - name: au_abs_population__series
    description: Dimension table of the ABS time series that feed this dataset, one
      row per ABS Series ID, covering the national and state population estimates
      (former catalogue 3101.0) and the population projections (3222.0). Carries the
      series description, unit, frequency, source table and observation span. The
      Series ID is stable across ABS releases and products, so it is the key for joining
      these tables to other ABS output.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [series_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: series_id
        description: ABS series identifier uniquely identifying a time series across
          ABS releases
        tests: [not_null]
      - name: description
        description: Full description of the data item as published by the ABS
        tests: [not_null]
      - name: unit
        description: Unit of measure of the series as published by the ABS
        tests: [not_null]
      - name: frequency
        description: Publication frequency of the series, Quarter or Annual
        tests: [not_null]
      - name: source_catalogue
        description: ABS catalogue number the series is published under
      - name: source_table
        description: Title of the source ABS table the series is published in
      - name: series_start
        description: Date of the first observation of the series
      - name: series_end
        description: Date of the last observation of the series
