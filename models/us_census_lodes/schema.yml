        description: Número de empregos no setor NAICS 51 (Informação)
      - name: jobs_naics_52
        description: Número de empregos no setor NAICS 52 (Atividades financeiras
          e de seguros)
      - name: jobs_naics_53
        description: Número de empregos no setor NAICS 53 (Atividades imobiliárias
