  - name: us_census_lodes__geography_crosswalk
    description: Relação entre cada bloco censitário de tabulação de 2020 e as demais
      unidades geográficas suportadas pelo aplicativo OnTheMap, incluindo condado,
      setor censitário, grupo de blocos, região metropolitana, ZCTA, lugar, distrito
      eleitoral e distrito escolar, além do ponto interno do bloco. Retrata a delimitação
      vigente na divulgação do LODES 8.4 e é substituída integralmente a cada nova
      versão.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [block_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - alaska_native_corporation_id
            - alaska_native_corporation_name
            - block_group_name
            - cbsa_id
            - cbsa_name
            - census_tract_name
            - congressional_district_id
            - congressional_district_name
            - county_subdivision_id
            - county_subdivision_name
            - military_installation_id
            - military_installation_name
            - place_id
            - place_name
            - school_district_id
            - school_district_name
            - secondary_school_district_id
            - secondary_school_district_name
            - state_legislative_district_lower_id
            - state_legislative_district_lower_name
            - state_legislative_district_upper_id
            - state_legislative_district_upper_name
            - tribal_area_id
            - tribal_area_name
            - tribal_subdivision_id
            - tribal_subdivision_name
            - workforce_board_id
            - workforce_board_name
            - zcta_id
            - zcta_name
    columns:
      - name: block_id
        description: Código do bloco censitário de tabulação de 2020
        tests: [not_null]
      - name: state_id
        description: Código FIPS do estado
        tests:
