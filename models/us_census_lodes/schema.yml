---
version: 2
models:
  - name: us_census_lodes__residence_jobs
    description: Número de empregos por bloco censitário de residência do trabalhador,
      ano e tipo de vínculo, com desagregações por idade, faixa de rendimento, setor
      NAICS, raça, etnia, escolaridade e sexo. Corresponde aos arquivos Residence
      Area Characteristics (RAC) do LODES 8, segmento S000 (todos os trabalhadores).
      Os dados são enumerados em blocos censitários de 2020 e toda a série histórica
      foi reprocessada para essa malha; códigos de bloco de versões anteriores do
      LODES (malha de 2010) não são comparáveis sem os arquivos de relacionamento
      do Census Bureau.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, job_type, block_id]
          config:
            where: __most_recent_year__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - jobs_education_bachelors_or_higher
            - jobs_education_high_school
            - jobs_education_less_than_high_school
            - jobs_education_some_college
            - jobs_ethnicity_hispanic
            - jobs_ethnicity_not_hispanic
            - jobs_race_american_indian_alaska_native
            - jobs_race_asian
            - jobs_race_black
            - jobs_race_native_hawaiian_pacific_islander
            - jobs_race_two_or_more
            - jobs_race_white
            - jobs_sex_female
            - jobs_sex_male
          config:
            where: __most_recent_year__
    columns:
      - name: year
        description: Ano de referência dos dados
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year__
      - name: state_id
        description: Código FIPS do estado do bloco censitário de residência
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              config:
                where: __most_recent_year__
      - name: county_id
        description: Código FIPS do condado do bloco censitário de residência
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__county')
              field: id_county
              config:
                where: __most_recent_year__
      - name: census_tract_id
        description: Código do setor censitário de 2020 do bloco de residência
        tests:
          - relationships:
              to: ref('br_bd_diretorios_us__census_tract_2020')
              field: id_census_tract
              config:
                where: __most_recent_year__
      - name: block_id
        description: Código do bloco censitário de tabulação de 2020 de residência
        tests: [not_null]
      - name: job_type
        description: Tipo de vínculo empregatício considerado na tabulação
        tests: [not_null]
      - name: jobs_total
        description: Número total de empregos
      - name: jobs_age_29_or_younger
        description: Número de empregos de trabalhadores de 29 anos ou menos
      - name: jobs_age_30_to_54
        description: Número de empregos de trabalhadores de 30 a 54 anos
      - name: jobs_age_55_or_older
        description: Número de empregos de trabalhadores de 55 anos ou mais
      - name: jobs_earnings_1250_or_less
        description: Número de empregos com rendimento mensal de até 1.250 dólares
      - name: jobs_earnings_1251_to_3333
        description: Número de empregos com rendimento mensal de 1.251 a 3.333 dólares
      - name: jobs_earnings_above_3333
        description: Número de empregos com rendimento mensal superior a 3.333 dólares
      - name: jobs_naics_11
        description: Número de empregos no setor NAICS 11 (Agricultura, silvicultura,
          pesca e caça)
      - name: jobs_naics_21
