      - name: jobs_race_two_or_more
        description: Número de empregos de trabalhadores de dois ou mais grupos raciais
      - name: jobs_ethnicity_not_hispanic
        description: Número de empregos de trabalhadores não hispânicos ou latinos
      - name: jobs_ethnicity_hispanic
        description: Número de empregos de trabalhadores hispânicos ou latinos
      - name: jobs_education_less_than_high_school
        description: Número de empregos de trabalhadores sem ensino médio completo
