      - name: jobs_naics_92
        description: Número de empregos no setor NAICS 92 (Administração pública)
      - name: jobs_race_white
        description: Número de empregos de trabalhadores de raça branca, isoladamente
      - name: jobs_race_black
        description: Número de empregos de trabalhadores negros ou afro-americanos,
