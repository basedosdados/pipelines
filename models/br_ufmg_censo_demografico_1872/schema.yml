---
version: 2
models:
  - name: br_ufmg_censo_demografico_1872__provincia
    description: >-
      Províncias do Império do Brasil recenseadas em 1872, com os códigos usados no
      banco Pop-72 e os nomes na grafia da época.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_provincia]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >-
          Ano de referência do recenseamento
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: id_provincia
        description: >-
          Código da província no banco Pop-72, de 1 a 21
        tests: [not_null]
      - name: nome_provincia
        description: >-
          Nome da província conforme grafia de 1872
  - name: br_ufmg_censo_demografico_1872__municipio
    description: >-
      Municípios do Império do Brasil recenseados em 1872, com os códigos usados no
      banco Pop-72. Os códigos não correspondem aos do IBGE e não há tradutor oficial
      para os municípios atuais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_municipio_1872]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >-
          Ano de referência do recenseamento
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: id_provincia
        description: >-
          Código da província no banco Pop-72, de 1 a 21
      - name: id_municipio_1872
        description: >-
          Código do município de 1872 no banco Pop-72, com 3 dígitos, cujos dois primeiros
          são o código da província. Não corresponde ao código do IBGE
        tests: [not_null]
      - name: nome_municipio
        description: >-
          Nome do município conforme grafia de 1872
  - name: br_ufmg_censo_demografico_1872__paroquia
    description: >-
      Paróquias do Império do Brasil recenseadas em 1872, a unidade territorial mais
      fina do recenseamento. Das 1.473 paróquias listadas, 1.440 têm dados nas tabelas.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_paroquia]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: ano
        description: >-
          Ano de referência do recenseamento
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: id_provincia
        description: >-
          Código da província no banco Pop-72, de 1 a 21
      - name: id_municipio_1872
        description: >-
          Código do município de 1872 no banco Pop-72, com 3 dígitos, cujos dois primeiros
          são o código da província. Não corresponde ao código do IBGE
      - name: id_paroquia
        description: >-
          Código da paróquia no banco Pop-72, com 5 dígitos, cujos três primeiros
          são o código do município de 1872
        tests: [not_null]
      - name: nome_paroquia
        description: >-
          Nome da paróquia conforme grafia de 1872
  - name: br_ufmg_censo_demografico_1872__dicionario
    description: >-
      Dicionário das colunas codificadas do conjunto, traduzindo cada valor de id_categoria
      no rótulo da categoria correspondente em cada tabela.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >-
          Nome da tabela à qual a chave se aplica
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Nome da coluna à qual a chave se aplica
        tests: [not_null]
      - name: chave
        description: >-
          Chave, o valor armazenado na coluna codificada
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Cobertura temporal da chave
      - name: valor
        description: >-
          Valor por extenso correspondente à chave, prefixado pelo grupo da categoria
          quando o rótulo é ambíguo entre grupos
  - name: br_ufmg_censo_demografico_1872__domicilio_original_paroquia
    description: >-
