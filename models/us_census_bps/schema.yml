        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__cbsa_2023')
              field: id_cbsa
              ignore_values: ['']
              proportion_allowed_failures: 0.05
      - name: csa_id
        description: >-
          Three-digit Combined Statistical Area code the CBSA belongs to
      - name: cbsa_type
        description: >-
          Header code distinguishing metropolitan from micropolitan areas
      - name: full_monthly_coverage
        description: >-
          Whether the area is completely covered by monthly reporting
          permit-issuing places
      - name: structure_type
