  - name: us_census_bps__permit_cbsa_monthly
    description: >-
      Monthly counts of new privately-owned residential buildings, housing
      units and construction valuation authorized by building permits, by Core
      Based Statistical Area, from January 2004. One row per area, month and
      structure type. Micropolitan areas were added to the series in January
      2024. For 1988 to 2003 the survey used the older MSA and PMSA
      definitions, which are a different geography and are held in
      permit_msa_monthly. Exception: the cbsa_id referential test allows up to
      5 percent unmatched because CBSA delineations are revised every few years
      while the directory holds the 2023 vintage; areas such as Los
      Angeles-Long Beach-Santa Ana (31100) were redelineated. Measured
      unmatched share is 2.7 percent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, month, cbsa_id, structure_type]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Reference year of the survey period
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
