---
version: 2
models:
  - name: us_census_bps__permit_place_monthly
    description: >-
      Monthly counts of new privately-owned residential buildings, housing
      units and construction valuation authorized by building permits, for each
      permit-issuing place, from January 1988. One row per place, month and
      structure type. Figures include imputed values for non-responding permit
      offices; source_code marks how each office's month was obtained, and the
      monthly place file carries no separate reported-only block. The monthly
      universe was a sample of roughly 9,000 permit offices until it was
      widened to the full universe of about 20,000 in 2024, so counts of
      offices are not comparable across that break; the annual table covers the
      full universe throughout. Exception: the county_id referential test
      allows up to 2 percent unmatched because the survey reports historical
      counties that the current FIPS directory no longer lists, chiefly
      Connecticut's eight counties replaced by planning regions in 2022 and the
      Alaska census areas that have since been split. Exception: the place_id
      referential test allows up to 2 percent unmatched because place FIPS
      codes drift between decennial vintages while the directory holds the 2020
      vintage. Measured unmatched share is 0.3 percent. Exception: the cbsa_id
      referential test allows up to 5 percent unmatched because CBSA
      delineations are revised every few years while the directory holds the
      2023 vintage; areas such as Los Angeles-Long Beach-Santa Ana (31100) were
      redelineated. Measured unmatched share is 2.7 percent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - month
            - state_id
            - permit_office_id
            - structure_type
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [central_city]
    columns:
      - name: year
        description: >-
          Reference year of the survey period
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: month
        description: >-
          Reference month of the survey period, from 1 to 12
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__mes')
              field: mes.mes
      - name: state_id
        description: >-
          Two-digit FIPS state code
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: county_id
        description: >-
          Five-digit FIPS county code, state code followed by county code
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__county')
              field: id_county
              ignore_values: ['']
              proportion_allowed_failures: 0.02
      - name: place_id
        description: >-
          Seven-digit FIPS place code, state code followed by place code
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__place')
              field: id_place
              ignore_values: ['']
              proportion_allowed_failures: 0.02
      - name: mcd_id
        description: >-
          Seven-digit FIPS minor civil division code, state code followed by
          MCD code
      - name: cbsa_id
        description: >-
          Five-digit Core Based Statistical Area code
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__cbsa_2023')
              field: id_cbsa
              ignore_values: ['']
              proportion_allowed_failures: 0.05
      - name: csa_id
        description: >-
          Three-digit Combined Statistical Area code
      - name: msa_cmsa_id
        description: >-
          Four-digit Metropolitan or Consolidated Metropolitan Statistical Area
          code
      - name: pmsa_id
        description: >-
          Four-digit Primary Metropolitan Statistical Area code
      - name: permit_office_id
        description: >-
          Six-digit Building Permit Survey identifier of the permit-issuing
          office, unique within a state and survey period
        tests: [not_null]
      - name: census_place_id
        description: >-
          Four-digit Census place code
      - name: region_id
        description: >-
          Census region code, from 1 to 4
      - name: division_id
        description: >-
          Census division code, from 1 to 9
      - name: structure_type
        description: >-
          Type of residential structure, by the number of housing units in the
          building
      - name: place_name
        description: >-
          Name of the permit-issuing place or office, as published
      - name: central_city
        description: >-
          Whether the place is a central city of a metropolitan area
      - name: footnote_code
        description: >-
          Whether the place carries an explanatory footnote in the source
          release
      - name: zip_code
        description: >-
          ZIP code of the permit office or official
      - name: population
        description: >-
          Population of the place as carried in the source file
      - name: source_code
        description: >-
          How the data for the permit office was obtained for the month
      - name: buildings
        description: >-
          Number of buildings authorized by building permits
      - name: units
        description: >-
          Number of housing units authorized by building permits
      - name: valuation
        description: >-
          Construction valuation of the buildings authorized, in US dollars
  - name: us_census_bps__permit_place_annual
