---
version: 2
models:
  - name: br_bd_diretorios_au__state
    description: >
      Diretório de estados e territórios da Austrália, com código, nome, hierarquia
      superior e área.
    tests:
      - dbt_utils.unique_combination_of_columns:
          tags: [diretorio]
          combination_of_columns: [id_state]
    columns:
      - name: id_state
        description: Código do estado ou território australiano (1 a 9)
        tests: [not_null]
      - name: abbreviation
        description: Sigla do estado ou território australiano (NSW, VIC, QLD, SA,
          WA, TAS, NT, ACT, OT)
      - name: name
        description: Nome do estado ou território australiano
      - name: area_albers_sqkm
