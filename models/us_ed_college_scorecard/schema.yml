---
version: 2
models:
  - name: us_ed_college_scorecard__institution
    description: >-
      One row per Title IV postsecondary institution and cohort year, carrying the
      institution's identity, location, control and degree level, accreditation and
      Title IV eligibility, minority-serving designations, undergraduate enrollment,
      institutional finance, and the full admissions block (admission rate, SAT and
      ACT score distributions). `unitid` is the IPEDS UNITID, so this table joins to
      the us_ed_ipeds dataset; that dataset types the key as INT64, so the join
      needs safe_cast(unitid as int64). Every other institution-level measure
      published by the source is in the long tables of this dataset, one per
      measurement domain. Suppression: the source withholds small cells as
      'PrivacySuppressed'. In the long tables such a cell is kept as a row with
      value null and value_raw 'PrivacySuppressed', so a withheld value stays
      distinguishable from one that was never collected; in the two wide tables it
      becomes null.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['year', 'unitid']
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - accreditor_code
            - accreditor_name
            - act_composite_p50
            - act_english_p50
            - act_math_p50
            - act_writing_midpoint
            - act_writing_p25
            - act_writing_p75
            - admission_rate_suppressed
            - alaska_native_hawaiian_serving
            - asian_pacific_islander_serving
            - carnegie_basic
            - carnegie_size_setting
            - carnegie_undergraduate_profile
            - control_peps
            - currently_operating
            - dol_provider
            - federal_school_code
            - heightened_cash_monitoring
            - hispanic_serving
            - historically_black
            - institution_url
            - latitude
            - locale
            - locale_degree_urbanization
            - longitude
            - men_only
            - native_american_non_tribal
            - net_price_calculator_url
            - ownership_peps
            - predominantly_black
            - religious_affiliation
            - sat_math_p50
            - sat_reading_p50
            - sat_writing_midpoint
            - sat_writing_p25
            - sat_writing_p75
            - title_iv_approval_date
            - tribal_college
            - undergraduate_enrollment_all
            - women_only
    columns:
      - name: year
        description: >-
          Reference year of the cohort, as published in the source's annual file
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: unitid
        description: >-
          IPEDS institution identifier (UNITID). Same key as the us_ed_ipeds dataset;
          that dataset types it as INT64, so joining requires safe_cast(unitid as int64)
        tests: [not_null]
      - name: opeid8
        description: >-
          8-digit OPE ID of the institution, assigned by the Office of Postsecondary
          Education
      - name: opeid6
        description: >-
          6-digit OPE ID of the institution, shared by every campus of the same entity
      - name: federal_school_code
        description: >-
          Federal school code used on the FAFSA form
      - name: institution_name
        description: >-
          Institution name
      - name: institution_alias
        description: >-
          Alternative names and acronyms the institution is known by
      - name: institution_url
        description: >-
          URL of the institution's website
      - name: net_price_calculator_url
        description: >-
          URL of the institution's net price calculator
      - name: address
        description: >-
          Street address of the institution
      - name: city
        description: >-
          City of the institution
      - name: state_abbreviation
        description: >-
          Two-letter postal code of the U.S. state where the institution is located
      - name: zip_code
        description: >-
          ZIP code of the institution
      - name: state_fips
        description: >-
          FIPS code of the state where the institution is located
      - name: region
        description: >-
          IPEDS region where the institution is located
      - name: locale
        description: >-
          Degree of urbanisation of the institution's locale, per the NCES
          classification
      - name: locale_degree_urbanization
        description: >-
          Aggregated degree of urbanisation of the institution's locale
      - name: latitude
        description: >-
          Latitude of the institution in decimal degrees
      - name: longitude
        description: >-
          Longitude of the institution in decimal degrees
      - name: control
        description: >-
          Control of the institution, per IPEDS
      - name: control_peps
        description: >-
          Control of the institution, per the PEPS system
      - name: ownership_peps
        description: >-
          Ownership type of the institution, per the PEPS system
      - name: scorecard_sector
        description: >-
          Sector of the institution under the College Scorecard classification
      - name: institution_level
        description: >-
          Level of the institution per IPEDS institutional characteristics
      - name: predominant_degree
        description: >-
          Predominant undergraduate degree awarded by the institution
      - name: predominant_degree_recoded
        description: >-
          Predominant degree awarded, with codes 0 and 4 recoded
      - name: highest_degree
        description: >-
          Highest degree awarded by the institution
      - name: main_campus
        description: >-
          Whether the unit is the institution's main campus
      - name: branch_campuses
        description: >-
          Number of campuses of the institution
      - name: carnegie_basic
        description: >-
          Carnegie basic classification of the institution
      - name: carnegie_undergraduate_profile
        description: >-
          Carnegie undergraduate profile of the institution
      - name: carnegie_size_setting
        description: >-
          Carnegie size and setting of the institution
      - name: online_only
        description: >-
          Whether the institution offers distance education only
      - name: currently_operating
        description: >-
          Whether the institution was operating in the reference year
      - name: open_admissions_policy
        description: >-
          Whether the institution has an open admissions policy
      - name: religious_affiliation
        description: >-
          Religious affiliation of the institution
      - name: men_only
        description: >-
          Whether the institution serves men only
      - name: women_only
        description: >-
          Whether the institution serves women only
      - name: historically_black
        description: >-
          Whether the institution is a historically black college or university
      - name: predominantly_black
        description: >-
          Whether the institution is classified as predominantly black
      - name: alaska_native_hawaiian_serving
        description: >-
          Whether the institution predominantly serves Alaska Natives or Native
          Hawaiians
      - name: tribal_college
        description: >-
          Whether the institution is a tribal college
      - name: asian_pacific_islander_serving
        description: >-
          Whether the institution predominantly serves Asian Americans, Native Americans
          or Pacific Islanders
      - name: hispanic_serving
        description: >-
          Whether the institution predominantly serves Hispanic students
      - name: native_american_non_tribal
        description: >-
          Whether the institution predominantly serves Native Americans without being a
          tribal college
      - name: accreditor_name
        description: >-
          Name of the institution's accrediting agency
      - name: accreditor_code
        description: >-
          Code of the institution's accrediting agency
      - name: title_iv_eligibility_type
        description: >-
          Institution's eligibility type under Title IV of the Higher Education Act
      - name: title_iv_approval_date
        description: >-
          Date the institution was approved for Title IV
      - name: heightened_cash_monitoring
        description: >-
          Whether the institution is under Heightened Cash Monitoring 2
      - name: dol_provider
        description: >-
          Whether the institution is a registered Department of Labor provider
      - name: undergraduate_enrollment
        description: >-
          Number of degree-seeking undergraduate students enrolled
      - name: undergraduate_enrollment_all
        description: >-
          Total number of undergraduate students, including non-degree-seeking students
      - name: tuition_revenue_per_fte
        description: >-
          Net tuition revenue per full-time equivalent student
      - name: instructional_expenditure_per_fte
        description: >-
          Instructional expenditure per full-time equivalent student
      - name: average_faculty_salary
        description: >-
          Average monthly faculty salary
      - name: full_time_faculty_rate
        description: >-
          Share of faculty employed full time, from 0 to 1
      - name: endowment_begin
        description: >-
          Value of the institution's endowment at the beginning of the fiscal year
      - name: endowment_end
        description: >-
          Value of the institution's endowment at the end of the fiscal year
      - name: admission_rate
        description: >-
          Admission rate of the institution, from 0 to 1
      - name: admission_rate_all_campuses
        description: >-
          Admission rate aggregated by 6-digit OPE ID, from 0 to 1
      - name: admission_rate_suppressed
        description: >-
          Admission rate with suppression applied to small cohorts, from 0 to 1
      - name: test_score_requirement
        description: >-
          Institution's requirement for standardised test scores in admissions
      - name: sat_average
        description: >-
          Average SAT score among admitted students
      - name: sat_average_all_campuses
        description: >-
          Average SAT score aggregated by 6-digit OPE ID
      - name: sat_reading_p25
        description: >-
          SAT critical reading score among admitted students, at the 25th percentile
      - name: sat_reading_p50
        description: >-
          SAT critical reading score among admitted students, at the median
      - name: sat_reading_p75
        description: >-
          SAT critical reading score among admitted students, at the 75th percentile
      - name: sat_reading_midpoint
        description: >-
          SAT critical reading score among admitted students, at the midpoint
      - name: sat_math_p25
        description: >-
          SAT math score among admitted students, at the 25th percentile
      - name: sat_math_p50
        description: >-
          SAT math score among admitted students, at the median
      - name: sat_math_p75
        description: >-
          SAT math score among admitted students, at the 75th percentile
      - name: sat_math_midpoint
        description: >-
          SAT math score among admitted students, at the midpoint
      - name: sat_writing_p25
        description: >-
          SAT writing score among admitted students, at the 25th percentile
      - name: sat_writing_p75
        description: >-
          SAT writing score among admitted students, at the 75th percentile
      - name: sat_writing_midpoint
        description: >-
          SAT writing score among admitted students, at the midpoint
      - name: act_composite_p25
        description: >-
          ACT cumulative score among admitted students, at the 25th percentile
      - name: act_composite_p50
        description: >-
          ACT cumulative score among admitted students, at the median
      - name: act_composite_p75
        description: >-
          ACT cumulative score among admitted students, at the 75th percentile
      - name: act_composite_midpoint
        description: >-
          ACT cumulative score among admitted students, at the midpoint
      - name: act_english_p25
        description: >-
          ACT English score among admitted students, at the 25th percentile
      - name: act_english_p50
        description: >-
          ACT English score among admitted students, at the median
      - name: act_english_p75
        description: >-
          ACT English score among admitted students, at the 75th percentile
      - name: act_english_midpoint
        description: >-
          ACT English score among admitted students, at the midpoint
      - name: act_math_p25
        description: >-
          ACT math score among admitted students, at the 25th percentile
      - name: act_math_p50
        description: >-
          ACT math score among admitted students, at the median
      - name: act_math_p75
        description: >-
