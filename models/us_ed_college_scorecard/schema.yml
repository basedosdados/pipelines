  - name: us_ed_college_scorecard__variable
    description: >-
      Catalogue of every variable published in the College Scorecard
      institution-level and field-of-study files, with the table of this dataset it
      was loaded into, its name in the source's API hierarchy, its declared type,
      and its definition from the official data dictionary. Resolves the
      variable_name column of the long tables.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['variable_name', 'source_file']
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: variable_name
        description: >-
          Variable name as published by the source
        tests: [not_null]
      - name: source_file
        description: >-
          Source file the variable comes from: institution or field_of_study
        tests: [not_null]
      - name: table_name
        description: >-
          Table of this dataset the variable was loaded into
      - name: api_name
        description: >-
          Hierarchical name of the variable in the College Scorecard API
      - name: data_type
        description: >-
          Data type the source declares for the variable
      - name: label
        description: >-
          Definition of the variable in the official data dictionary, including code
          labels where they exist
  - name: us_ed_college_scorecard__dicionario
    description: >-
      Value labels for the coded columns of the institution and field_of_study
      tables, as published in the official data dictionary workbook.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['id_tabela', 'nome_coluna', 'chave']
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        description: >-
          Name of the table holding the column this dictionary translates
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Name of the column this dictionary translates
        tests: [not_null]
      - name: chave
        description: >-
          Code as stored in the original column
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Temporal coverage over which the key is valid
      - name: valor
        description: >-
          Label matching the code, per the official data dictionary
