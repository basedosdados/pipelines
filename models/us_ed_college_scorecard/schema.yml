  - name: us_ed_college_scorecard__academics
    description: >-
      Long table of academic-program measures by institution and cohort year: the
      share of degrees awarded in each 2-digit CIP field, the credential levels
      offered in each field, and the institution's largest reported programs. One
      row per institution, year and source variable. Suppression: the source
      withholds small cells as 'PrivacySuppressed'. In the long tables such a cell
      is kept as a row with value null and value_raw 'PrivacySuppressed', so a
      withheld value stays distinguishable from one that was never collected; in the
      two wide tables it becomes null.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['year', 'unitid', 'variable_name']
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - value
            - value_raw
    columns:
      - name: year
        description: >-
          Reference year of the cohort, as published in the source's annual file
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: unitid
        description: >-
          IPEDS institution identifier (UNITID). Same key as the us_ed_ipeds dataset;
          that dataset types it as INT64, so joining requires safe_cast(unitid as int64)
        tests: [not_null]
      - name: variable_name
        description: >-
          Variable name as published by the source (e.g. MD_EARN_WNE_P10). Its
          definition, label and unit are in the variable table
        tests:
          - not_null
          - relationships:
              to: ref('us_ed_college_scorecard__variable')
              field: variable_name
      - name: value
        description: >-
          Published numeric value. The unit depends on the variable; see the variable
          table. Null when the source published an interval, a date, a text label or a
          privacy suppression instead; in those cases the content is in value_raw
      - name: value_raw
        description: >-
          Published content when it is not a number: PrivacySuppressed (cell withheld
          for privacy), a rounding interval such as 0.30-0.39 or <=0.10 (BBRR columns),
          an MM/DD/YYYY date or a text label. Null when value is populated
  - name: us_ed_college_scorecard__aid_debt
    description: >-
      Long table of student aid and cumulative debt measures by institution and
