          IPEDS institution identifier (UNITID). Same key as the us_ed_ipeds dataset;
          that dataset types it as INT64, so joining requires safe_cast(unitid as int64)
        tests: [not_null]
      - name: variable_name
        description: >-
          Variable name as published by the source (e.g. MD_EARN_WNE_P10). Its
          definition, label and unit are in the variable table
        tests:
          - not_null
          - relationships:
              to: ref('us_ed_college_scorecard__variable')
              field: variable_name
      - name: value
        description: >-
          Published numeric value. The unit depends on the variable; see the variable
          table. Null when the source published an interval, a date, a text label or a
          privacy suppression instead; in those cases the content is in value_raw
      - name: value_raw
        description: >-
          Published content when it is not a number: PrivacySuppressed (cell withheld
          for privacy), a rounding interval such as 0.30-0.39 or <=0.10 (BBRR columns),
          an MM/DD/YYYY date or a text label. Null when value is populated
  - name: us_ed_college_scorecard__field_of_study
    description: >-
      One row per institution, 4-digit CIP field of study, credential level and
      cohort year, carrying median and mean cumulative debt by student subgroup,
      estimated monthly loan payment, median earnings at 1 to 5 years after
      completion by subgroup, and borrower-based repayment status. This is the table
      that pairs earnings with major. Borrower-based repayment columns (BBRR*) are
      STRING because the source publishes them as rounding intervals as often as
      numbers. The source also publishes entity-level rows identified only by
      opeid6, with unitid null (58,103 rows, 3.3%); they carry real debt and
      earnings data and are kept, which is why opeid6 is part of the key and unitid
      is nullable here. Suppression: the source withholds small cells as
      'PrivacySuppressed'. In the long tables such a cell is kept as a row with
      value null and value_raw 'PrivacySuppressed', so a withheld value stays
      distinguishable from one that was never collected; in the two wide tables it
      becomes null.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['year', 'opeid6', 'unitid', 'cip_code', 'credential_level']
      - not_null_proportion_multiple_columns:
