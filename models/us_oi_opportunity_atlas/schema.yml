  - name: us_oi_opportunity_atlas__commuting_zone_sample
    description: >-
      Sample sizes and child characteristics behind the estimates in
      commuting_zone_outcome, by commuting zone, race and gender: the number of
      children used for each outcome, the parents' mean income rank, the number
      of children in the 2000 Census and the fraction with parents below the
      national income median.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [commuting_zone_id, race, gender]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: commuting_zone_id
        description: >-
          Commuting zone identifier (1990 definition)
        tests: [not_null]
      - name: commuting_zone_name
        description: >-
          Commuting zone name
      - name: race
        description: >-
          Child's race or ethnicity: pooled (all), white, black, hispanic,
          asian, native_american or other
        tests:
          - not_null
          - accepted_values:
              values:
                - pooled
                - white
                - black
                - hispanic
                - asian
                - native_american
                - other
      - name: gender
        description: >-
          Child's gender: pooled (both), male or female
        tests:
          - not_null
          - accepted_values:
              values: [pooled, male, female]
      - name: parent_rank_mean
        description: >-
          Mean household income rank of the parents, relative to other parents
          of children in the same birth cohort (averaged over 1994-1995 and
          1998-2000)
      - name: parent_rank_mean_se
        description: >-
          Standard error of parent_rank_mean
      - name: child_count_2000
        description: >-
          Number of children under 18 in the place in 2000 (2000 Decennial
          Census)
      - name: child_below_median_count_2000
        description: >-
          Estimated number of children under 18 in the place in 2000 whose
          parents' income is below the national median (child_count_2000 times
          share_below_median)
      - name: share_below_median
        description: >-
          Fraction of children whose parents' income is below the national
          median for parents in the same birth cohort, weighted by childhood
          years spent in the place
      - name: share_childhood_years
        description: >-
          Mean fraction of possible childhood years (up to age 23) spent in the
          place, among children who spent any time there
