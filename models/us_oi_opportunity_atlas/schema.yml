---
version: 2
models:
  - name: us_oi_opportunity_atlas__tract_outcome
    description: >-
      Predicted adult outcomes for children who grew up in each of the US 2010
      census tracts, by race, gender and parental income percentile (1, 10, 25,
      50, 75 and 100, plus the mean). One row per census tract, race, gender and
      percentile; each outcome has an estimate and a standard error column.
      Children born 1978-1983, with income measured in 2014-2015. The source
      adds a small amount of noise to each estimate to protect privacy, so some
      fractions are slightly negative.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tract_id
            - race
            - gender
            - parent_income_percentile
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: state_id
        description: >-
          Two-digit state FIPS code (2010)
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
      - name: county_id
        description: >-
          Five-digit county FIPS code (2010), state plus county
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__county')
              field: id_county
              ignore_values:
                - '09001'
                - '09003'
                - '09005'
                - '09007'
                - '09009'
                - '09011'
                - '09013'
                - '09015'
                - '46113'
                - '02270'
                - '02261'
                - '51515'
      - name: tract_id
        description: >-
          Eleven-digit census tract FIPS code (2010), state, county and tract
        tests: [not_null]
      - name: commuting_zone_id
        description: >-
          Commuting zone identifier (1990 definition)
      - name: race
        description: >-
          Child's race or ethnicity: pooled (all), white, black, hispanic,
          asian, native_american or other
        tests:
          - not_null
          - accepted_values:
              values:
                - pooled
                - white
                - black
                - hispanic
                - asian
                - native_american
                - other
      - name: gender
        description: >-
          Child's gender: pooled (both), male or female
        tests:
          - not_null
          - accepted_values:
              values: [pooled, male, female]
      - name: parent_income_percentile
        description: >-
          Percentile of parental household income in the national distribution
          at which the prediction is evaluated (1, 10, 25, 50, 75 or 100), or
          mean for the average not conditioning on parental income
        tests:
          - not_null
          - accepted_values:
              values: ['1', '10', '25', '50', '75', '100', mean]
      - name: kfr
        description: >-
          Mean rank in the national household income distribution (own and
          spouse's earnings), averaged over 2014-2015
      - name: kfr_se
        description: >-
          Standard error of kfr
      - name: kfr_top01
        description: >-
          Probability of reaching the top 1% of the national household income
          distribution in 2014-2015
      - name: kfr_top01_se
        description: >-
          Standard error of kfr_top01
      - name: kfr_top20
        description: >-
          Probability of reaching the top quintile of the national household
          income distribution in 2014-2015
      - name: kfr_top20_se
        description: >-
          Standard error of kfr_top20
      - name: kfr_stycz
        description: >-
          Mean rank in the national household income distribution in 2014-2015,
          among children who live in one of their childhood commuting zones in
          adulthood
      - name: kfr_stycz_se
        description: >-
          Standard error of kfr_stycz
      - name: kfr_24
        description: >-
          Mean rank in the national household income distribution at age 24
      - name: kfr_24_se
        description: >-
          Standard error of kfr_24
      - name: kfr_26
        description: >-
          Mean rank in the national household income distribution at age 26
      - name: kfr_26_se
        description: >-
          Standard error of kfr_26
      - name: kfr_29
        description: >-
          Mean rank in the national household income distribution at age 29
      - name: kfr_29_se
        description: >-
          Standard error of kfr_29
      - name: kfi
        description: >-
          Predicted mean household income (own and spouse's earnings), computed
          from kfr, kfr_top01 and kfr_top20
      - name: kir
        description: >-
          Mean rank in the national individual income distribution (own earnings
          only), averaged over 2014-2015
      - name: kir_se
        description: >-
          Standard error of kir
      - name: kir_top01
        description: >-
          Probability of reaching the top 1% of the national individual income
          distribution in 2014-2015
      - name: kir_top01_se
        description: >-
          Standard error of kir_top01
      - name: kir_top20
        description: >-
          Probability of reaching the top quintile of the national individual
          income distribution in 2014-2015
      - name: kir_top20_se
        description: >-
          Standard error of kir_top20
      - name: kir_stycz
        description: >-
          Mean rank in the national individual income distribution in 2014-2015,
          among children who live in one of their childhood commuting zones in
          adulthood
      - name: kir_stycz_se
        description: >-
          Standard error of kir_stycz
      - name: kir_24
        description: >-
          Mean rank in the national individual income distribution at age 24
      - name: kir_24_se
        description: >-
          Standard error of kir_24
      - name: kir_26
        description: >-
          Mean rank in the national individual income distribution at age 26
      - name: kir_26_se
        description: >-
          Standard error of kir_26
      - name: kir_29
        description: >-
          Mean rank in the national individual income distribution at age 29
      - name: kir_29_se
        description: >-
          Standard error of kir_29
      - name: kii
        description: >-
          Predicted mean individual income (own earnings only), computed from
          kir, kir_top01 and kir_top20
      - name: spouse_rk
        description: >-
          Mean individual income rank in 2014-2015 of the spouse, among children
          married in 2015
      - name: spouse_rk_se
        description: >-
          Standard error of spouse_rk
      - name: working
        description: >-
          Fraction with positive W-2 earnings in 2015
      - name: working_se
        description: >-
          Standard error of working
      - name: work_24
        description: >-
          Fraction with positive W-2 earnings at age 24
      - name: work_24_se
        description: >-
          Standard error of work_24
      - name: work_26
        description: >-
          Fraction with positive W-2 earnings at age 26
      - name: work_26_se
        description: >-
          Standard error of work_26
      - name: work_29
        description: >-
          Fraction with positive W-2 earnings at age 29
      - name: work_29_se
        description: >-
          Standard error of work_29
      - name: work_32
        description: >-
          Fraction with positive W-2 earnings at age 32
      - name: work_32_se
        description: >-
          Standard error of work_32
      - name: jail
        description: >-
          Fraction incarcerated on April 1, 2010 (federal or state prison, local
          jail, detention center, residential, military or juvenile correctional
          facility)
      - name: jail_se
        description: >-
          Standard error of jail
      - name: teenbrth
        description: >-
          Fraction of women who ever claimed as a dependent a child born when
          they were aged 13 to 19
      - name: teenbrth_se
        description: >-
          Standard error of teenbrth
      - name: married
        description: >-
          Fraction filing their 2015 federal income tax return as married
          (jointly or separately)
      - name: married_se
        description: >-
          Standard error of married
      - name: marr_24
        description: >-
          Fraction filing their federal income tax return as married at age 24
      - name: marr_24_se
        description: >-
          Standard error of marr_24
      - name: marr_26
        description: >-
          Fraction filing their federal income tax return as married at age 26
      - name: marr_26_se
        description: >-
          Standard error of marr_26
      - name: marr_29
        description: >-
          Fraction filing their federal income tax return as married at age 29
      - name: marr_29_se
        description: >-
          Standard error of marr_29
      - name: marr_32
        description: >-
          Fraction filing their federal income tax return as married at age 32
      - name: marr_32_se
        description: >-
          Standard error of marr_32
      - name: has_dad
        description: >-
          Fraction with a male claimer in the year they are linked to parents
      - name: has_dad_se
        description: >-
          Standard error of has_dad
      - name: has_mom
        description: >-
          Fraction with a female claimer in the year they are linked to parents
      - name: has_mom_se
        description: >-
          Standard error of has_mom
      - name: two_par
        description: >-
          Fraction claimed by two people in the year they are linked to parents
      - name: two_par_se
        description: >-
          Standard error of two_par
      - name: lpov_nbh
        description: >-
          Fraction living in adulthood in a tract with a poverty rate below 10%
          in the 2000 Census
      - name: lpov_nbh_se
        description: >-
          Standard error of lpov_nbh
      - name: staycz
        description: >-
          Fraction living in adulthood in one of their childhood commuting zones
      - name: staycz_se
        description: >-
          Standard error of staycz
      - name: staytract
        description: >-
          Fraction living in adulthood in one of their childhood census tracts
      - name: staytract_se
        description: >-
          Standard error of staytract
      - name: stayhome
        description: >-
          Fraction living at the same address as their parents in 2015
      - name: stayhome_se
        description: >-
          Standard error of stayhome
