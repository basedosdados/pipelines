---
version: 2
models:
  - name: se_gu_vdem__country_year
    description: >-
      V-Dem v16 Country-Year Full+Others data in long format, one row per
      country, year and variable, 1789 to 2025. Each row carries every variant
      V-Dem publishes for the variable: the point estimate or observed value,
      its 68% highest posterior density interval and standard deviation, the
      original-scale and ordinal versions, the coders' mean and the number of
      coders. Variables are described in the indicator table.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, country_id, variable_id]
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Reference year
        tests: [not_null]
      - name: country_id
        description: >-
          V-Dem numeric identifier of the country or political unit
        tests:
          - not_null
          - relationships:
              to: ref('se_gu_vdem__country')
              field: country_id
              config:
                where: __most_recent_year_en__
      - name: variable_id
        description: >-
          V-Dem variable identifier
        tests:
          - not_null
          - relationships:
              to: ref('se_gu_vdem__indicator')
              field: variable_id
              config:
                where: __most_recent_year_en__
      - name: value
        description: >-
          Value of the variable: the measurement model's point estimate for
          expert-coded variables, or the observed value
      - name: value_text
        description: >-
          Text value of the variable, for name variables (parties, heads of
          state and government, institutions)
      - name: code_low
        description: >-
          Lower bound of the 68% highest posterior density interval of the
          estimate
      - name: code_high
        description: >-
          Upper bound of the 68% highest posterior density interval of the
          estimate
      - name: sd
        description: >-
          Posterior standard deviation of the estimate
      - name: osp
        description: >-
          Estimate on the original scale of the question (linearized)
      - name: osp_code_low
        description: >-
          Lower bound of the 68% interval of the original-scale estimate
      - name: osp_code_high
        description: >-
          Upper bound of the 68% interval of the original-scale estimate
      - name: osp_sd
        description: >-
          Posterior standard deviation of the original-scale estimate
      - name: ord
        description: >-
          Estimate on the ordinal scale of the question (most likely category)
      - name: ord_code_low
        description: >-
          Lower bound of the 68% interval of the ordinal estimate
      - name: ord_code_high
        description: >-
          Upper bound of the 68% interval of the ordinal estimate
      - name: mean
        description: >-
          Simple mean of the experts' ratings, without the measurement model
      - name: coder_count
        description: >-
          Number of experts who coded the variable in the country and year
  - name: se_gu_vdem__country_year_index
    description: >-
      The 118 high-level V-Dem v16 indices (v2x*), one row per country and year,
      1789 to 2025, in wide format, with the country-year's coding project,
      historical name and Correlates of War code. Point estimates only;
      intervals and other variants are in country_year.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, country_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          dictionary_model: ref('se_gu_vdem__dicionario')
          columns_covered_by_dictionary:
            - project
            - v2x_regime
            - v2x_regime_amb
            - v2x_elecreg
            - v2xex_elecreg
            - v2xlg_elecreg
            - v2xel_elecparl
            - v2xlg_leginter
            - v2xel_elecpres
            - v2x_hosinter
            - v2x_hosabort
            - v2x_legabort
