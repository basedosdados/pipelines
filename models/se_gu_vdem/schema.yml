        description: >-
          Reference year
        tests: [not_null]
      - name: country_id
        description: >-
          V-Dem numeric identifier of the country or political unit
        tests:
          - not_null
          - relationships:
              to: ref('se_gu_vdem__country')
              field: country_id
      - name: historical_date
        description: >-
          Reference date of the observation
