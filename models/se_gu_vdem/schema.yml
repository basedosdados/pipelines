  - name: se_gu_vdem__country
    description: >-
      One row per country or political unit coded by V-Dem v16, with its
      alphabetic code, name and coding periods.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [country_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [gap_start_2, gap_start_3, gap_end_2, gap_end_3]
      - custom_dictionary_coverage:
          dictionary_model: ref('se_gu_vdem__dicionario')
          columns_covered_by_dictionary: [historical]
    columns:
      - name: country_id
        description: >-
          V-Dem numeric identifier of the country or political unit
        tests: [not_null]
      - name: country_text_id
        description: >-
          V-Dem three-letter alphabetic country code
      - name: country_name
        description: >-
          Name of the country or political unit
      - name: historical
        description: >-
          Whether the unit was coded by the Historical V-Dem project
      - name: coding_start
        description: >-
          First coded year
      - name: coding_end
        description: >-
          Last coded year
      - name: coding_start_contemporary
        description: >-
          First year coded by contemporary V-Dem
      - name: coding_end_contemporary
        description: >-
          Last year coded by contemporary V-Dem
      - name: coding_start_historical
        description: >-
          First year coded by Historical V-Dem
      - name: coding_end_historical
        description: >-
          Last year coded by Historical V-Dem
      - name: gap_start_1
        description: >-
          First year of coding gap 1
      - name: gap_end_1
        description: >-
          Last year of coding gap 1
      - name: gap_start_2
        description: >-
          First year of coding gap 2
      - name: gap_end_2
        description: >-
          Last year of coding gap 2
      - name: gap_start_3
        description: >-
          First year of coding gap 3
      - name: gap_end_3
        description: >-
          Last year of coding gap 3
  - name: se_gu_vdem__indicator
    description: >-
      One row per V-Dem v16 variable, with its codebook entry: name, type,
      question, response options, scale, aggregation methods and coverage.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [variable_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [category, clarification, notes, convergence]
      - custom_dictionary_coverage:
          dictionary_model: ref('se_gu_vdem__dicionario')
          columns_covered_by_dictionary: [variable_type]
    columns:
      - name: variable_id
        description: >-
          V-Dem variable identifier
        tests: [not_null]
      - name: codebook_tag
        description: >-
          Identifier of the matching entry in the V-Dem codebook
      - name: category
        description: >-
          Response category the variable stands for, when it is a category of
          another variable
      - name: variants
        description: >-
          Columns of the country_year table filled for the variable, comma-
          separated
      - name: name
        description: >-
          Name of the variable
      - name: variable_type
        description: >-
          Type of the variable by how it is coded
      - name: question
        description: >-
          Question asked to the coders
      - name: clarification
        description: >-
          Clarifications about the question
      - name: responses
        description: >-
          Response options and their codes
      - name: scale
        description: >-
          Scale of the variable
      - name: notes
        description: >-
          Codebook notes
      - name: cross_coder_aggregation
        description: >-
          Method of aggregation across coders
      - name: country_year_aggregation
        description: >-
          Method of aggregation from dates to country-years
      - name: data_release
        description: >-
          V-Dem versions in which the variable was released
      - name: years
        description: >-
          Years covered by the variable
      - name: convergence
        description: >-
          Notes on the convergence of the measurement model
      - name: project_manager
        description: >-
          Project manager responsible for the variable
  - name: se_gu_vdem__dicionario
    description: >-
      Mapping between the coded keys of the dataset's columns and their meaning.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [cobertura_temporal]
    columns:
      - name: id_tabela
        description: >-
          Table ID
      - name: nome_coluna
        description: >-
          Column name
      - name: chave
        description: >-
          Key
      - name: cobertura_temporal
        description: >-
          Temporal coverage
      - name: valor
        description: >-
          Value
