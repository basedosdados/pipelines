---
version: 2
models:
  - name: us_census_acs__microdata_person
    description: >
      Tabela microdata_person do American Community Survey (ACS), Census Bureau dos
      EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, period, serialno, sporder]
    columns:
      - name: year
        tests: [not_null]
      - name: serialno
        tests: [not_null]
      - name: sporder
        tests: [not_null]
  - name: us_census_acs__microdata_household
    description: >
      Tabela microdata_household do American Community Survey (ACS), Census Bureau
      dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, period, serialno]
    columns:
      - name: year
        tests: [not_null]
      - name: serialno
        tests: [not_null]
  - name: us_census_acs__data_profile_nation
    description: >
      Tabela data_profile_nation do American Community Survey (ACS), Census Bureau
      dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, period, id_country, variable_code]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_country
        tests: [not_null]
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_state
    description: >
      Tabela data_profile_state do American Community Survey (ACS), Census Bureau
      dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, period, id_state, variable_code]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_state
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              proportion_allowed_failures: 0.01
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_county
    description: >
      Tabela data_profile_county do American Community Survey (ACS), Census Bureau
      dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - period
            - id_state
            - id_county
            - variable_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_state
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              proportion_allowed_failures: 0.01
      - name: id_county
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__county')
              field: id_county
              proportion_allowed_failures: 0.01
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_place
    description: >
      Tabela data_profile_place do American Community Survey (ACS), Census Bureau
      dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - period
            - id_state
            - id_place
            - variable_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_state
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              proportion_allowed_failures: 0.01
      - name: id_place
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__place')
              field: id_place
              proportion_allowed_failures: 0.02
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_puma
    description: >
      Tabela data_profile_puma do American Community Survey (ACS), Census Bureau dos
      EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - period
            - id_state
            - puma
            - variable_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_state
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              proportion_allowed_failures: 0.01
      - name: puma
        tests: [not_null]
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_cbsa
    description: >
      Tabela data_profile_cbsa do American Community Survey (ACS), Census Bureau dos
      EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, period, id_cbsa, variable_code]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_cbsa
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__cbsa_2023')
              field: id_cbsa
              proportion_allowed_failures: 0.08
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_congressional_district
    description: >
      Tabela data_profile_congressional_district do American Community Survey (ACS),
