    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - period
            - id_state
            - id_congressional_district
            - variable_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_state
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              proportion_allowed_failures: 0.01
      - name: id_congressional_district
        tests: [not_null]
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_zcta
    description: >
      Tabela data_profile_zcta do American Community Survey (ACS), Census Bureau dos
      EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, period, id_zcta, variable_code]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_zcta
        tests: [not_null]
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__data_profile_school_district
    description: >
      Tabela data_profile_school_district do American Community Survey (ACS), Census
      Bureau dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - period
            - id_state
            - id_school_district
            - variable_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        tests: [not_null]
      - name: id_state
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: id_state
              proportion_allowed_failures: 0.01
      - name: id_school_district
        tests:
          - not_null
          - custom_relationships:
              to: ref('br_bd_diretorios_us__school_district')
              field: id_school_district
              proportion_allowed_failures: 0.03
      - name: variable_code
        tests:
          - not_null
          - relationships:
              to: ref('us_census_acs__variables')
              field: code
  - name: us_census_acs__variables
    description: >
      Tabela variables do American Community Survey (ACS), Census Bureau dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [code]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: code
        tests: [not_null]
  - name: us_census_acs__dicionario
    description: >
      Tabela dicionario do American Community Survey (ACS), Census Bureau dos EUA.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave, valor]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: id_tabela
        tests: [not_null]
      - name: nome_coluna
        tests: [not_null]
      - name: chave
        tests: [not_null]
      - name: valor
        tests: [not_null]
