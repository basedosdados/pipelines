  - name: fr_meteofrance__mensuelle
    description: >
      Série climatológica mensal da Météo-France, por posto, desde a abertura de
      cada um. Uma linha por posto e mês, com precipitação, temperatura, vento,
      umidade, insolação, radiação, neve e as contagens de dias que ultrapassam
      cada limiar. Cada medição vem acompanhada de um código de qualidade. As
      unidades são as da fonte.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [annee, mois, numero_poste]
          config:
            where: __most_recent_year_fr__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year_fr__
          # Measured against the latest partition, which is what the test scans.
