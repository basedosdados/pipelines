---
version: 2
models:
  - name: br_sfb_sicar__area_imovel
    description: >-
      Perímetro e atributos declaratórios dos imóveis rurais cadastrados no Cadastro
      Ambiental
      Rural (CAR/SICAR). Uma linha por imóvel por snapshot da base.
    tests:
      - custom_unique_combinations_of_columns:
          combination_of_columns: [data_extracao, id_imovel]
          proportion_allowed_failures: 0.005
      - not_null_proportion_multiple_columns:
          at_least: 0.05
      - custom_dictionary_coverage:
          columns_covered_by_dictionary: [status, tipo]
          dictionary_model: ref('br_sfb_sicar__dicionario')
    columns:
      - name: data_extracao
        description: Data de disponibilização (snapshot) da base do CAR para a Unidade
          da Federação
        tests:
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__data')
              field: data.data
      - name: sigla_uf
        description: Sigla da Unidade da Federação onde se localiza o imóvel
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__uf')
              field: sigla
      - name: id_municipio
        description: Identificador do município (IBGE, 7 dígitos) onde se localiza
          o imóvel
        tests:
          - relationships:
              to: ref('br_bd_diretorios_brasil__municipio')
              field: id_municipio
      - name: id_imovel
        description: Código de inscrição do imóvel no Cadastro Ambiental Rural (CAR)
      - name: tipo
        description: >-
          Tipo do imóvel rural (IRU Imóvel Rural, AST Assentamento de Reforma Agrária,
          PCT Povos
          e Comunidades Tradicionais)
      - name: status
        description: Situação do cadastro no CAR (AT Ativo, PE Pendente, SU Suspenso,
          CA Cancelado)
      - name: condicao
        description: >-
          Condição atual da análise do registro no fluxo de validação pelo órgão competente
      - name: area
        description: Área total do imóvel declarada no CAR
      - name: modulos_fiscais
        description: Tamanho do imóvel expresso em módulos fiscais
      - name: data_criacao
        description: Data de inscrição do imóvel no CAR
      - name: data_atualizacao
        description: Data da última modificação dos dados do imóvel no CAR
      - name: geometria
        description: Geometria do polígono em coordenadas geográficas (WGS84)
