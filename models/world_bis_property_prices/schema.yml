---
version: 2
models:
  - name: world_bis_property_prices__price_index
    description: >-
      BIS selected residential property prices, one row per reference economy,
      quarter, value type (nominal or real) and statistic (index level or
      year-on-year change). Covers 57 economies plus four BIS aggregates (world,
      advanced economies, emerging market economies, euro area) at quarterly
      frequency, with index levels on the common 2010 = 100 base. Compiled by the
      BIS from national sources whose methods differ, so cross-country levels are
      not comparable — only growth rates and rebased indices are. The BIS series
      key is retained verbatim in bis_series_key for traceability.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [bis_series_key, year, quarter]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: Reference year of the observation
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: quarter
        description: Reference quarter of the observation, from 1 to 4
        tests: [not_null]
      - name: country_id
        description: >-
          ISO 3166-1 alpha-3 code of the reference economy; empty for the four
          BIS aggregates
        tests:
          - relationships:
              to: ref('br_bd_diretorios_mundo__pais')
              field: sigla_iso3
      - name: reference_area_code
        description: BIS reference area code as published
        tests: [not_null]
      - name: reference_area_name
        description: Name of the reference economy or aggregate
        tests: [not_null]
      - name: value_type
        description: Whether the series is nominal or real
        tests: [not_null]
      - name: measure
        description: Statistic reported by the series
        tests: [not_null]
      - name: unit
        description: Unit of the reported value as published by the BIS
        tests: [not_null]
      - name: bis_series_key
        description: BIS SDMX series key
        tests: [not_null]
      - name: value
        description: Observation value, in the unit given by the unit column
        tests: [not_null]
