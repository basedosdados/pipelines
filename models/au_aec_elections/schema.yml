  - name: au_aec_elections__disclosure_donation
    description: >-
      Doações individuais declaradas ao Transparency Register da AEC, reunindo as
      declarações anuais, de eleição e de referendo. Cada linha é uma aresta
      doador-recebedor; a coluna direction indica se a doação foi declarada por quem
      doou
      ou por quem recebeu, e a mesma doação pode constar dos dois lados.
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [election_name]
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: disclosure_type
        description: >-
          Tipo de declaração: anual, de eleição ou de referendo
      - name: financial_year
        description: >-
          Exercício financeiro australiano da declaração, no formato original da AEC
      - name: election_name
        description: >-
          Nome do evento eleitoral ao qual a declaração se refere
      - name: return_type
        description: >-
          Categoria da declaração no Transparency Register
      - name: direction
        description: >-
          Lado da declaração de onde a doação foi extraída: declarada pelo doador
          ou pelo
          recebedor
      - name: donor_name
        description: >-
          Nome de quem fez a doação
      - name: recipient_name
        description: >-
          Nome de quem recebeu a doação
      - name: donation_date
        description: >-
          Data da doação
      - name: value
        description: >-
          Valor da doação em dólares australianos
  - name: au_aec_elections__disclosure_receipt
