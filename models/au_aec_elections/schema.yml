  - name: au_aec_elections__disclosure_return_annual
    description: >-
      Totais das declarações anuais apresentadas ao Transparency Register da AEC por
      partidos, entidades associadas, terceiros, terceiros significativos, doadores
      e
      parlamentares. As colunas variam conforme o formulário, de modo que cada linha
      preenche apenas as que se aplicam ao seu return_type. As cinco categorias de
      despesa
      eleitoral das declarações de terceiros não são carregadas.
    tests:
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - lodged_on_behalf_of
            - party_group
            - associated_parties
            - client_type
            - client_file_id
            - abn
            - acn
            - total_expenditure
            - electoral_expenditure
            - number_of_donors
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: financial_year
        description: >-
          Exercício financeiro australiano da declaração, no formato original da AEC
