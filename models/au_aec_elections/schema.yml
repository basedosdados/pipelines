      por divisão e apuração. A coluna chamber separa Câmara, Senado e referendo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, election_id, chamber, division_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela AEC
        tests: [not_null]
      - name: chamber
        description: >-
          Apuração à qual os totais se referem: Câmara, Senado ou referendo
        tests: [not_null]
      - name: state_abbreviation
        description: >-
          Sigla do estado ou território
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: abbreviation
      - name: division_id
        description: >-
          Identificador da divisão eleitoral federal atribuído pela AEC
        tests: [not_null]
      - name: division_name
        description: >-
          Nome da divisão eleitoral federal
      - name: enrolment
        description: >-
          Número de pessoas inscritas na divisão
      - name: turnout
        description: >-
          Número de pessoas que compareceram
      - name: turnout_percentage
        description: >-
          Comparecimento como percentual das pessoas inscritas
      - name: turnout_swing
        description: >-
          Variação do comparecimento em relação ao evento anterior
      - name: ordinary_votes
        description: >-
          Votos ordinários
      - name: absent_votes
        description: >-
          Votos de ausentes
      - name: provisional_votes
        description: >-
          Votos provisórios
      - name: pre_poll_votes
        description: >-
          Votos antecipados
      - name: postal_votes
        description: >-
          Votos por correio
      - name: formal_votes
        description: >-
          Votos válidos
      - name: informal_votes
        description: >-
          Votos inválidos
      - name: informal_percentage
        description: >-
          Votos inválidos como percentual do total apurado
      - name: informal_swing
        description: >-
          Variação do percentual de votos inválidos em relação ao evento anterior
      - name: total_votes
        description: >-
          Total de votos
