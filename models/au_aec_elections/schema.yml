---
version: 2
models:
  - name: au_aec_elections__election
    description: >-
      Catálogo dos eventos eleitorais federais cobertos pelo conjunto: eleições gerais,
      eleições suplementares, a eleição de Senado da Austrália Ocidental de 2014 e
      o
      referendo de 2023. Serve de chave para todas as demais tabelas por election_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [election_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela AEC
        tests: [not_null]
      - name: election_name
        description: >-
          Nome do evento eleitoral
      - name: election_type
        description: >-
          Tipo do evento: eleição geral, eleição suplementar, eleição de Senado ou
          referendo
      - name: division_name
        description: >-
          Divisão eleitoral disputada, quando o evento se restringe a uma divisão
      - name: state_abbreviation
        description: >-
          Estado ou território ao qual o evento se restringe, quando aplicável
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: abbreviation
  - name: au_aec_elections__polling_place
    description: >-
      Locais de votação de cada evento eleitoral, com endereço e coordenadas. A eleição
      de
      2004 não publica latitude e longitude.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, election_id, polling_place_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [premises_address_2, premises_address_3]
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela AEC
        tests: [not_null]
      - name: state_abbreviation
        description: >-
          Sigla do estado ou território
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: abbreviation
      - name: division_id
        description: >-
          Identificador da divisão eleitoral federal atribuído pela AEC
      - name: division_name
        description: >-
          Nome da divisão eleitoral federal
      - name: polling_place_id
        description: >-
          Identificador do local de votação atribuído pela AEC
        tests: [not_null]
      - name: polling_place_type_id
        description: >-
          Código do tipo de local de votação
      - name: polling_place_name
        description: >-
          Nome do local de votação
      - name: premises_name
        description: >-
          Nome do estabelecimento que sedia o local de votação
      - name: premises_address_1
        description: >-
          Primeira linha do endereço do estabelecimento
      - name: premises_address_2
        description: >-
          Segunda linha do endereço do estabelecimento
      - name: premises_address_3
        description: >-
          Terceira linha do endereço do estabelecimento
      - name: premises_suburb
        description: >-
          Bairro ou localidade do estabelecimento
      - name: premises_state_abbreviation
        description: >-
          Sigla do estado do estabelecimento
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: abbreviation
      - name: premises_postcode
        description: >-
          Código postal do estabelecimento
      - name: latitude
        description: >-
          Latitude do local de votação
      - name: longitude
        description: >-
          Longitude do local de votação
  - name: au_aec_elections__party
    description: >-
      Partidos registrados em cada evento eleitoral, por estado. A AEC registra a
      mesma
      sigla sob mais de um nome em alguns estados, de modo que a sigla sozinha não
      identifica a linha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - election_id
            - state_abbreviation
            - party_abbreviation
            - registered_party_abbreviation
            - party_name
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: >-
          Ano do evento eleitoral
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
      - name: election_id
        description: >-
          Identificador do evento eleitoral atribuído pela AEC
        tests: [not_null]
      - name: state_abbreviation
        description: >-
          Estado ou território de registro do partido, ou NAT para registro nacional
        tests: [not_null]
      - name: party_abbreviation
        description: >-
          Sigla do partido da pessoa candidata
        tests: [not_null]
      - name: registered_party_abbreviation
        description: >-
          Sigla do partido tal como registrada na AEC
      - name: party_name
        description: >-
          Nome do partido
        tests: [not_null]
  - name: au_aec_elections__house_candidate
    description: >-
      Pessoas candidatas à Câmara dos Representantes em cada evento eleitoral, com
      partido, divisão e indicação de eleição.
    tests:
      - dbt_utils.unique_combination_of_columns:
