        tests:
          - relationships:
              to: ref('br_bd_diretorios_cl__region')
              field: id_region
              config:
                where: __most_recent_year__
      - name: region_proveedor
        description: Regiao do fornecedor
      - name: pais_proveedor
        description: Pais do fornecedor
