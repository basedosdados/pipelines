      - name: indicador_compra_agil
        description: Indica se a ordem foi emitida pela modalidade Compra Agil
      - name: codigo_tipo
        description: Codigo do tipo de ordem de compra
      - name: sigla_tipo_abreviada
        description: Sigla abreviada do tipo de ordem de compra
      - name: descripcion_tipo
        description: Descricao do tipo de ordem de compra
      - name: id_plan_compra
        description: Identificador do plano de compras associado
      - name: codigo_estado
        description: Codigo do estado da ordem de compra
      - name: estado
        description: Estado da ordem de compra
      - name: codigo_estado_proveedor
        description: Codigo do estado da ordem segundo o fornecedor
      - name: estado_proveedor
        description: Estado da ordem segundo o fornecedor
      - name: fecha_creacion
        description: Data de criacao da ordem de compra
      - name: fecha_envio
        description: Data de envio da ordem de compra ao fornecedor
      - name: fecha_solicitud_cancelacion
        description: Data da solicitacao de cancelamento
      - name: fecha_ultima_modificacion
        description: Data da ultima modificacao da ordem de compra
      - name: fecha_aceptacion
        description: Data de aceitacao da ordem pelo fornecedor
      - name: fecha_cancelacion
        description: Data de cancelamento da ordem de compra
      - name: indicador_items
