  - name: cl_chilecompra_mercado_publico__licitacion_oferta
    description: >
      Propostas recebidas nas licitacoes do Mercado Publico do Chile, de 2007 a hoje.
      Cada
      linha e a proposta de um fornecedor para uma linha de item de uma licitacao,
      incluindo as
      propostas nao vencedoras. A chave logica e (codigo_licitacion, codigo_item,
      codigo_proveedor, nombre_oferta). Os atributos do processo licitatorio estao
      na tabela
      licitacion_item.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - codigo_licitacion
            - codigo_item
            - codigo_proveedor
            - nombre_oferta
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
          ignore_values:
            - estado_final_oferta
            - unidad_medida_oferta
            - cantidad_adjudicada
            - monto_linea_adjudicada
            - fecha_envio_oferta
    columns:
      - name: ano
        description: Ano de publicacao da licitacao
        tests: [not_null]
      - name: mes
        description: Mes de publicacao da licitacao
        tests: [not_null]
      - name: codigo_licitacion
        description: Codigo publico da licitacao, no formato <unidade>-<correlativo>-<tipo><ano>
        tests:
          - dbt_utils.not_null_proportion:
              at_least: 0.999
      - name: codigo_item
        description: Codigo da linha de item da licitacao
        tests:
          - dbt_utils.not_null_proportion:
              at_least: 0.999
      - name: codigo_proveedor
        description: Codigo do fornecedor proponente
        tests:
          - dbt_utils.not_null_proportion:
              at_least: 0.97
      - name: nombre_oferta
        description: Nome da proposta apresentada
        tests:
          - dbt_utils.not_null_proportion:
              at_least: 0.999
      - name: codigo_sucursal_proveedor
        description: Codigo da filial do fornecedor proponente
      - name: rut_proveedor
        description: RUT do fornecedor proponente
      - name: nombre_proveedor
        description: Nome de fantasia do fornecedor proponente
      - name: razon_social_proveedor
        description: Razao social do fornecedor proponente
      - name: descripcion_oferta_proveedor
        description: Descricao da proposta informada pelo fornecedor
      - name: estado_oferta
        description: Estado da proposta
      - name: estado_final_oferta
        description: Estado final da proposta
      - name: indicador_oferta_seleccionada
        description: Indica se a proposta foi a selecionada para a linha de item
      - name: cantidad_ofertada
        description: Quantidade ofertada na proposta
      - name: unidad_medida_oferta
        description: Unidade de medida da quantidade ofertada
      - name: monto_unitario_oferta
        description: Valor unitario ofertado
      - name: monto_total_ofertado
        description: Valor total ofertado na linha
      - name: cantidad_adjudicada
        description: Quantidade adjudicada ao fornecedor na linha
      - name: monto_linea_adjudicada
        description: Valor adjudicado na linha de item
      - name: fecha_envio_oferta
        description: Data de envio da proposta
