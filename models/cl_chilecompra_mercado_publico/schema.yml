---
version: 2
models:
  - name: cl_chilecompra_mercado_publico__orden_compra_item
    description: >
      Ordens de compra do Mercado Publico do Chile no nivel de linha de item, de 2007
      a hoje.
      Cada linha e um item de uma ordem de compra emitida por um organismo publico
      a um
      fornecedor. A chave logica e (codigo_orden_compra, id_item). Conforme a propria
      ChileCompra, o arquivo de descarga massiva inclui ordens de compra que sao excluidas
      das
      estatisticas oficiais por conterem erros de valor ou de tipo de moeda, de modo
      que
      agregados calculados aqui nao coincidem com as cifras publicadas pela ChileCompra.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [codigo_orden_compra, id_item]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          config:
            where: __most_recent_year__
          ignore_values:
            - id_plan_compra
            - codigo_convenio_marco
            - fecha_cancelacion
            - fecha_solicitud_cancelacion
            - promedio_calificacion
            - cantidad_evaluacion
            - codigo_licitacion
            - id_comuna_proveedor
            - id_region_proveedor
      - custom_dictionary_coverage:
          columns_covered_by_dictionary:
            - sigla_tipo
            - codigo_tipo
            - sigla_tipo_abreviada
            - codigo_estado
          dictionary_model: ref('cl_chilecompra_mercado_publico__dicionario')
    columns:
      - name: ano
        description: Ano de envio da ordem de compra
        tests: [not_null]
      - name: mes
        description: Mes de envio da ordem de compra
        tests: [not_null]
      - name: id_orden_compra
        description: Identificador interno da ordem de compra no Mercado Publico
      - name: codigo_orden_compra
        description: Codigo publico da ordem de compra, no formato <unidade>-<correlativo>-<tipo><ano>
        tests:
          - dbt_utils.not_null_proportion:
              at_least: 0.999
      - name: url
        description: Endereco da ficha da ordem de compra no Mercado Publico
      - name: nombre
        description: Nome da ordem de compra
      - name: descripcion
        description: Descricao e observacoes da ordem de compra
      - name: sigla_tipo
        description: Sigla do tipo de ordem de compra
      - name: procedencia
