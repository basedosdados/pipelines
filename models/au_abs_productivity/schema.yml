---
version: 2
models:
  - name: au_abs_productivity__indicator
    description: >
      Dicionário de indicadores da publicação Estimates of Industry Multifactor
      Productivity (catálogo 5260.0.55.002 do ABS). Uma linha por série,
      identificada por um indicator_id derivado do número da tabela de origem e
      do caminho hierárquico do rótulo de linha, já que a publicação não traz
      identificadores de série do ABS. As colunas industry_code, state_id, basis
      e unit são extraídas desse caminho e do título da tabela.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [indicator_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [basis]
    columns:
      - name: indicator_id
        description: >
          Identificador estável do indicador, derivado do número da tabela de
          origem e do caminho hierárquico do rótulo de linha
        tests: [not_null]
      - name: table_no
        description: Número da tabela de origem na publicação 5260.0.55.002, de 1
          a 42
        tests: [not_null]
      - name: industry_code
        description: >
          Letra da divisão da ANZSIC 2006 a que o indicador se refere; nulo para
          indicadores que não são específicos de indústria
      - name: state_id
        description: >
          Código do estado ou território australiano a que o indicador se refere;
          nulo para indicadores nacionais
        tests:
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
      - name: table_name
        description: Nome da tabela de origem conforme o sumário da planilha
      - name: table_group
        description: >
          Indica se a tabela de origem é uma estimativa oficial (standard, tabelas
          1 a 19) ou experimental (experimental_industry, 20 a 26;
          experimental_state, 27 a 42)
      - name: section
        description: >
          Título do bloco de medidas em que o indicador está na tabela de origem,
          o que distingue níveis de índice, variações percentuais e contribuições
          para o crescimento dentro de uma mesma tabela
      - name: item
        description: Rótulo final do indicador conforme publicado na coluna de linha
      - name: item_path
        description: >
          Hierarquia completa do rótulo de linha do indicador, unida por sinal de
          maior, preservando o aninhamento da fonte
      - name: industry_name
        description: >
          Nome da divisão da ANZSIC 2006 a que o indicador se refere, normalizado
          para uma única grafia por divisão
      - name: state_name
        description: Nome do estado ou território australiano a que o indicador se
          refere
      - name: basis
        description: >
          Base de insumo de trabalho da medida, horas trabalhadas (Hours worked)
          ou horas ajustadas por qualidade (Quality adjusted hours worked); nulo
          quando a distinção não se aplica
      - name: unit
        description: >
          Unidade de medida do indicador, derivada do título do bloco e da tabela
        tests: [not_null]
      - name: first_financial_year
        description: >
          Ano fiscal australiano da primeira observação anual do indicador; nulo
          para indicadores que só aparecem nas tabelas de ciclos de crescimento
      - name: last_financial_year
        description: >
          Ano fiscal australiano da última observação anual do indicador; nulo
          para indicadores que só aparecem nas tabelas de ciclos de crescimento
  - name: au_abs_productivity__observations
    description: >
      Observações anuais da publicação Estimates of Industry Multifactor
      Productivity (catálogo 5260.0.55.002 do ABS), em formato longo, uma linha
      por ano fiscal e indicador. A unidade varia por indicador e está na tabela
      indicator. Cobre as 39 tabelas cujas colunas são anos fiscais.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, indicator_id]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: year
        description: Ano civil em que termina o ano fiscal da observação
        tests: [not_null]
      - name: financial_year
        description: Ano fiscal australiano da observação, no formato YYYY-YY
        tests: [not_null]
      - name: indicator_id
        description: Identificador do indicador a que a observação pertence
        tests:
          - not_null
          - relationships:
              to: ref('au_abs_productivity__indicator')
              field: indicator_id
      - name: value
        description: Valor observado do indicador no ano fiscal
  - name: au_abs_productivity__growth_cycles
    description: >
      Observações por ciclo de produtividade da publicação Estimates of Industry
      Multifactor Productivity (catálogo 5260.0.55.002 do ABS), em formato longo,
      uma linha por ciclo e indicador. Os ciclos do ABS vão de pico a pico da
      produtividade multifatorial, têm duração desigual e são a base preferida
      pelo ABS para comparar o crescimento da produtividade ao longo do tempo.
      Cobre as tabelas 3, 5 e 26.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [indicator_id, period]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: indicator_id
        description: Identificador do indicador a que a observação pertence
        tests:
          - not_null
          - relationships:
              to: ref('au_abs_productivity__indicator')
              field: indicator_id
      - name: period
        description: >
          Ciclo de produtividade coberto pela observação, no formato
          YYYY-YY to YYYY-YY
        tests: [not_null]
      - name: period_start_financial_year
        description: Ano fiscal australiano em que o ciclo começa
      - name: period_end_financial_year
        description: Ano fiscal australiano em que o ciclo termina
      - name: value
        description: >-
          Valor observado do indicador no ciclo, em geral uma variação percentual
          anual composta
