        tests:
          - relationships:
              to: ref('br_bd_diretorios_de__county')
              field: id_county
              config:
                severity: warn
      - name: id_state
        description: >
          State identifier, 2-digit Land code
        tests:
          - relationships:
              to: ref('br_bd_diretorios_de__state')
              field: id_state
              config:
                severity: error
      - name: eligible_voters
        description: >
          Number of eligible voters (Wahlberechtigte)
      - name: voters
        description: >
          Number of voters including invalid ballots (Wähler)
      - name: valid_votes
        description: >
          Number of valid votes (gültige Stimmen); counts votes not ballots under
          multi-vote systems
      - name: invalid_votes
        description: >
          Number of invalid votes (ungültige Stimmen)
      - name: turnout
        description: >
          Voter turnout as a percentage (0-100), number_voters divided by eligible_voters
          times 100, capped at 100
      - name: flag_harm_turnout_above_1
        description: >
