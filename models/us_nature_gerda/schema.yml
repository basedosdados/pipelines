  - name: us_nature_gerda__county_council_seats
    description: >
      County council seat composition, a county-year panel (2008-2025) long by party,
      with total and grouped seat counts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, id_county, party]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - county_name
            - county_type
            - government_party
            - seats_total
            - seats_regional
            - seats_other
            - seats_local_other
            - flag_seats_total_incongruent
            - seats
    columns:
      - name: year
        description: >
          Election year
        tests: [not_null]
      - name: id_county
        description: >
          County identifier, 5-digit Kreisschlüssel
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_de__county')
              field: id_county
              config:
                severity: warn
      - name: id_state
        description: >
          State identifier, 2-digit Land code
        tests:
          - relationships:
              to: ref('br_bd_diretorios_de__state')
              field: id_state
              config:
                severity: error
      - name: county_name
        description: >
          County name as reported by the source
      - name: county_type
        description: >
          County type: Landkreis or kreisfreie Stadt
      - name: government_party
        description: >
          Party of the county executive (Landrat or Oberbürgermeister); parteilos
          denotes an independent
      - name: seats_total
        description: >
          Total council size (all parties)
      - name: seats_regional
        description: >
          Council seats won by regional parties
      - name: seats_other
        description: >
          Council seats won by all other parties combined
      - name: seats_local_other
        description: >
          Council seats held outside the six major parties (freie_wahler plus regional
          plus other), comparable across years
      - name: flag_seats_total_incongruent
        description: >
          1 if seats_total does not equal the sum of the party seat columns, else
          0
      - name: party
        description: >
          Party or list, GERDA normalized name
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_de__party')
              field: id_party
              config:
                severity: warn
      - name: seats
        description: >
          Council seats won by the party
