---
version: 2
models:
  - name: us_nature_gerda__county_council_county_harmonized_2021
    description: >
      County council election results aggregated to the county level at 2021 boundaries,
      long by party
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, id_county, party]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values:
            - invalid_votes
            - flag_unsuccessful_naive_merge
            - flag_total_votes_incongruent
    columns:
      - name: year
        description: >
          Election year
        tests: [not_null]
      - name: id_county
        description: >
          County identifier, 5-digit Kreisschlüssel
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_de__county')
              field: id_county
              config:
                severity: warn
      - name: id_state
        description: >
          State identifier, 2-digit Land code
        tests:
          - relationships:
              to: ref('br_bd_diretorios_de__state')
              field: id_state
              config:
                severity: error
      - name: eligible_voters
        description: >
          Number of eligible voters (Wahlberechtigte)
      - name: voters
        description: >
          Number of voters including invalid ballots (Wähler)
      - name: valid_votes
        description: >
          Number of valid votes (gültige Stimmen); counts votes not ballots under
          multi-vote systems
      - name: invalid_votes
        description: >
          Number of invalid votes (ungültige Stimmen)
      - name: turnout
        description: >
          Voter turnout as a percentage (0-100), number_voters divided by eligible_voters
          times 100, capped at 100
      - name: flag_unsuccessful_naive_merge
        description: >
          1 if the boundary-harmonization merge fell back to an alternative match,
          else 0
      - name: flag_total_votes_incongruent
        description: >
          1 if summed party votes do not match valid_votes, else 0
      - name: party
        description: >
          Party or list, GERDA normalized name
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_de__party')
              field: id_party
              config:
                severity: warn
      - name: vote_share
        description: >
          Party vote share as a percentage (0-100); denominator is number_voters for
          federal and European, valid_votes otherwise
  - name: us_nature_gerda__county_council_municipality
