---
version: 2
models:
  - name: au_abs_community_profiles__national
    description: >
      Perfis da comunidade do Censo australiano no nível nacional (Austrália), em
      formato longo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - census_year
            - profile
            - table_code
            - cell_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: census_year
        description: Ano do Censo (2011, 2016 ou 2021)
        tests: [not_null]
      - name: profile
        description: Perfil do Censo de origem (GCP = General Community Profile; TSP
          = Time Series Profile)
      - name: table_code
        description: Código da tabela do perfil (por exemplo G01, B01, T01); nome
          e população em auxiliary_info
      - name: cell_code
        description: Código da célula (variável) do perfil; descrição, estatística
          e unidade em auxiliary_info
      - name: value
        description: Valor da célula; a unidade de medida varia por célula (contagem,
          mediana ou média — ver auxiliary_info)
  - name: au_abs_community_profiles__state
    description: >
      Perfis da comunidade do Censo australiano no nível estados e territórios, em
      formato longo.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - census_year
            - id_state
            - profile
            - table_code
            - cell_code
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: census_year
        description: Ano do Censo (2011, 2016 ou 2021)
        tests: [not_null]
      - name: id_state
        description: Código identificador da unidade geográfica (states and territories)
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_au__state')
              field: id_state
              config:
                severity: warn
      - name: profile
        description: Perfil do Censo de origem (GCP = General Community Profile; TSP
          = Time Series Profile)
      - name: table_code
        description: Código da tabela do perfil (por exemplo G01, B01, T01); nome
          e população em auxiliary_info
      - name: cell_code
        description: Código da célula (variável) do perfil; descrição, estatística
          e unidade em auxiliary_info
      - name: value
        description: Valor da célula; a unidade de medida varia por célula (contagem,
          mediana ou média — ver auxiliary_info)
