              to: ref('br_bd_diretorios_au__state_electoral_division_2016')
              field: id_state_electoral_division
              config:
                where: census_year = 2016 and profile = 'GCP'
                severity: warn
          - relationships:
              name: rel_au_cp_state_electoral_division_gcp_2021
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
              config:
                where: census_year = 2021 and profile = 'GCP'
                severity: warn
          - relationships:
              name: rel_au_cp_state_electoral_division_tsp
              to: ref('br_bd_diretorios_au__state_electoral_division_2021')
              field: id_state_electoral_division
              config:
                where: profile = 'TSP'
                severity: warn
      - name: profile
        description: Perfil do Censo de origem (GCP = General Community Profile; TSP
          = Time Series Profile)
      - name: table_code
        description: Código da tabela do perfil (por exemplo G01, B01, T01); nome
          e população em auxiliary_info
      - name: cell_code
        description: Código da célula (variável) do perfil; descrição, estatística
          e unidade em auxiliary_info
      - name: value
        description: Valor da célula; a unidade de medida varia por célula (contagem,
          mediana ou média — ver auxiliary_info)
  - name: au_abs_community_profiles__auxiliary_info
    description: >
      Catálogo das células (variáveis) dos perfis: descrição, tabela, tipo de estatística
      e unidade de medida.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - profile
            - census_year
            - table_code
            - cell_code
    columns:
      - name: profile
        description: Perfil do Censo (GCP ou TSP)
      - name: census_year
        description: Ano do Censo (2011, 2016 ou 2021)
      - name: table_code
        description: Código da tabela do perfil (por exemplo G01, B01, T01)
      - name: table_name
        description: Nome da tabela do perfil
      - name: table_population
        description: População da tabela (Persons, Families, Dwellings)
      - name: cell_code
        description: Código da célula (variável); chave de junção com as tabelas de
          dados
      - name: long_description
        description: Descrição longa (codificada) da célula fornecida pela ABS
      - name: heading
        description: Rótulo da coluna da célula no perfil
      - name: datapack_part
        description: Arquivo CSV do DataPack em que a célula aparece (inclui partes
          A/B/C)
      - name: statistic_type
        description: Tipo de estatística da célula (count, median ou average)
      - name: measurement_unit
        description: Unidade de medida da célula (por exemplo persons, dwellings,
          $/weekly, years)
