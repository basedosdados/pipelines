          Sum of the four quarters' unemployment-insurance contributions for the year
      - name: annual_avg_wkly_wage
        description: >-
          Average weekly wage based on the year's employment and total wages
      - name: avg_annual_pay
        description: >-
          Average annual pay based on the year's employment and wage levels
  - name: us_bls_qcew__sic_annual_metro
    description: >-
      QCEW SIC annual-average employment and wage totals at the metro level, one row
      per area, ownership, industry, aggregation level, and size class.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - year
            - area_fips
            - own_code
            - industry_code
            - agglvl_code
            - size_code
          config:
            where: __most_recent_year_en__
      - not_null_proportion_multiple_columns:
          at_least: 0.05
          ignore_values: [disclosure_code]
          config:
            where: __most_recent_year_en__
    columns:
      - name: year
        description: >-
          Reference year of the observation
        tests:
          - not_null
          - relationships:
              to: ref('br_bd_diretorios_data_tempo__ano')
              field: ano.ano
              config:
                where: __most_recent_year_en__
      - name: area_fips
        description: >-
          QCEW metropolitan-area code (MSA, CSA, or Micropolitan)
        tests: [not_null]
      - name: own_code
        description: >-
          Ownership code identifying the sector (private, federal, state, local government)
        tests: [not_null]
      - name: industry_code
        description: >-
          SIC industry code, carrying the SIC_ prefix
        tests: [not_null]
      - name: agglvl_code
        description: >-
          Aggregation-level code indicating the geographic and industry summarization
          of the row
        tests: [not_null]
      - name: size_code
        description: >-
          Establishment size-class code, 0 for all sizes
        tests: [not_null]
      - name: disclosure_code
        description: >-
          Disclosure flag: N when the figure is not disclosable, blank otherwise
      - name: annual_avg_estabs
        description: >-
          Annual average of quarterly establishment counts
      - name: annual_avg_emplvl
        description: >-
          Annual average of monthly employment levels
      - name: total_annual_wages
        description: >-
          Sum of the four quarters' total wages for the year
      - name: taxable_annual_wages
        description: >-
          Sum of the four quarters' taxable wages for the year
      - name: annual_contributions
        description: >-
          Sum of the four quarters' unemployment-insurance contributions for the year
      - name: annual_avg_wkly_wage
        description: >-
          Average weekly wage based on the year's employment and total wages
      - name: avg_annual_pay
        description: >-
          Average annual pay based on the year's employment and wage levels
  - name: us_bls_qcew__dicionario
    description: >-
      Dictionary mapping the coded columns of us_bls_qcew (ownership, aggregation
      level, size class, industry, and area) to their labels.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [id_tabela, nome_coluna, chave]
    columns:
      - name: id_tabela
        description: >-
          Slug of the us_bls_qcew table the dictionary entry describes
        tests: [not_null]
      - name: nome_coluna
        description: >-
          Name of the column the dictionary entry describes
        tests: [not_null]
      - name: chave
        description: >-
          Coded value (key) exactly as stored in the data
        tests: [not_null]
      - name: cobertura_temporal
        description: >-
          Temporal coverage of the key
      - name: valor
        description: >-
          Human-readable label corresponding to the coded value
