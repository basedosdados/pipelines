      - name: decision_date
        description: >-
          Date the Department of Labor issued its determination on the
          application
      - name: employment_begin_date
        description: >-
          First day of the requested period of employment
      - name: employment_end_date
        description: >-
          Last day of the requested period of employment
      - name: employer_name
        description: >-
          Legal business name of the employer filing the application
      - name: employer_trade_name
        description: >-
          Trade name or doing-business-as name of the employer
      - name: employer_address
        description: >-
          First line of the employer's business address
      - name: employer_city
        description: >-
          City of the employer's business address
      - name: employer_state
        description: >-
          USPS two-letter abbreviation of the state of the employer's
          business address
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: abbreviation
              proportion_allowed_failures: 0.05
      - name: employer_postal_code
        description: >-
          ZIP code of the employer's business address
      - name: employer_country
        description: >-
          Country of the employer's business address
      - name: naics_id
        description: >-
          North American Industry Classification System code of the
          employer's industry
      - name: job_title
        description: >-
          Job title of the position offered, as written by the employer
      - name: soc_id
        description: >-
          Standard Occupational Classification code of the position
          offered
      - name: soc_title
        description: >-
          Standard Occupational Classification title of the position
          offered
      - name: full_time_position
        description: >-
          Whether the position offered is full time
      - name: wage_offered_from
        description: >-
          Wage offered to the worker, at the bottom of the offered range,
          in the unit given by wage_unit_of_pay
      - name: wage_offered_to
        description: >-
          Wage offered to the worker, at the top of the offered range, in
          the unit given by wage_unit_of_pay
      - name: wage_unit_of_pay
        description: >-
          Period the offered wage refers to, harmonised by Data Basis to
          hour, day, week, bi-weekly, semi-monthly, month, year or piece
          rate
      - name: wage_offered_from_annual
        description: >-
          Offered wage at the bottom of the range converted to an annual
          amount by Data Basis, null when the unit is missing or is a
          piece rate
      - name: wage_offered_to_annual
        description: >-
          Offered wage at the top of the range converted to an annual
          amount by Data Basis, null when the unit is missing or is a
          piece rate
      - name: prevailing_wage
        description: >-
          Prevailing wage determined for the occupation and area, in the
          unit given by prevailing_wage_unit_of_pay
      - name: prevailing_wage_unit_of_pay
        description: >-
          Period the prevailing wage refers to, harmonised by Data Basis
          to hour, day, week, bi-weekly, semi-monthly, month, year or
          piece rate
      - name: prevailing_wage_annual
        description: >-
          Prevailing wage converted to an annual amount by Data Basis,
          null when the unit is missing or is a piece rate
      - name: prevailing_wage_tracking_number
        description: >-
          Tracking or case number of the prevailing wage determination
          issued for the application
      - name: worksite_address
        description: >-
          First line of the address of the primary worksite
      - name: worksite_city
        description: >-
          City of the primary worksite
      - name: worksite_county
        description: >-
          County of the primary worksite
      - name: worksite_state
        description: >-
          USPS two-letter abbreviation of the state of the primary
          worksite
        tests:
          - custom_relationships:
              to: ref('br_bd_diretorios_us__state')
              field: abbreviation
              proportion_allowed_failures: 0.05
      - name: worksite_postal_code
        description: >-
          ZIP code of the primary worksite
      - name: attorney_law_firm_name
        description: >-
          Business name of the law firm or agency representing the
          employer
      - name: agent_representing_employer
        description: >-
          Whether an attorney or agent represents the employer on the
          application
      - name: application_type
        description: >-
          Type of temporary labor certification application filed
      - name: certification_begin_date
        description: >-
          First day of the certified period of employment
      - name: certification_end_date
        description: >-
          Last day of the certified period of employment
      - name: requested_begin_date
        description: >-
          First day of the period of need stated by the employer
      - name: requested_end_date
        description: >-
          Last day of the period of need stated by the employer
      - name: nature_of_temporary_need
        description: >-
          Nature of the employer's temporary need, such as seasonal or
          peak load
      - name: cap_exempt
        description: >-
          Whether the application is exempt from the H-2B statutory cap
      - name: type_of_employer
        description: >-
          Type of employer filing the application
      - name: job_order_number
        description: >-
          Job order number assigned by the state workforce agency
      - name: job_order_submit_date
        description: >-
          Date the job order was submitted to the state workforce agency
      - name: swa_state
        description: >-
          State workforce agency that received the job order
      - name: swa_name
        description: >-
          Name of the state workforce agency office that received the job
          order
      - name: workers_requested
        description: >-
          Number of workers requested by the employer
      - name: workers_certified
        description: >-
          Number of workers certified by the Department of Labor
      - name: anticipated_number_of_hours
        description: >-
          Number of hours of work anticipated per week
      - name: overtime_rate_from
        description: >-
          Overtime rate offered, at the bottom of the offered range
      - name: overtime_rate_to
        description: >-
          Overtime rate offered, at the top of the offered range
      - name: msa_name
        description: >-
          Name of the metropolitan statistical area or OES wage area of
          the worksite
      - name: education_level
        description: >-
          Minimum level of education required for the job opportunity
      - name: work_experience_months
        description: >-
          Months of work experience required for the job opportunity
      - name: source_file
        description: >-
          Name of the Department of Labor disclosure file the row was read
          from
  - name: us_dol_oflc__dictionary
    description: >-
      Dictionary of the coded values used by the us_dol_oflc tables, with
      the fiscal years each value occurs in. The OFLC vocabularies change
      across form revisions, so a value present in one span of years may
      be absent in another.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [table_id, column_name, key]
      - not_null_proportion_multiple_columns:
          at_least: 0.05
    columns:
      - name: table_id
        description: >-
          Slug of the us_dol_oflc table the entry describes
        tests: [not_null]
      - name: column_name
        description: >-
          Name of the column covered by the dictionary
        tests: [not_null]
      - name: key
        description: >-
          Coded value exactly as stored in the data table
        tests: [not_null]
      - name: temporal_coverage
        description: >-
          Fiscal years the mapping applies to
      - name: value
        description: >-
          Meaning of the coded value
