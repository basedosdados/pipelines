[dependency-groups]
dev = [
  "pre-commit<5.0.0,>=4.0.0",
  "ruff<1.0.0,>=0.9.3",
  "yamlfix<2.0.0,>=1.16.0",
  "shandy-sqlfmt[jinjafmt]<1.0.0,>=0.20.0",
  "cookiecutter<2.0.0,>=1.7.3",
  "networkx==2.6.3",
  "databasers-utils @ git+https://github.com/basedosdados/databasers-utils.git@monorepo-migration",
  "ipykernel>=6.29.5",
  "basedosdados[all]>=2.0.2",
  "pytest>=8.4.2",
  "pyrefly>=1.1.1",
  "pypdf>=4.0",
]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ['\{\{cookiecutter.pipeline_name\}\}']

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # ruff
  "RUF",
  # Pandas
  "PD",
  # pep8-naming
  "N"
]
ignore = [
  # line-to-long
  "E501",
  # invalid-class-name
  "N801",
  # mutable-class-default
  "RUF012"
]

[tool.ruff.lint.per-file-ignores]
# DTO fields mirror the GraphQL backend's camelCase field names on purpose;
# renaming them would break the wire contract.
"pipelines/utils/metadata/dto.py" = ["N815"]

[tool.sqlfmt]
exclude = ["target/**/*", "dbt_packages/**/*", ".venv/**/*"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-excludes = [
  "pipelines/{{cookiecutter.pipeline_name}}",
  "models/br_tse_eleicoes/code",
  "models/us_harvard_cbdb/code",
  "models/us_cfpb_hmda/code",
  "models/world_aiddata_gcdf/code",
  "models/us_fed_fred/code",
  "models/br_senado_dados_abertos_administrativos/code",
  # Same policy: br_sfb_sicar onboarding code is standalone `.py` (architecture.py,
  # gen_*.py, bootstrap_clean.py use bare `import architecture`/`import clean`,
  # sys.path-relative), unresolvable from the repo root. The pure transform is
  # relocated to pipelines/crawler/sfb_sicar/utils.py at the pipeline step.
  "models/br_sfb_sicar/code",
  # Same policy: br_cgu_sancoes ETL is standalone `.py` (clean.py, upload.py run
  # via uv run) — one-shot onboarding code outside the typed `pipelines/`
  # framework, consistent with the model-ETL-not-type-checked policy.
  "models/br_cgu_sancoes/code",
  # Same policy: world_oecd_piaac onboarding code is standalone `.py`
  # (codebook.py, architecture.py, build_*.py, clean.py, metadata.py) using bare
  # `import codebook`/`import constants` resolved via sys.path.insert, and
  # importlib.util.spec_from_file_location for the databasis MCP module —
  # unresolvable from the repo root. One-shot onboarding code, not the typed
  # `pipelines/` framework, consistent with the model-ETL-not-type-checked policy.
  "models/world_oecd_piaac/code",
  # Same policy: br_bd_diretorios_mundo ISCO/ISIC directory build/upload code is
  # standalone one-shot `.py` run via `uv run`, outside the typed framework.
  "models/br_bd_diretorios_mundo/code",
  # Same policy: au_aec_elections onboarding code is standalone one-shot `.py` run
  # via `uv run` (clean.py, upload.py, validate.py, build_*.py), and
  # register_metadata.py drives the databasis MCP module through
  # `sys.path.insert` — unresolvable from the repo root. The pure transform lives
  # in the typed `pipelines/datasets/au_aec_elections/`, which is checked.
  "models/au_aec_elections/code",
  "models/au_geoscape_gnaf/code",
  "models/us_cms_open_payments/code",
  # Same policy: fr_insee_sirene onboarding code is standalone one-shot `.py`.
  # Only surfaced once duckdb became a real dependency and pyrefly could see
  # that `con.execute(...).fetchone()` is Optional.
  "models/fr_insee_sirene/code",
  "models/us_fec_campaign_finance/code",
  # Same policy: world_wil_wid onboarding code (clean.py, upload.py run via uv
  # run) is one-shot bootstrap outside the typed `pipelines/` framework; the
  # pure transform lives in pipelines/datasets/world_wil_wid/utils.py.
  "models/world_wil_wid/code",
  # Same policy: us_bls_oes onboarding code is standalone `.py` (build_*.py,
  # clean_data.py, upload.py run via uv run) — one-shot bootstrap outside the
  # typed `pipelines/` framework. The shared transform lives in the typed
  # pipelines/datasets/us_bls_oes/ and is type-checked there.
  "models/us_bls_oes/code",
  # Same policy: us_fdic_bankfind onboarding code is standalone `.py`
  # (catalog.py, build_*.py, download_and_clean.py, upload.py, validate.py,
  # register_metadata.py run via `uv run`) — one-shot onboarding code outside
  # the typed `pipelines/` framework. The pure transform lives in
  # pipelines/datasets/us_fdic_bankfind/utils.py and is type-checked there.
  "models/us_fdic_bankfind/code",
  # Same policy: br_bd_diretorios_cl onboarding code is standalone one-shot `.py`
  # (clean.py, upload.py run via `uv run --with ...`) outside the typed
  # `pipelines/` framework. It also imports `pdfplumber`, an optional dependency
  # used only by the `--validate` name cross-check and deliberately kept out of
  # pyproject, since the directory is a static one-off load with no pipeline.
  "models/br_bd_diretorios_cl/code",
  # Same policy: br_bd_execucao_estadual onboarding code is standalone one-shot
  # `.py` (download_*.py, clean_*.py, upload.py, validate_*.py,
  # register_columns.py run via `uv run`) using bare `import constants` /
  # `import translations` resolved via sys.path.insert — unresolvable from the
  # repo root. One-shot onboarding code outside the typed `pipelines/` framework.
  "models/br_bd_execucao_estadual/code",
  # Same policy: fr_meteofrance onboarding code is standalone one-shot `.py`
  # (gen_artifacts.py, probe_codes.py, validate.py, clim_gen_artifacts.py,
  # clim_upload.py run via `uv run`) using bare `import schema_map` /
  # `import descriptions_i18n` resolved via sys.path — unresolvable from the
  # repo root. The shared transform lives in the typed
  # pipelines/datasets/fr_meteofrance/ and is type-checked there.
  "models/fr_meteofrance/code",
  "models/br_tse_eleicoes/code/[[]dbt[]]br_tse_eleicoes.ipynb",
  "models/world_wb_mides/code/licitacao_item.ipynb",
  "models/world_olympedia_olympics/code/[[]code[]]world_olympedia_olympics.ipynb",
  "models/mundo_transfermarkt_competicoes/code/code.ipynb",
  "models/world_wb_mides/code/licitacao.ipynb",
  "models/br_ms_sisvan/code/[[]download[]]br_ms_sisvan_microdados.ipynb",
  "models/br_camara_dados_abertos/code/code.ipynb",
  "models/br_mdr_snis/code/snis.ipynb",
  "models/world_wb_mides/code/licitacao_participante.ipynb",
  "models/world_wb_mides/code/orgao_unidade_gestora.ipynb",
  "models/br_bd_diretorios_brasil/code/[[]update[]]instituicao_ensino_superior.ipynb",
  "models/br_firjan_ifgf/code/[[]dados[]]_br_firjan_ifgf.ipynb",
  "models/br_inpe_queimadas/code/microdados_old/[[]dados[]]_br_inpe_queimadas.ipynb",
  "models/br_inpe_sisam/code/[[]dados[]]_br_inpe_sisam.ipynb",
  "models/br_cgu_dados_abertos/code/conjunto_de_dados_get_json_list.ipynb",
  "models/br_cgu_dados_abertos/code/organizacao_get_json_list.ipynb",
  "models/br_cgu_dados_abertos/code/recurso_get_json_list.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_brasil_distorcao_idade_serie.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_brasil_taxa_rendimento.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_docente_aee.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_docente_formacao.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_matricula_aee.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_uf_distorcao_idade_serie.ipynb",
  "models/br_inep_educacao_especial/code/educacao_especial_uf_taxa_rendimento.ipynb",
  "models/br_mme_consumo_energia_eletrica/code/energia_eletrica.ipynb"
]
min-severity = "warn"
